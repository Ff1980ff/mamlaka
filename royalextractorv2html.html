<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 المُستخلص الملكي | The Royal Extractor</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 30, 0.8);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f0ff;
            --gold: #ffd700;
            --text-white: #fff;
            --success: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
        }

        header {
            width: 100%; text-align: center; padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 1.8rem; margin: 0;
            background: linear-gradient(to right, var(--neon-purple), var(--neon-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #aaa; font-size: 0.9rem; margin-top: 5px; }

        .capture-zone {
            width: 90%; max-width: 600px;
            background: var(--panel-bg);
            border: 2px dashed var(--neon-cyan);
            border-radius: 20px;
            padding: 30px; margin: 30px auto;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: var(--neon-cyan); font-weight: bold; }
        
        textarea, input[type="text"], input[type="number"], select {
            width: 100%; padding: 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff; font-family: inherit; font-size: 1rem;
        }
        textarea:focus, input:focus, select:focus { outline: none; border-color: var(--neon-purple); }

        .actions { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .btn {
            padding: 12px 25px; border: none; border-radius: 50px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px; font-family: inherit;
        }
        .btn-extract { background: var(--neon-cyan); color: #000; }
        .btn-pdf { background: var(--gold); color: #000; }
        .btn-clear { background: transparent; border: 1px solid #555; color: #888; }
        
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        .result-preview {
            width: 90%; max-width: 600px;
            background: #111;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            display: none; 
            border: 1px solid #333;
        }
        .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .preview-title { font-size: 1.2rem; font-weight: bold; color: var(--gold); }
        
        .json-output {
            background: #000; color: #0f0;
            font-family: monospace; font-size: 0.8rem;
            padding: 15px; border-radius: 8px;
            margin-top: 15px; max-height: 150px; overflow-y: auto;
            border: 1px solid #333; direction: ltr; text-align: left;
        }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--success); color: #000;
            padding: 15px 30px; border-radius: 50px;
            font-weight: bold; opacity: 0; transition: 0.5s;
            z-index: 1000; box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
        #toast.show { opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-magic"></i> المُستخلص الملكي</h1>
    <div class="subtitle">حوّل أي محتوى إلى منتج رقمي جاهز للبيع في ثوانٍ</div>
</header>

<div class="capture-zone">
    <div style="font-size: 2rem; color: var(--neon-cyan); margin-bottom: 15px;">
        <i class="fab fa-tiktok"></i> <i class="fab fa-youtube"></i> <i class="fas fa-file-alt"></i>
    </div>
    
    <div class="input-group">
        <label>1. الصق الرابط أو النص هنا:</label>
        <textarea id="sourceInput" rows="3" placeholder="مثال: رابط فيديو تعليمي طويل..."></textarea>
    </div>

    <div class="input-group">
        <label>2. اختر نوع المنتج المقترح:</label>
        <select id="productType">
            <option value="video_course">دورة / ملخص فيديو</option>
            <option value="ebook_guide">كتاب إلكتروني / دليل</option>
            <option value="template_code">قالب كود / أداة برمجية</option>
        </select>
    </div>

    <div class="actions">
        <button class="btn btn-extract" onclick="extractContent()">
            <i class="fas fa-bolt"></i> استخراج وتوليد
        </button>
        <button class="btn btn-clear" onclick="clearAll()">
            <i class="fas fa-trash"></i> مسح الكل
        </button>
    </div>
</div>

<!-- منطقة المعاينة والتصدير -->
<div class="result-preview" id="resultArea">
    <div class="preview-header">
        <span class="preview-title"><i class="fas fa-box-open"></i> بطاقة المنتج الجاهزة</span>
        <span style="color:var(--success)">✅ تم التوليد</span>
    </div>
    
    <div class="input-group">
        <label>عنوان المنتج (قابل للتعديل):</label>
        <input type="text" id="finalTitle">
    </div>

    <div class="input-group">
        <label>السعر المقترح ($):</label>
        <input type="number" id="finalPrice" step="0.01">
    </div>

    <div class="input-group">
        <label>الوصف التسويقي (مولد تلقائياً):</label>
        <textarea id="finalDesc" rows="4"></textarea>
    </div>

    <div class="json-output" id="jsonOutput"></div>

    <div class="actions" style="margin-top: 20px;">
        <button class="btn btn-pdf" onclick="downloadAsPDF()">
            <i class="fas fa-file-pdf"></i> تحميل كـ PDF (للنشر)
        </button>
        <button class="btn btn-extract" style="background:#333; color:#fff;" onclick="copyJSON()">
            <i class="fas fa-copy"></i> نسخ JSON
        </button>
    </div>
</div>

<div id="toast">تم الاستخراج بنجاح!</div>

<script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function clearAll() {
        document.getElementById('sourceInput').value = '';
        document.getElementById('resultArea').style.display = 'none';
    }

    function extractContent() {
        const source = document.getElementById('sourceInput').value.trim();
        const type = document.getElementById('productType').value;
        
        if (!source) { alert("الصق رابطاً أولاً!"); return; }

        let title = "", desc = "", price = 4.99;

        // منطق توليد المحتوى الذكي
        if (type === 'video_course') {
            title = "ملخص حصري: " + source.substring(0, 25) + "...";
            desc = "وفر وقتك! هذا الملخص يجمع أهم النقاط من المصدر المذكور.\n✔️ خلاصة مركزة\n✔️ تمارين تطبيقية\n✔️ وصول فوري";
            price = 9.99;
        } else if (type === 'ebook_guide') {
            title = "دليل شامل: أسرار النجاح الرقمي";
            desc = "ملف PDF منظم يحتوي على خطة عمل واضحة.\n📚 50 صفحة غنية\n🎁 يشمل قوالب جاهزة";
            price = 4.99;
        } else if (type === 'template_code') {
            title = "قالب ويب احترافي جاهز";
            desc = "كود نظيف ومنظم يمكنك استخدامه مباشرة.\n💻 متجاوب 100%\n⚡ سرعة عالية";
            price = 14.99;
        }

        document.getElementById('finalTitle').value = title;
        document.getElementById('finalPrice').value = price;
        document.getElementById('finalDesc').value = desc;

        const productData = { title, price, description: desc, category: type, source_url: source };
        document.getElementById('jsonOutput').innerText = JSON.stringify(productData, null, 2);
        
        document.getElementById('resultArea').style.display = 'block';
        showToast("تم توليد بطاقة المنتج!");
    }

    function copyJSON() {
        navigator.clipboard.writeText(document.getElementById('jsonOutput').innerText);
        showToast("تم نسخ الكود!");
    }

    // دالة تصدير PDF الجديدة والمبسطة
    function downloadAsPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const title = document.getElementById('finalTitle').value;
        const price = document.getElementById('finalPrice').value;
        const desc = document.getElementById('finalDesc').value;
        const source = document.getElementById('sourceInput').value;

        // تنسيق الرأس
        doc.setFontSize(18);
        doc.setTextColor(188, 19, 254); // Purple
        doc.text("Royal Extractor Product Card", 10, 20);
        
        doc.setDrawColor(200);
        doc.line(10, 25, 200, 25); 

        // التفاصيل
        doc.setFontSize(14);
        doc.setTextColor(0);
        doc.text(`Product Title: ${title}`, 10, 35);
        
        doc.setFontSize(12);
        doc.setTextColor(255, 165, 0); // Orange
        doc.text(`Suggested Price: $${price}`, 10, 45);

        doc.setTextColor(0);
        doc.text("Description:", 10, 55);
        const splitDesc = doc.splitTextToSize(desc, 180);
        doc.text(splitDesc, 10, 65);

        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Source Ref: ${source.substring(0, 60)}...`, 10, 90);
        doc.text("Generated by Mamlaka Apps - Nexus Digital Solutions", 10, 280);

        doc.save(`royal_product_${Date.now()}.pdf`);
        showToast("تم تحميل ملف الـ PDF!");
    }
</script>

</body>
</html>
