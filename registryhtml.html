<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --gold: #fbbf24;
            --green: #10b981;
            --red: #ef4444;
            --blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; min-height: 100vh; }

        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--gold); padding-bottom: 15px; }
        h1 { color: var(--gold); font-size: 1.8rem; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 5px; }

        /* لوحة التحكم */
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--green); color: white; }
        .btn-export { background: var(--blue); color: black; }
        .btn-import { background: var(--gold); color: black; }
        .btn-clear { background: var(--red); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* الجدول */
        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background: rgba(255,255,255,0.05); color: var(--gold); font-weight: bold; position: sticky; top: 0; }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* حقول الإدخال داخل الجدول */
        input[type="text"], select { 
            width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border); 
            color: white; border-radius: 6px; font-size: 0.85rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--gold); }

        /* حالات التطبيق */
        .status-ready { color: var(--green); font-weight: bold; }
        .status-pending { color: var(--gold); font-weight: bold; }
        .status-draft { color: var(--text-muted); }

        /* أزرار صغيرة */
        .action-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 5px; }
        .action-btn.delete { color: var(--red); border-color: var(--red); }
        .action-btn.open-link { color: var(--blue); border-color: var(--blue); }
        .action-btn:hover { background: rgba(255,255,255,0.1); }

        /* رسالة فارغة */
        .empty-msg { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <button class="btn btn-import" onclick="importDataTrigger()">📂 استيراد نسخة</button>
    <input type="file" id="fileInput" style="display:none;" onchange="handleFileImport(event)">

    let registryData = [];

    window.onload = () => {
        // تحميل البيانات الكاملة فوراً
        registryData = fullSeedApps.map((app, index) => ({
            id: Date.now() + index,
            ...app
        }));
        saveToStorage();
    };

    function saveToStorage() {
        localStorage.setItem('kingdom_registry_full_v2', JSON.stringify(registryData));
        renderTable();
    }

    function addRow() {
        const newRow = { id: Date.now(), name: "", url: "", features: "", status: "draft" };
        registryData.push(newRow);
        saveToStorage();
    }

    function updateField(id, field, value) {
        const item = registryData.find(r => r.id === id);
        if(item) { item[field] = value; saveToStorage(); }
    }

    function deleteRow(id) {
        if(confirm("حذف هذا السطر؟")) {
            registryData = registryData.filter(r => r.id !== id);
            saveToStorage();
        }
    }

    function clearAll() {
        if(confirm("⚠️ مسح جميع البيانات؟")) {
            registryData = [];
            saveToStorage();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registryData));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "kingdom_full_backup_" + new Date().toISOString().slice(0,10) + ".json";
        a.click();
    }

    function importDataTrigger() { document.getElementById('fileInput').click(); }
    
    function handleFileImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const imported = JSON.parse(ev.target.result);
                if(Array.isArray(imported)) { registryData = imported; saveToStorage(); alert("تم الاستيراد!"); }
            } catch(err) { alert("خطأ في الملف"); }
        };
        reader.readAsText(file);
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const emptyMsg = document.getElementById('emptyState');
        tbody.innerHTML = '';

        if(registryData.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';

        registryData.forEach((item, index) => {
            const tr = document.createElement('tr');
            
            let statusClass = 'status-draft';
            let statusLabel = 'مسودة';
            if(item.status === 'pending') { statusClass = 'status-pending'; statusLabel = 'قيد الفحص 🔍'; }
            if(item.status === 'ready') { statusClass = 'status-ready'; statusLabel = 'جاهز للنشر ✅'; }
            if(item.status === 'info') { statusLabel = 'معلومات ℹ️'; }
            if(item.status === 'internal') { statusLabel = 'داخلي 🔒'; }
            if(item.status === 'junk') { statusLabel = 'إهمال 🗑️'; }

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><input type="text" value="${item.name}" onchange="updateField(${item.id}, 'name', this.value)"></td>
                <td><input type="text" value="${item.url}" onchange="updateField(${item.id}, 'url', this.value)"></td>
                <td><input type="text" value="${item.features}" onchange="updateField(${item.id}, 'features', this.value)"></td>
                <td>
                    <select onchange="updateField(${item.id}, 'status', this.value)">
                        <option value="draft" ${item.status === 'draft' ? 'selected' : ''}>مسودة 📝</option>
                        <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>قيد الفحص 🔍</option>
                        <option value="ready" ${item.status === 'ready' ? 'selected' : ''}>جاهز للنشر ✅</option>
                        <option value="info" ${item.status === 'info' ? 'selected' : ''}>معلومات ℹ️</option>
                        <option value="internal" ${item.status === 'internal' ? 'selected' : ''}>داخلي 🔒</option>
                        <option value="junk" ${item.status === 'junk' ? 'selected' : ''}>إهمال 🗑️</option>
                    </select>
                    <span style="display:block; margin-top:5px; font-size:0.8rem;" class="${statusClass}">${statusLabel}</span>
                </td>
                <td>
                    <button class="action-btn open-link" onclick="window.open('${item.url}', '_blank')">🌐</button>
                    <button class="action-btn delete" onclick="deleteRow(${item.id})">❌</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
