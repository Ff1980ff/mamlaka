<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 دفتر المملكة الذكي | Royal Code & Link Keeper</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 30, 0.9);
            --neon-cyan: #00ffff;
            --neon-purple: #bc13fe;
            --gold: #ffd700;
            --text-white: #fff;
            --success: #00ff88;
            --danger: #ff4444;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Tajawal', sans-serif;
            margin: 0; padding: 20px;
            min-height: 100vh;
        }

        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;}
        h1 { color: var(--neon-cyan); font-size: 1.8rem; margin: 0; }
        
        /* أزرار التبديل بين الوضعيات */
        .mode-switcher {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
        }
        .mode-btn {
            padding: 10px 20px; border: 1px solid #444; background: transparent; color: #aaa;
            border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .mode-btn.active {
            background: var(--neon-purple); color: white; border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
        }

        /* منطقة الإدخال (سواء كود أو رابط) */
        .input-area {
            width: 90%; max-width: 800px; margin: 0 auto 30px auto;
            background: var(--panel-bg); border: 1px solid #333; border-radius: 12px; padding: 20px;
            display: none; /* مخفي افتراضياً حتى يختار المستخدم وضعاً */
        }
        .input-area.visible { display: block; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        textarea, input[type="text"], input[type="url"] {
            width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff;
            border-radius: 8px; font-family: inherit; box-sizing: border-box; margin-bottom: 10px;
        }
        textarea { height: 150px; font-family: 'Fira Code', monospace; direction: ltr; text-align: left;}
        
        .btn-save {
            background: var(--success); color: black; border: none; padding: 12px 25px;
            border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-save:hover { filter: brightness(1.1); transform: scale(1.02); }

        /* شبكة النتائج (الدفتر المحفوظ) */
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px; padding: 10px;
        }

        .entry-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
        }
        .entry-card:hover { border-color: var(--neon-cyan); box-shadow: 0 5px 20px rgba(0,255,255,0.1); }

        .card-header {
            padding: 12px 15px; background: rgba(0,0,0,0.3);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333;
        }
        .entry-title { font-weight: bold; color: var(--gold); font-size: 1rem; word-break: break-all;}
        .entry-type-badge { 
            padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: bold;
            background: #333; color: #fff;
        }
        .badge-code { background: #e34c26; }
        .badge-link { background: #264de4; }

        .analysis-body { padding: 15px; font-size: 0.9rem; line-height: 1.6; color: #ddd; }
        .ai-summary {
            background: rgba(0, 255, 136, 0.1);
            border-right: 3px solid var(--success);
            padding: 10px; margin-top: 10px; border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .preview-snippet {
            background: #000; color: #0f0; font-family: 'Fira Code', monospace;
            padding: 10px; border-radius: 5px; margin-top: 10px;
            max-height: 100px; overflow-y: auto; font-size: 0.75rem; direction: ltr; text-align: left;
            white-space: pre-wrap;
        }

        .actions-row {
            padding: 10px 15px; background: rgba(0,0,0,0.2);
            display: flex; gap: 10px; justify-content: flex-end;
        }
        .btn-action {
            padding: 5px 10px; border: 1px solid #555; background: transparent; color: #aaa;
            border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: 0.2s;
        }
        .btn-action:hover { background: var(--danger); color: white; border-color: var(--danger); }
        .btn-view-link { background: var(--neon-cyan); color: black; border:none; }

        #emptyState { text-align: center; color: #666; padding: 40px; display: none; }
    </style>
</head>
<body>

<header>
    <h1><i class="fas fa-book-open"></i> دفتر المملكة الذكي</h1>
    <p style="color:#aaa; font-size:0.9rem;">احفظ أكوادك وروابطك، وسأحللها لك تلقائياً.</p>
</header>

<!-- أزرار اختيار نوع الحفظ -->
<div class="mode-switcher">
    <button class="mode-btn active" onclick="setMode('code')">💻 حفظ كود/ملف</button>
    <button class="mode-btn" onclick="setMode('link')">🔗 حفظ رابط مشروع</button>
</div>

<!-- منطقة إدخال الكود -->
<div id="codeInputArea" class="input-area visible">
    <label style="display:block; margin-bottom:5px; color:var(--neon-cyan);">اسم المشروع / وصف مختصر:</label>
    <input type="text" id="codeName" placeholder="مثال: نظام العقارات v2">
    
    <label style="display:block; margin-bottom:5px; color:var(--neon-cyan);">الصق الكود هنا (HTML/CSS/JS):</label>
    <textarea id="codeContent" placeholder="<!DOCTYPE html>..."></textarea>
    
    <button class="btn-save" onclick="saveEntry('code')">
        <i class="fas fa-save"></i> تحليل وحفظ الكود
    </button>
</div>

<!-- منطقة إدخال الرابط -->
<div id="linkInputArea" class="input-area">
    <label style="display:block; margin-bottom:5px; color:var(--neon-cyan);">عنوان المشروع:</label>
    <input type="text" id="linkTitle" placeholder="مثال: متجر Sellix الرئيسي">
    
    <label style="display:block; margin-bottom:5px; color:var(--neon-cyan);">الرابط المباشر (URL):</label>
    <input type="url" id="linkUrl" placeholder="https://...">
    
    <label style="display:block; margin-bottom:5px; color:var(--neon-cyan);">ملاحظات تسويقية (اختياري):</label>
    <textarea id="linkNotes" rows="2" placeholder="اكتب النص الذي تريد استخدامه في الإعلانات..."></textarea>
    
    <button class="btn-save" onclick="saveEntry('link')">
        <i class="fas fa-link"></i> حفظ الرابط والملاحظات
    </button>
</div>

<div id="emptyState">لا توجد عناصر محفوظة بعد. ابدأ بإضافة أول كود أو رابط!</div>

<main class="results-grid" id="resultsContainer">
    <!-- سيتم حقن البطاقات هنا -->
</main>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<script>
    // --- State Management ---
    let entries = [];
    const STORAGE_KEY = 'royal_notebook_v2';

    // Load from LocalStorage on start
    window.onload = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved) {
            try { entries = JSON.parse(saved); } catch(e){}
        }
        renderEntries();
    };

    function setMode(mode) {
        const codeArea = document.getElementById('codeInputArea');
        const linkArea = document.getElementById('linkInputArea');
        const buttons = document.querySelectorAll('.mode-btn');

        buttons.forEach(b => b.classList.remove('active'));
        
        if(mode === 'code') {
            codeArea.classList.add('visible');
            linkArea.classList.remove('visible');
            buttons[0].classList.add('active');
        } else {
            codeArea.classList.remove('visible');
            linkArea.classList.add('visible');
            buttons[1].classList.add('active');
        }
    }

    function saveEntry(type) {
        let newItem = {};
        
        if(type === 'code') {
            const name = document.getElementById('codeName').value.trim();
            const content = document.getElementById('codeContent').value.trim();
            
            if(!name || !content) { alert("الرجاء إدخال اسم ولصق الكود!"); return; }
            
            newItem = {
                id: Date.now(),
                type: 'code',
                title: name,
                content: content, // Save full content for re-analysis later if needed
                analysis: analyzeCode(content), // Run analysis immediately
                timestamp: new Date().toLocaleDateString()
            };

            // Clear inputs
            document.getElementById('codeName').value = '';
            document.getElementById('codeContent').value = '';

        } else if (type === 'link') {
            const title = document.getElementById('linkTitle').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const notes = document.getElementById('linkNotes').value.trim();

            if(!title || !url) { alert("الرجاء إدخال العنوان والرابط!"); return; }

            newItem = {
                id: Date.now(),
                type: 'link',
                title: title,
                url: url,
                notes: notes,
                analysis: "رابط خارجي محفوظ للرجوع إليه بسرعة.",
                timestamp: new Date().toLocaleDateString()
            };

            // Clear inputs
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkNotes').value = '';
        }

        entries.unshift(newItem); // Add to top
        persistData();
        renderEntries();
    }

    function persistData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function deleteEntry(id) {
        if(confirm("هل أنت متأكد من حذف هذا العنصر من الدفتر؟")) {
            entries = entries.filter(e => e.id !== id);
            persistData();
            renderEntries();
        }
    }

    // --- The Brain: Analysis Logic (Same as before but optimized) ---
    function analyzeCode(content) {
        let summary = "";
        const hasCanvas = content.includes('<canvas');
        const hasLocalStorage = content.includes('localStorage');
        const hasFetch = content.includes('fetch(') || content.includes('XMLHttpRequest');
        const hasModal = content.includes('modal') || content.includes('overlay');
        const isReact = content.includes('react') || content.includes('useState');
        const isVue = content.includes('vue') || content.includes('v-if');

        summary += `<strong>🤖 التحليل الآلي:</strong><br>`;
        
        if(isReact) summary += "⚛️ يحتوي على مكونات React.<br>";
        if(isVue) summary += "💚 يحتوي على منطق Vue.js.<br>";
        if(hasCanvas) summary += "🎨 يستخدم Canvas للرسم/الفيديو.<br>";
        if(hasLocalStorage) summary += "💾 يحفظ البيانات محلياً (Offline).<br>";
        if(hasFetch) summary += "🌐 يتصل بخوادم خارجية (API).<br>";
        if(hasModal) summary += "🪟 يحتوي على نوافذ منبثقة.<br>";
        
        if(!hasFetch && !isReact && !isVue) summary += "✅ كود خفيف ومستقل تماماً.";

        return summary;
    }

    function renderEntries() {
        const container = document.getElementById('resultsContainer');
        const emptyState = document.getElementById('emptyState');
        container.innerHTML = '';

        if(entries.length === 0) {
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        entries.forEach(entry => {
            const card = document.createElement('div');
            card.className = 'entry-card';
            
            let badgeClass = entry.type === 'code' ? 'badge-code' : 'badge-link';
            let typeName = entry.type === 'code' ? 'CODE' : 'LINK';
            
            let bodyHtml = '';
            
            if(entry.type === 'code') {
                // Show snippet of code
                const snippet = entry.content.substring(0, 150) + "...";
                bodyHtml = `
                    <div class="preview-snippet">${snippet}</div>
                    <div class="ai-summary">${entry.analysis}</div>
                `;
            } else {
                // Show link details
                bodyHtml = `
                    <p style="margin:5px 0;"><a href="${entry.url}" target="_blank" style="color:var(--neon-cyan); text-decoration:none;">🔗 ${entry.url}</a></p>
                    ${entry.notes ? `<p style="font-size:0.85rem; color:#aaa; margin-top:5px;">📝 ${entry.notes}</p>` : ''}
                `;
            }

            card.innerHTML = `
                <div class="card-header">
                    <span class="entry-title">${entry.title}</span>
                    <span class="entry-type-badge ${badgeClass}">${typeName}</span>
                </div>
                <div class="analysis-body">
                    ${bodyHtml}
                    <small style="color:#555; display:block; margin-top:10px;">${entry.timestamp}</small>
                </div>
                <div class="actions-row">
                    ${entry.type === 'link' ? `<button class="btn-action btn-view-link" onclick="window.open('${entry.url}', '_blank')">فتح الرابط</button>` : ''}
                    <button class="btn-action" onclick="deleteEntry(${entry.id})">حذف 🗑️</button>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
