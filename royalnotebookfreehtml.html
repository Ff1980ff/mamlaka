<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Royal Code Manager PRO | الإصدار الملكي الكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 30, 0.95);
            --neon-gold: #ffd700; /* لون ذهبي فاخر للإصدار البرو */
            --neon-cyan: #00ffff;
            --text-white: #fff;
            --success: #00ff88;
            --danger: #ff4444;
        }

        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'Tajawal', sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
        
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--neon-gold); padding-bottom: 15px;}
        h1 { color: var(--neon-gold); font-size: 2rem; margin: 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);}
        .pro-badge { background: var(--neon-gold); color: black; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; vertical-align: middle;}

        /* شاشة القفل */
        #lockScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .lock-box { background: #111; padding: 30px; border: 1px solid var(--neon-gold); border-radius: 10px; text-align: center; max-width: 300px;}
        .lock-input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; text-align: center;}
        
        /* أدوات التحكم العلوية */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); padding: 10px 20px; border-radius: 10px; margin-bottom: 20px;
            border: 1px solid #333;
        }
        .tool-btn {
            background: transparent; border: 1px solid #555; color: #ccc;
            padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s;
            font-size: 0.9rem; display: flex; align-items: center; gap: 5px;
        }
        .tool-btn:hover { border-color: var(--neon-gold); color: var(--neon-gold); }
        .btn-export { border-color: var(--success); color: var(--success); }
        .btn-lock { border-color: var(--danger); color: var(--danger); }

        /* نفس تنسيقات البطاقات السابقة مع تحسينات طفيفة */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .entry-card { background: var(--panel-bg); border: 1px solid #333; border-radius: 12px; overflow: hidden; transition: 0.3s; }
        .entry-card:hover { border-color: var(--neon-gold); box-shadow: 0 5px 20px rgba(255, 215, 0, 0.1); }
        .card-header { padding: 12px 15px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;}
        .entry-title { font-weight: bold; color: var(--neon-gold); font-size: 1rem; word-break: break-all;}
        .analysis-body { padding: 15px; font-size: 0.9rem; line-height: 1.6; color: #ddd; }
        .ai-summary { background: rgba(255, 215, 0, 0.1); border-right: 3px solid var(--neon-gold); padding: 10px; margin-top: 10px; border-radius: 4px; font-size: 0.85rem;}
        .preview-snippet { background: #000; color: #0f0; font-family: 'Fira Code', monospace; padding: 10px; border-radius: 5px; margin-top: 10px; max-height: 100px; overflow-y: auto; font-size: 0.75rem; direction: ltr; text-align: left; white-space: pre-wrap;}
        .actions-row { padding: 10px 15px; background: rgba(0,0,0,0.2); display: flex; gap: 10px; justify-content: flex-end; }
        .btn-action { padding: 5px 10px; border: 1px solid #555; background: transparent; color: #aaa; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .btn-delete:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* منطقة الإدخال (مخفية خلف الزر) */
        #addModal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 15px; width: 90%; max-width: 500px; border: 1px solid var(--neon-gold); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--neon-cyan); font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 150px; font-family: 'Fira Code', monospace; direction: ltr; text-align: left; }
        .btn-submit { background: var(--neon-gold); color: black; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }

    </style>
</head>
<body>

<!-- شاشة القفل (تظهر فقط إذا كان هناك بيانات محفوظة) -->
<div id="lockScreen" style="display:none;">
    <div class="lock-box">
        <h2 style="color:var(--neon-gold)">🔒 دفتر مقفل</h2>
        <p style="font-size:0.9rem; color:#aaa;">أدخل كلمة المرور للوصول لمشاريعك الملكية.</p>
        <input type="password" id="passInput" class="lock-input" placeholder="********">
        <button onclick="unlock()" class="btn-submit" style="margin-top:10px;">فتح</button>
        <small style="display:block; margin-top:10px; color:#666; cursor:pointer;" onclick="resetLock()">نسيت كلمة المرور؟ (سوف يحذف كل شيء)</small>
    </div>
</div>

<header>
    <h1><i class="fas fa-crown"></i> Royal Code Manager <span class="pro-badge">PRO</span></h1>
    <p style="color:#aaa; font-size:0.9rem;">الإصدار الكامل: حماية، تصدير، وتحليل لا نهائي.</p>
</header>

<div class="toolbar">
    <div style="display:flex; gap:10px;">
        <button class="tool-btn" onclick="openAddModal()"><i class="fas fa-plus"></i> إضافة عنصر جديد</button>
        <button class="tool-btn btn-export" onclick="exportData()"><i class="fas fa-download"></i> تصدير نسخة احتياطية (JSON)</button>
    </div>
    <button class="tool-btn btn-lock" onclick="toggleLockSetting()"><i class="fas fa-shield-alt"></i> إعدادات الحماية</button>
</div>

<main class="results-grid" id="resultsContainer">
    <!-- سيتم حقن البطاقات هنا -->
</main>

<!-- نافذة الإضافة -->
<div id="addModal">
    <div class="modal-content">
        <h3 style="color:var(--neon-gold); margin-top:0;">إضافة مشروع / كود</h3>
        <div class="form-group">
            <label>العنوان:</label>
            <input type="text" id="newTitle" placeholder="مثال: نظام العقارات v3">
        </div>
        <div class="form-group">
            <label>النوع:</label>
            <select id="newType" style="width:100%; padding:10px; background:#111; border:1px solid #444; color:white; border-radius:5px;">
                <option value="code">كود برمجي (HTML/CSS/JS)</option>
                <option value="link">رابط خارجي (URL)</option>
            </select>
        </div>
        <div class="form-group" id="codeField">
            <label>الصق الكود:</label>
            <textarea id="newContent" placeholder="<!DOCTYPE html>..."></textarea>
        </div>
        <div class="form-group" id="linkField" style="display:none;">
            <label>الرابط:</label>
            <input type="url" id="newUrl" placeholder="https://...">
            <label style="margin-top:10px;">ملاحظات:</label>
            <textarea id="newNotes" rows="2" placeholder="وصف تسويقي..."></textarea>
        </div>
        <button class="btn-submit" onclick="submitNewItem()">حفظ في الدفتر الملكي 👑</button>
        <button onclick="closeModal()" style="background:transparent; border:none; color:#888; margin-top:10px; cursor:pointer; width:100%;">إلغاء</button>
    </div>
</div>

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<script>
    let entries = [];
    const STORAGE_KEY = 'royal_pro_data';
    const PASS_KEY = 'royal_pro_pass';
    let isLocked = false;

    // --- Initialization & Security Check ---
    window.onload = () => {
        checkSecurity();
        loadData();
        renderEntries();
    };

    function checkSecurity() {
        const savedPass = localStorage.getItem(PASS_KEY);
        const hasData = localStorage.getItem(STORAGE_KEY);
        
        if(savedPass && hasData) {
            isLocked = true;
            document.getElementById('lockScreen').style.display = 'flex';
        } else {
            isLocked = false;
        }
    }

    function unlock() {
        const pass = document.getElementById('passInput').value;
        const savedPass = localStorage.getItem(PASS_KEY);
        if(pass === savedPass) {
            isLocked = false;
            document.getElementById('lockScreen').style.display = 'none';
            loadData();
            renderEntries();
        } else {
            alert("كلمة المرور خاطئة!");
        }
    }

    function resetLock() {
        if(confirm("تحذير: هذا سيحذف جميع البيانات وكلمة المرور. هل أنت متأكد؟")) {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(PASS_KEY);
            location.reload();
        }
    }

    function toggleLockSetting() {
        if(!isLocked && entries.length > 0) {
            const newPass = prompt("حدد كلمة مرور جديدة لحماية دفترك (اتركها فارغة لإلغاء الحماية):");
            if(newPass !== null) {
                if(newPass === "") {
                    localStorage.removeItem(PASS_KEY);
                    alert("تم إلغاء الحماية.");
                } else {
                    localStorage.setItem(PASS_KEY, newPass);
                    alert("تم تفعيل الحماية! سيطلب منك إدخالها عند كل زيارة.");
                }
            }
        } else if (entries.length === 0) {
            alert("لا توجد بيانات لحمايتها بعد.");
        }
    }

    // --- Data Management ---
    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved) {
            try { entries = JSON.parse(saved); } catch(e){}
        }
    }

    function persistData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href",     dataStr);
        downloadAnchorNode.setAttribute("download", "royal_backup_" + Date.now() + ".json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        alert("تم تحميل نسخة احتياطية آمنة من مشاريعك!");
    }

    // --- UI Logic ---
    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    // Toggle fields based on type selection
    document.getElementById('newType').addEventListener('change', (e) => {
        const val = e.target.value;
        document.getElementById('codeField').style.display = val === 'code' ? 'block' : 'none';
        document.getElementById('linkField').style.display = val === 'link' ? 'block' : 'none';
    });

    function submitNewItem() {
        const title = document.getElementById('newTitle').value.trim();
        const type = document.getElementById('newType').value;
        
        if(!title) { alert("أدخل عنواناً أولاً!"); return; }

        let newItem = { id: Date.now(), title, type, timestamp: new Date().toLocaleString() };

        if(type === 'code') {
            const content = document.getElementById('newContent').value.trim();
            if(!content) { alert("الصق الكود!"); return; }
            newItem.content = content;
            newItem.analysis = analyzeCode(content);
        } else {
            const url = document.getElementById('newUrl').value.trim();
            const notes = document.getElementById('newNotes').value.trim();
            if(!url) { alert("أدخل الرابط!"); return; }
            newItem.url = url;
            newItem.notes = notes;
            newItem.analysis = "رابط محفوظ للرجوع السريع.";
        }

        entries.unshift(newItem);
        persistData();
        renderEntries();
        closeModal();
        
        // Clear inputs
        document.getElementById('newTitle').value = '';
        document.getElementById('newContent').value = '';
        document.getElementById('newUrl').value = '';
        document.getElementById('newNotes').value = '';
    }

    function deleteEntry(id) {
        if(confirm("حذف هذا العنصر نهائياً؟")) {
            entries = entries.filter(e => e.id !== id);
            persistData();
            renderEntries();
        }
    }

    // --- Advanced Analysis Engine ---
    function analyzeCode(content) {
        let summary = `<strong>🤖 تحليل برو (Deep Scan):</strong><br>`;
        const libs = [];
        
        if(content.includes('react')) libs.push('React');
        if(content.includes('vue')) libs.push('Vue');
        if(content.includes('angular')) libs.push('Angular');
        if(content.includes('jquery')) libs.push('jQuery');
        if(content.includes('tailwind')) libs.push('Tailwind CSS');
        if(content.includes('bootstrap')) libs.push('Bootstrap');
        if(content.includes('chart.js')) libs.push('Chart.js');
        if(content.includes('three.js')) libs.push('Three.js (3D)');
        if(content.includes('firebase')) libs.push('Firebase');
        if(content.includes('supabase')) libs.push('Supabase');

        if(libs.length > 0) summary += `📚 مكتبات مكتشفة: <span style="color:var(--neon-cyan)">${libs.join(', ')}</span>.<br>`;
        
        if(content.includes('<canvas')) summary += `🎨 رسم بياني/فيديو (Canvas).<br>`;
        if(content.includes('localStorage')) summary += `💾 تخزين محلي (Offline First).<br>`;
        if(content.includes('fetch(')) summary += `🌐 اتصال شبكي (API Calls).<br>`;
        if(content.includes('websocket')) summary += `⚡ اتصال فوري (WebSocket).<br>`;
        
        const lines = content.split('\n').length;
        summary += `📏 حجم الكود التقريبي: ${lines} سطر.`;

        return summary;
    }

    function renderEntries() {
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        if(entries.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#666; padding:40px;">الدفتر فارغ. ابدأ بإضافة أول مشروع ملكي!</div>';
            return;
        }

        entries.forEach(entry => {
            const card = document.createElement('div');
            card.className = 'entry-card';
            
            let badgeClass = entry.type === 'code' ? 'badge-code' : 'badge-link';
            let typeName = entry.type === 'code' ? 'CODE' : 'LINK';
            
            let bodyHtml = '';
            
            if(entry.type === 'code') {
                const snippet = entry.content.substring(0, 150) + "...";
                bodyHtml = `
                    <div class="preview-snippet">${snippet}</div>
                    <div class="ai-summary">${entry.analysis}</div>
                `;
            } else {
                bodyHtml = `
                    <p style="margin:5px 0;"><a href="${entry.url}" target="_blank" style="color:var(--neon-cyan); text-decoration:none;">🔗 ${entry.url}</a></p>
                    ${entry.notes ? `<p style="font-size:0.85rem; color:#aaa; margin-top:5px;">📝 ${entry.notes}</p>` : ''}
                `;
            }

            card.innerHTML = `
                <div class="card-header">
                    <span class="entry-title">${entry.title}</span>
                    <span class="entry-type-badge ${badgeClass}">${typeName}</span>
                </div>
                <div class="analysis-body">
                    ${bodyHtml}
                    <small style="color:#555; display:block; margin-top:10px;">${entry.timestamp}</small>
                </div>
                <div class="actions-row">
                    ${entry.type === 'link' ? `<button class="btn-action" onclick="window.open('${entry.url}', '_blank')">فتح</button>` : ''}
                    <button class="btn-action btn-delete" onclick="deleteEntry(${entry.id})">حذف 🗑️</button>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
