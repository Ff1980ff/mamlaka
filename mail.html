<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مصنع الإيميلات 📧</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}
body{background:#0b1026;color:#f7ead9;padding-bottom:40px}
header{text-align:center;padding:16px;font-weight:900;color:#f5a524;font-size:21px}
header small{display:block;color:#9aa3c0;font-weight:400;font-size:13px;margin-top:4px}
.wrap{max-width:560px;margin:auto;padding:0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chip{border:1px solid #2a3157;background:#141a33;color:#f7ead9;border-radius:99px;padding:11px 16px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:#f5a524;color:#241303}
input{width:100%;padding:13px;border-radius:12px;border:2px solid #2a3157;background:#141a33;color:#f7ead9;font-size:17px;font-family:inherit;margin:6px 0}
.go{width:100%;border-radius:12px;border:none;background:#f5a524;color:#241303;font-weight:900;font-size:17px;padding:14px;cursor:pointer;font-family:inherit;margin:8px 0}
.sec{width:100%;border-radius:12px;border:1px solid #2a3157;background:#141a33;color:#f7ead9;font-weight:900;font-size:15px;padding:12px;cursor:pointer;font-family:inherit}
#out{background:#141a33;border:2px solid #2a3157;border-radius:14px;padding:16px;margin:12px 0;line-height:2.1;font-size:17px;white-space:pre-wrap;display:none}
.card{background:#141a33;border:1px solid #2a3157;border-radius:14px;padding:14px;margin:10px 0;line-height:2;font-size:15px;color:#9aa3c0}
.card b{color:#f5a524}
</style>
</head>
<body>
<header>📧 مصنع الإيميلات
<small>رسائل بأدب الشوام — اختار القالب وعبّي الأسماء</small></header>

<div class="wrap">
 <div class="chips" id="types"></div>
 <input id="to" placeholder="إلى (اسم المرسل له)...">
 <input id="from" placeholder="من (اسمك)...">
 <input id="ext" placeholder="تفصيل اختياري (الموضوع / المناسبة)...">
 <button class="go" onclick="make()">📧 اصنع الرسالة</button>
 <div id="out"></div>
 <button class="sec" id="cp" style="display:none" onclick="copyM()">📋 نسخ الرسالة</button>

 <div class="card"><b>📜 أدب الرسائل عند الشوام:</b><br>
 • ابدأ بالسلام، وما تطوّل حتى ما تُمِل.<br>
 • نادِ الشخص بلقبو المحبب (أبو فلان / أم فلان).<br>
 • اختم بالدعاء أو الشكر، وما تنسى توقيعك.<br>
 • الرسالة الحلوة بتفتح أبواب ما بيفتحها الطلب المباشر.</div>
</div>

<script>
const T=[
{n:'🎩 رسمي',f:(to,from,x)=>`السلام عليكم ورحمة الله وبركاته،
الأستاذ/ة ${to} المحترم،
تحية طيبة وبعد،
أتقدم إليكم بخصوص ${x||'طلبي هذا'}، راجيًا منكم التكرم بالنظر فيه، وثقتي بكم كبيرة.
وتفضلوا بقبول فائق الاحترام والتقدير.
المخلص: ${from}`},
{n:' شكر',f:(to,from)=>`غالي ${to}،
ما قصّرت! وقفتك معي ما بتنسى، وكلمتك الطيبة كانت بلسم.
الله يجزيك الخير ويكثر من أمثالك.
مع خالص الشكر: ${from}`},
{n:'🤝 اعتذار',f:(to,from)=>`صديقي/أستاذي ${to}،
بعتذر منك عن اللي صار، وما كان قصدي أزعلك أبدًا.
محبتك غالية عندي، وبتمنى تقبل اعتذاري.
المحب: ${from}`},
{n:'🎉 تهنئة',f:(to,from,x)=>`غالي ${to}،
ألف مبروك ${x||'الخبر الحلو'}! فرحتلك من قلبي.
الله يديمها عليك نعمة ويزيدك من فضله.
المهنئ: ${from}`},
{n:'🛋️ دعوة',f:(to,from,x)=>`عزيزي ${to}،
يسعدني أدعوك لـ${x||'عزومة عشا'} عندنا بالبيت.
حضورك بينوّر الدار، والبيت بيتك.
بانتظارك: ${from}`},
{n:'🕊️ طلب بلطف',f:(to,from,x)=>`الأستاذ ${to} المحترم،
بكل احترام ومحبة، حبيت نوّهك لموضوع ${x||'...'} راجيًا منكم النظر الكريم.
واثق إنكم ما بتقصّروا.
شاكرًا لكم: ${from}`}
];
let cur=0,last='';
document.getElementById('types').innerHTML=T.map((t,i)=>`<button class="chip${i===0?' on':''}" onclick="sel(${i})">${t.n}</button>`).join('');
function sel(i){cur=i;document.querySelectorAll('.chip').forEach((b,j)=>b.classList.toggle('on',j===i))}
function make(){
 const to=document.getElementById('to').value.trim()||'الأستاذ الفاضل';
 const from=document.getElementById('from').value.trim()||'المحب';
 const x=document.getElementById('ext').value.trim();
 last=T[cur].f(to,from,x);
 document.getElementById('out').textContent=last;
 document.getElementById('out').style.display='block';
 document.getElementById('cp').style.display='block';
}
function copyM(){navigator.clipboard.writeText(last).then(()=>{document.getElementById('cp').textContent='✅ اننسخت! الصقها بالإيميل أو الواتساب'})}
</script>
</body>
</html>
