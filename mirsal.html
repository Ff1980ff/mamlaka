<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المِرسال 🕊️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}
body{background:#0b1026;color:#f7ead9;padding-bottom:40px}
header{text-align:center;padding:14px 10px;font-weight:900;color:#f5a524;font-size:19px}
header small{display:block;color:#9aa3c0;font-weight:400;font-size:11px;margin-top:4px}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px;flex-wrap:wrap}
.tab{border:1px solid #2a3157;background:#141a33;color:#f7ead9;border-radius:99px;padding:10px 18px;font-weight:900;font-size:13px;cursor:pointer}
.tab.on{background:#f5a524;color:#241303}
section{max-width:560px;margin:auto;padding:0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0;justify-content:center}
textarea,input,select,button{border-radius:12px;border:1px solid #2a3157;background:#141a33;color:#f7ead9;padding:10px;font-size:14px;font-family:inherit}
textarea{width:100%;min-height:130px;resize:vertical;line-height:1.9}
button{cursor:pointer;font-weight:700}
.go{background:#f5a524;color:#241303;border:none;font-weight:900}
#msg{min-height:24px;text-align:center;color:#22d3ee;font-size:13px;margin:6px}
img#prev{max-width:100%;border-radius:14px;border:1px solid #2a3157;display:none;margin:8px auto}
.stat{color:#9aa3c0;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>🕊️ المِرسال
<small>رسول المملكة — يحوّل الصيغ ويجيب من العالم</small></header>

<div class="tabs">
 <button class="tab on" onclick="tab(0)">📝 نصوص</button>
 <button class="tab" onclick="tab(1)">🖼️ صور</button>
 <button class="tab" onclick="tab(2)">🔗 روابط</button>
</div>

<section id="p0">
 <textarea id="tIn" placeholder="الصق أي نص هون... والمِرسال يحوّلو."></textarea>
 <div class="bar">
  <button onclick="tashkeel()">🧹 فكّ التشكيل</button>
  <button onclick="norm()">✨ تطبيع الحروف</button>
  <button onclick="nums(1)">٠١٢ أرقام هندية</button>
  <button onclick="nums(0)">012 أرقام إنجليزية</button>
 </div>
 <div class="bar">
  <button onclick="speakT()">🔊 انطق</button>
  <button onclick="copyX('tIn')">📋 نسخ</button>
  <button onclick="dlX()">⬇️ تنزيل TXT</button>
 </div>
 <div class="stat" id="cnt"></div>
</section>

<section id="p1" style="display:none">
 <div class="bar"><input type="file" id="fIn" accept="image/*" onchange="loadI(this)"></div>
 <img id="prev">
 <div class="bar">
  <select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select>
  <label>جودة <input type="range" id="q" min="10" max="100" value="85"></label>
  <label>أقصى عرض <input type="range" id="mw" min="200" max="2000" step="100" value="1200"></label>
 </div>
 <div class="bar"><button class="go" onclick="conv()">🕊️ حوّل ونزّل</button></div>
 <div class="stat" id="imgInfo"></div>
</section>

<section id="p2" style="display:none">
 <textarea id="uIn" style="min-height:70px" placeholder="الصق الرابط الوسخ الطويل..."></textarea>
 <div class="bar"><button class="go" onclick="cleanU()">🧿 نظّف الرابط</button></div>
 <textarea id="uOut" style="min-height:70px" readonly placeholder="الرابط النظيف بيطلع هون..."></textarea>
 <div class="bar">
  <button onclick="copyX('uOut')">📋 نسخ</button>
  <button onclick="openU()">🚪 افتح</button>
 </div>
</section>

<div id="msg"></div>

<script>
const secs=['p0','p1','p2'];
function tab(i){document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i===j));secs.forEach((s,j)=>document.getElementById(s).style.display=i===j?'block':'none')}
function msg(t){document.getElementById('msg').textContent=t}
/* ===== نصوص ===== */
const tIn=document.getElementById('tIn');
tIn.oninput=()=>{const t=tIn.value;document.getElementById('cnt').textContent='حروف: '+t.length+' • كلمات: '+(t.trim()?t.trim().split(/\s+/).length:0)};
function tashkeel(){tIn.value=tIn.value.replace(/[\u064B-\u0652\u0670\u0640]/g,'');msg('✅ تفكّك التشكيل');tIn.oninput()}
function norm(){tIn.value=tIn.value.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');msg('✅ تطبّعت الحروف');tIn.oninput()}
function nums(h){const a='٠١٢٣٤٥٦٧٨٩';
 if(h)tIn.value=tIn.value.replace(/[0-9]/g,d=>a[d]);
 else tIn.value=tIn.value.replace(/[٠-٩]/g,d=>a.indexOf(d));
 msg('✅ تحولت الأرقام');tIn.oninput()}
function speakT(){if(!tIn.value.trim())return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(tIn.value);u.lang='ar-SA';speechSynthesis.speak(u)}
function copyX(id){navigator.clipboard&&navigator.clipboard.writeText(document.getElementById(id).value);msg('✅ انسخ')}
function dlX(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([tIn.value],{type:'text/plain'}));a.download='mirsal-text.txt';a.click()}
/* ===== صور ===== */
let img=null;
function loadI(inp){const f=inp.files[0];if(!f)return;img=new Image();img.onload=()=>{const p=document.getElementById('prev');p.src=img.src;p.style.display='block';document.getElementById('imgInfo').textContent='الأصل: '+img.width+'×'+img.height};img.src=URL.createObjectURL(f)}
function conv(){if(!img){msg('حمّل صورة أول!');return}
 const mw=+document.getElementById('mw').value,s=Math.min(1,mw/img.width);
 const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
 const x=c.getContext('2d');if(document.getElementById('fmt').value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
 x.drawImage(img,0,0,c.width,c.height);
 const fmt=document.getElementById('fmt').value,ext=fmt.split('/')[1];
 c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mirsal.'+ext;a.click();msg('✅ تحولت ونزلت! ('+Math.round(b.size/1024)+' KB)')},fmt,+document.getElementById('q').value/100)}
/* ===== روابط ===== */
function cleanU(){try{const u=new URL(document.getElementById('uIn').value.trim());
 ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid','ref'].forEach(p=>u.searchParams.delete(p));
 document.getElementById('uOut').value=u.toString();msg('✅ تنظّف الرابط')}catch(e){msg('رابط غير صالح — تأكد منو')}}
function openU(){const u=document.getElementById('uOut').value||document.getElementById('uIn').value;if(u)open(u)}
</script>
</body>
</html>
