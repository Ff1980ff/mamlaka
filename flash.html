<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فلاشاتي الذكية 🃏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}
body{background:#0b1026;color:#f7ead9;padding-bottom:40px}
header{text-align:center;padding:16px;font-weight:900;color:#f5a524;font-size:21px}
header small{display:block;color:#9aa3c0;font-weight:400;font-size:13px;margin-top:4px}
.wrap{max-width:600px;margin:auto;padding:0 12px}
.note{text-align:center;color:#9aa3c0;font-size:14px;margin:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chip{border:1px solid #2a3157;background:#141a33;color:#f7ead9;border-radius:99px;padding:12px 18px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
.chip.add{border-color:#4ade80;color:#4ade80}
.screen{display:none}
.screen.on{display:block}
.back{border-radius:12px;border:1px solid #2a3157;background:#141a33;color:#f7ead9;padding:10px 18px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;margin:8px 0}
.card{background:#141a33;border:2px solid #2a3157;border-radius:18px;padding:26px;margin:14px 0;text-align:center}
.front{font-size:34px;font-weight:900}
.back2{font-size:28px;font-weight:900;color:#22d3ee;direction:ltr;margin-top:12px}
.card button{border:none;background:#1a2440;color:#f7ead9;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:17px;margin:4px}
.big{width:100%;border-radius:14px;border:none;background:#f5a524;color:#241303;font-weight:900;font-size:18px;padding:15px;cursor:pointer;font-family:inherit;margin:6px 0}
.row{display:flex;gap:8px}
.row button{flex:1;border-radius:12px;border:none;font-weight:900;font-size:17px;padding:14px;cursor:pointer;font-family:inherit;color:#fff}
.row .no{background:#dc2626}.row .ok{background:#16a34a}
.opt{width:100%;border-radius:14px;border:2px solid #2a3157;background:#141a33;color:#f7ead9;font-weight:900;font-size:20px;padding:15px;cursor:pointer;font-family:inherit;margin:6px 0;direction:ltr}
.opt.ok{background:#16a34a;border:none}
.opt.no{background:#dc2626;border:none}
input{width:100%;padding:13px;border-radius:12px;border:2px solid #2a3157;background:#141a33;color:#f7ead9;font-size:17px;font-family:inherit;margin:6px 0}
.st{text-align:center;font-size:16px;font-weight:900;color:#22d3ee;margin:10px}
</style>
</head>
<body>
<header>🃏 فلاشاتي الذكية
<small>رزم جاهزة + رزمك — تحفظ، تنطق، وتختبر</small></header>

<div class="wrap">
<div id="hub" class="screen on">
 <div class="note">🃏 اختار رزمة وابدأ:</div>
 <div class="chips" id="decks"></div>
</div>

<div id="study" class="screen">
 <button class="back" onclick="goHub()">🏠 الرزم</button>
 <button class="back" onclick="startQuiz()">🎮 اختبرني عليها</button>
 <div class="st" id="sst"></div>
 <div class="card" id="card"></div>
</div>

<div id="quiz" class="screen">
 <button class="back" onclick="goHub()">🏠 الرزم</button>
 <div class="st" id="qst"></div>
 <div id="qbox"></div>
</div>

<div id="make" class="screen">
 <button class="back" onclick="goHub()">🏠 الرزم</button>
 <div class="card" style="text-align:right">
  <input id="dn" placeholder="اسم الرزمة (مثلاً: كلمات البيت)">
  <input id="df" placeholder="الوجه (عربي)">
  <input id="db" placeholder="الظهر (إنكليزي أو تعريف)">
  <button class="big" onclick="addCard()">➕ ضيف البطاقة</button>
 </div>
 <div class="st" id="mst"></div>
 <div id="mlist"></div>
</div>
</div>

<script>
const DECKS={
'حيوانات 🐾':[['أسد','lion'],['قطة','cat'],['كلب','dog'],['حصان','horse'],['جمل','camel'],['فيل','elephant'],['أرنب','rabbit'],['بطة','duck'],['نحلة','bee'],['سمكة','fish']],
'أرقام 🔢':[['واحد','one'],['اثنان','two'],['ثلاثة','three'],['أربعة','four'],['خمسة','five'],['ستة','six'],['سبعة','seven'],['ثمانية','eight'],['تسعة','nine'],['عشرة','ten']],
'ألوان 🎨':[['أحمر','red'],['أزرق','blue'],['أخضر','green'],['أصفر','yellow'],['أسود','black'],['أبيض','white'],['برتقالي','orange'],['وردي','pink']],
'طعام 🍎':[['خبز','bread'],['حليب','milk'],['تفاحة','apple'],['موز','banana'],['عسل','honey'],['جبن','cheese'],['بيض','egg'],['ماء','water']],
'عائلة 👪':[['أب','father'],['أم','mother'],['أخ','brother'],['أخت','sister'],['جد','grandfather'],['جدة','grandmother'],['ابن','son'],['ابنة','daughter']],
'مهن 🛠️':[['معلم','teacher'],['طبيب','doctor'],['مهندس','engineer'],['نجار','carpenter'],['خباز','baker'],['سائق','driver'],['طباخ','cook'],['فلاح','farmer']]
};
let custom=JSON.parse(localStorage.getItem('flash_custom')||'{}');
let cur=[],Q=[],qsc=0,qrd=0;
function sp(t,l){const u=new SpeechSynthesisUtterance(t);u.lang=l==='ar'?'ar-SA':'en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on')}
function goHub(){show('hub');renderDecks()}
function renderDecks(){
 const names=[...Object.keys(DECKS),...Object.keys(custom)];
 document.getElementById('decks').innerHTML=names.map((n,i)=>`<button class="chip" onclick="pick(${i})">🃏 ${n}</button>`).join('')+`<button class="chip add" onclick="show('make');renderMine()">➕ رزمة جديدة</button>`;
 window._names=names;
}
function pick(i){cur=(DECKS[window._names[i]]||custom[window._names[i]]).slice();startStudy()}
function startStudy(){show('study');Q=cur.slice().sort(()=>Math.random()-.5);nextCard()}
function nextCard(){
 document.getElementById('sst').textContent='باقي '+Q.length+' بطاقة';
 if(!Q.length){document.getElementById('card').innerHTML='<div class="front">🎉 خلصت الرزمة!</div><div class="back2">كلها انحفطت!</div>';return}
 const c=Q[0];
 document.getElementById('card').innerHTML=`<div class="front">${c[0]} <button onclick="sp('${c[0]}','ar')">🔊</button></div>
 <div class="back2" id="bk" style="display:none">${c[1]} <button onclick="sp('${c[1]}','en')">🔊</button></div>
 <button class="big" onclick="document.getElementById('bk').style.display='block'">🔄 اقلب البطاقة</button>
 <div class="row"><button class="no" onclick="wrong()">❌ ما عرفتها</button><button class="ok" onclick="right()">✅ عرفتها</button></div>`;
}
function wrong(){Q.push(Q.shift());nextCard()}
function right(){Q.shift();nextCard()}
function startQuiz(){show('quiz');qsc=0;qrd=0;qNext()}
function qNext(){
 if(qrd>=10){document.getElementById('qbox').innerHTML='';
  document.getElementById('qst').textContent=qsc>=8?'🏆 حافظ ملكي! '+qsc+'/١٠':qsc>=5?'💪 منيح! '+qsc+'/١٠':'🌱 ارجع احفظ وجرّب! '+qsc+'/١٠';return}
 qrd++;
 const c=cur[Math.floor(Math.random()*cur.length)];
 const opts=[c[1]];while(opts.length<Math.min(4,cur.length)){const r=cur[Math.floor(Math.random()*cur.length)][1];if(!opts.includes(r))opts.push(r)}
 opts.sort(()=>Math.random()-.5);
 document.getElementById('qst').textContent='شو ترجمة: '+c[0]+' ؟ — '+qrd+'/١٠ نقاط: '+qsc;
 document.getElementById('qbox').innerHTML=opts.map(o=>`<button class="opt" onclick="qchk(this,'${o}','${c[1]}')">${o}</button>`).join('');
}
function qchk(b,o,a){if(o===a){b.classList.add('ok');qsc++}else{b.classList.add('no')}setTimeout(qNext,600)}
function addCard(){
 const n=document.getElementById('dn').value.trim(),f=document.getElementById('df').value.trim(),b=document.getElementById('db').value.trim();
 if(!n||!f||!b){document.getElementById('mst').textContent='⚠️ عبّي الخانات الثلاثة!';return}
 if(!custom[n])custom[n]=[];
 custom[n].push([f,b]);
 localStorage.setItem('flash_custom',JSON.stringify(custom));
 document.getElementById('df').value='';document.getElementById('db').value='';
 document.getElementById('mst').textContent='✅ انضافت! رزمة "'+n+'" فيها '+custom[n].length+' بطاقة';
 renderMine();
}
function renderMine(){
 document.getElementById('mlist').innerHTML=Object.keys(custom).map(n=>`<div class="card" style="text-align:right"><b style="font-size:18px">🃏 ${n} (${custom[n].length})</b><br><small style="color:#9aa3c0">${custom[n].slice(0,5).map(c=>c[0]).join('، ')}...</small><br><button class="big" onclick="delDeck('${n}')" style="background:#dc2626;color:#fff">🗑️ حذف الرزمة</button></div>`).join('')||'<div class="note">لسا ما صنعت رزم — ابدأ بالأولى!</div>';
}
function delDeck(n){delete custom[n];localStorage.setItem('flash_custom',JSON.stringify(custom));renderMine()}
renderDecks();
</script>
</body>
</html>
