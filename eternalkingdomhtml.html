<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 المملكة الخالدة | نظام الإدارة الرقمي</title>
    
    <!-- خطوط احترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #030305; /* أسود عميق جدا */
            --card-bg: rgba(20, 20, 30, 0.6); /* شفاف مع ضبابية */
            --border-light: rgba(255, 255, 255, 0.08);
            --neon-gold: #FFD700;
            --neon-cyan: #00F0FF;
            --neon-purple: #BC13FE;
            --neon-green: #00FF88;
            --neon-red: #FF4444;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --font-tech: 'Cairo', sans-serif;
            --font-body: 'Tajawal', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- خلفية ديناميكية متحركة --- */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(188, 19, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 60%);
            animation: pulseBg 10s infinite alternate ease-in-out;
        }
        @keyframes pulseBg {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* --- الهيدر الزجاجي العائم --- */
        header {
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(3,3,5,0.9), rgba(3,3,5,0.4));
            border-bottom: 1px solid var(--border-light);
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand h1 {
            font-family: var(--font-tech);
            font-size: 1.4rem;
            background: linear-gradient(to right, #fff, var(--neon-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .brand small { color: var(--text-muted); font-size: 0.7rem; font-weight: 300; }

        .controls { display: flex; gap: 10px; }
        .btn-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-light);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-family: var(--font-body);
            font-weight: bold; font-size: 0.8rem;
            cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-control:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .btn-add { border-color: var(--neon-gold); color: var(--neon-gold); }
        .btn-present { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        /* --- شبكة العرض --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            padding: 30px 20px;
            max-width: 1200px; margin: 0 auto;
        }

        /* --- البطاقة الملكية (The Royal Card) --- */
        .royal-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* تأثير التوهج العلوي حسب الحالة */
        .royal-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .royal-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px var(--glow-color);
            border-color: var(--accent-color);
        }

        /* ألوان الحالات الديناميكية */
        .status-ready { --accent-color: var(--neon-green); --glow-color: rgba(0, 255, 136, 0.2); }
        .status-work { --accent-color: var(--neon-gold); --glow-color: rgba(255, 215, 0, 0.2); }
        .status-monitor { --accent-color: var(--neon-red); --glow-color: rgba(255, 68, 68, 0.2); }
        .status-brand { --accent-color: var(--neon-purple); --glow-color: rgba(188, 19, 254, 0.2); }

        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
        
        .icon-wrapper {
            width: 50px; height: 50px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--accent-color);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .title-area h3 {
            font-family: var(--font-tech);
            font-size: 1.1rem; font-weight: 800; color: #fff;
            margin-bottom: 4px; line-height: 1.3;
        }
        .tag-pill {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;
            background: rgba(255,255,255,0.1); color: var(--text-muted);
            display: inline-block;
        }

        .notes-container {
            background: rgba(0,0,0,0.2);
            border-right: 3px solid var(--accent-color);
            padding: 15px; margin: 15px 0;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem; color: #cbd5e1; line-height: 1.6;
            white-space: pre-wrap; /* يحافظ على الأسطر */
        }

        .actions-footer {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }

        .btn-action {
            padding: 12px; border-radius: 10px; border: none;
            font-family: var(--font-body); font-weight: bold; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        
        .btn-primary {
            background: var(--accent-color); color: #000;
            box-shadow: 0 4px 15px var(--glow-color);
        }
        .btn-primary:hover { filter: brightness(1.1); transform: scale(1.02); }
        
        .btn-secondary {
            background: rgba(255,255,255,0.05); color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        .btn-edit-full {
            grid-column: span 2;
            background: transparent; color: var(--text-muted);
            font-size: 0.8rem; padding: 8px; border: 1px dashed rgba(255,255,255,0.1);
        }
        .btn-edit-full:hover { color: var(--neon-red); border-color: var(--neon-red); }

        /* --- نافذة التعديل (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-box {
            background: #1a1a24; border: 1px solid var(--neon-cyan);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 450px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
            transform: scale(0.9); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; color: var(--neon-cyan); font-size: 0.85rem; font-weight: bold; }
        .form-input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px;
            font-family: var(--font-body); font-size: 1rem;
        }
        .form-input:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
        textarea.form-input { resize: vertical; min-height: 80px; }

        /* --- إشعارات Toast --- */
        #toast-container { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item {
            background: rgba(20,20,30,0.95); backdrop-filter: blur(10px);
            border-left: 4px solid var(--neon-green); color: #fff;
            padding: 15px 20px; border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px;
            animation: slideUp 0.4s forwards, fadeOut 0.4s 2.5s forwards;
            pointer-events: auto;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* --- وضع العرض التقديمي --- */
        body.present-mode header, body.present-mode .actions-footer, body.present-mode .notes-container { display: none !important; }
        body.present-mode .royal-card { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: transparent; border: none; box-shadow: none; }
        body.present-mode .title-area h3 { font-size: 2.5rem; }
        body.present-mode .icon-wrapper { width: 100px; height: 100px; font-size: 3rem; margin-bottom: 20px; }
        body.present-mode .dashboard-grid { place-items: center; }

    </style>
</head>
<body>

<div class="ambient-bg"></div>

<header>
    <div class="brand">
        <h1><i class="fas fa-crown"></i> المملكة الخالدة</h1>
        <small>Eternal Kingdom OS v2.0 (Royal Edition)</small>
    </div>
    <div class="controls">
        <button class="btn-control btn-present" onclick="togglePresentMode()"><i class="fas fa-desktop"></i> عرض</button>
        <button class="btn-control btn-add" onclick="openModal()"><i class="fas fa-plus"></i> إضافة</button>
    </div>
</header>

<main class="dashboard-grid" id="gridContainer">
    <!-- الحقن هنا -->
</main>

<!-- Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h2 style="color:#fff; margin-bottom:20px; font-family:var(--font-tech);"><i class="fas fa-magic"></i> سحر الرابط الجديد</h2>
        <input type="hidden" id="editId">
        <div class="form-group">
            <label class="form-label">اسم الكنز / المنتج</label>
            <input type="text" id="inpName" class="form-input" placeholder="مثال: استوديو الطهاة...">
        </div>
        <div class="form-group">
            <label class="form-label">الرابط الأصلي (Face Value)</label>
            <input type="url" id="inpOriginal" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
            <label class="form-label">الرابط المختصر (Sword)</label>
            <input type="url" id="inpShort" class="form-input" placeholder="https://shrinkme...">
        </div>
        <div class="form-group">
            <label class="form-label">الحالة اللونية</label>
            <select id="inpStatus" class="form-input">
                <option value="ready">🟢 جاهز للنشر (Green)</option>
                <option value="work">🟡 قيد العمل (Gold)</option>
                <option value="monitor">🔴 مراقبة (Red)</option>
                <option value="brand">🔵 براند (Purple)</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">التعليمات السرية</label>
            <textarea id="inpNotes" class="form-input" placeholder="اكتب النص التسويقي هنا..."></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:25px;">
            <button class="btn-action btn-primary" style="flex:2" onclick="saveData()">حفظ في ذاكرة المملكة</button>
            <button class="btn-action btn-secondary" style="flex:1" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    // البيانات الافتراضية المحسنة
    let kingdomDB = [
        {
            id: 1,
            name: "متجر Sellix الرئيسي",
            originalUrl: "https://falcon-apps-1.sellix.cx",
            shortUrl: "https://shrinkme.click/xBRYF",
            status: "ready",
            notes: "ابدأ به أولاَ لجذب الزوار للتصفح.\nالنص المقترح: \"شاهد الكتالوج الكامل بخصم الإطلاق!\"",
            icon: "fa-store"
        },
        {
            id: 2,
            name: "استوديو الطهاة الملكي",
            originalUrl: "https://ff1980ff.github.io/mamlaka/recipestudiohtml.html",
            shortUrl: "", 
            status: "work",
            notes: "السعر $4.99. الميزة: تسجيل صوت/فيديو.\nيجب توليد رابط مختصر لهذا المنتج تحديداَ اليوم.",
            icon: "fa-utensils"
        },
        {
            id: 3,
            name: "Swagbucks (ربح سريع)",
            originalUrl: "www.swagbucks.com/register?...",
            shortUrl: "https://exe.io/V9nt2bNG",
            status: "monitor",
            notes: "لا تضغط عليه بنفسك كثيراَ لتجنب الحظر.\nراقب الإحصائيات مساءً فقط.",
            icon: "fa-coins"
        },
        {
            id: 4,
            name: "منظومة توازن (GitHub)",
            originalUrl: "https://ff1980ff.github.io/mamlaka/index.html",
            shortUrl: "(ضع رابط الاختصار هنا)",
            status: "brand",
            notes: "الجمهور المستهدف: المطورين ومصممي الويب.\nالغرض: إثبات الخبرة وليس البيع المباشر.",
            icon: "fa-code"
        }
    ];

    const grid = document.getElementById('gridContainer');
    const modal = document.getElementById('editModal');

    // تحميل من LocalStorage
    const saved = localStorage.getItem('kingdom_v2_data');
    if(saved) { try { kingdomDB = JSON.parse(saved); } catch(e){} }

    function render() {
        grid.innerHTML = '';
        kingdomDB.forEach(item => {
            const card = document.createElement('div');
            card.className = `royal-card status-${item.status}`;
            
            // حساب لون النص للحالة
            const statusText = item.status === 'ready' ? 'جاهز' : item.status === 'work' ? 'قيد العمل' : item.status === 'monitor' ? 'مراقبة' : 'براند';
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="title-area">
                        <h3>${item.name}</h3>
                        <span class="tag-pill">${statusText}</span>
                    </div>
                    <div class="icon-wrapper"><i class="fas ${item.icon || 'fa-link'}"></i></div>
                </div>
                
                <div class="notes-container">${item.notes}</div>

                <div class="actions-footer">
                    <button class="btn-action btn-primary" onclick="copyLink('${item.shortUrl}', 'short')">
                        <i class="fas fa-bolt"></i> نسخ المختصر
                    </button>
                    <button class="btn-action btn-secondary" onclick="window.open('${item.originalUrl}', '_blank')">
                        <i class="fas fa-external-link-alt"></i> فتح الأصلي
                    </button>
                    <button class="btn-action btn-edit-full" onclick="editItem(${item.id})">
                        <i class="fas fa-pen-nib"></i> تعديل السحر
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function copyLink(url, type) {
        if(!url || url.includes("ضع")) {
            showToast("الرابط غير مكتمل!", "error");
            return;
        }
        navigator.clipboard.writeText(url).then(() => {
            playSound();
            showToast(type === 'short' ? "تم نسخ الرابط المختصر!" : "تم النسخ!", "success");
        }).catch(() => showToast("فشل النسخ", "error"));
    }

    function showToast(msg, type) {
        const t = document.createElement('div');
        t.className = 'toast-item';
        t.style.borderLeftColor = type === 'success' ? 'var(--neon-green)' : 'var(--neon-red)';
        t.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-exclamation-triangle'}"></i> ${msg}`;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function playSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    }

    // CRUD Functions
    function openModal(id = null) {
        const isEdit = !!id;
        const item = isEdit ? kingdomDB.find(i => i.id == id) : null;
        
        document.getElementById('editId').value = isEdit ? id : "";
        document.getElementById('inpName').value = isEdit ? item.name : "";
        document.getElementById('inpOriginal').value = isEdit ? item.originalUrl : "";
        document.getElementById('inpShort').value = isEdit ? item.shortUrl : "";
        document.getElementById('inpStatus').value = isEdit ? item.status : "ready";
        document.getElementById('inpNotes').value = isEdit ? item.notes : "";
        
        modal.classList.add('active');
    }

    function editItem(id) { openModal(id); }
    function closeModal() { modal.classList.remove('active'); }

    function saveData() {
        const idVal = document.getElementById('editId').value;
        const newData = {
            id: idVal ? parseInt(idVal) : Date.now(),
            name: document.getElementById('inpName').value,
            originalUrl: document.getElementById('inpOriginal').value,
            shortUrl: document.getElementById('inpShort').value,
            status: document.getElementById('inpStatus').value,
            notes: document.getElementById('inpNotes').value,
            icon: idVal ? kingdomDB.find(i=>i.id==parseInt(idVal)).icon : 'fa-star'
        };

        if(!newData.name || !newData.originalUrl) { alert("أكمل الحقول الأساسية!"); return; }

        if(idVal) {
            const idx = kingdomDB.findIndex(i => i.id == idVal);
            kingdomDB[idx] = newData;
        } else {
            kingdomDB.push(newData);
        }

        localStorage.setItem('kingdom_v2_data', JSON.stringify(kingdomDB));
        closeModal();
        render();
        showToast("تم تحديث ذاكرة المملكة بنجاح!", "success");
    }

    function togglePresentMode() {
        document.body.classList.toggle('present-mode');
        showToast(document.body.classList.contains('present-mode') ? "وضع العرض مفعل (ESC للخروج)" : "عودة للوحة القيادة", "info");
    }
    
    document.addEventListener('keydown', e => { if(e.key === 'Escape') document.body.classList.remove('present-mode'); });

    // Init
    render();
</script>
</body>
</html>
