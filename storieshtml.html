<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📖 مكتبة القصص الملكية | تعلم واستمتع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f8fafc;color:#1e293b;line-height:1.8}
header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:20px;text-align:center;border-bottom:4px solid #fbbf24}
h1{font-size:1.5rem;margin-bottom:5px}
.sub{font-size:0.9rem;color:#cbd5e1}
.container{max-width:600px;margin:20px auto;padding:0 15px}
.story-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.05);border:1px solid #e2e8f0;transition:transform 0.2s}
.story-card:hover{transform:translateY(-2px);box-shadow:0 10px 15px rgba(0,0,0,0.1)}
.tag{display:inline-block;background:#fef3c7;color:#d97706;font-size:0.75rem;padding:4px 8px;border-radius:99px;font-weight:bold;margin-bottom:10px}
.tag.hist{background:#dbeafe;color:#1d4ed8}
.tag.edu{background:#dcfce7;color:#15803d}
.tag.fun{background:#fce7f3;color:#be185d}
.story-title{font-size:1.2rem;font-weight:800;color:#0f172a;margin-bottom:10px}
.story-content{font-size:1rem;color:#334155;margin-bottom:15px;white-space:pre-wrap}
.share-btn{width:100%;background:#22c55e;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.3s}
.share-btn:hover{background:#16a34a}
.loader{display:none;text-align:center;color:#fbbf24;font-size:12px;margin-top:5px}
footer{text-align:center;padding:20px;color:#64748b;font-size:0.8rem;border-top:1px solid #e2e8f0;margin-top:40px}
.back-home{display:block;text-align:center;margin:20px;color:#38bdf8;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<header>
    <h1>📖 مكتبة القصص الملكية</h1>
    <div class="sub">قصص تُلهم العقل، وتُغذي الروح... وتدعم المشروع!</div>
</header>

<a href="index.html" class="back-home">⬅️ العودة للمملكة الرئيسية</a>

<div class="container" id="storiesContainer">
    <!-- سيتم حقن القصص هنا بواسطة JavaScript -->
</div>

<footer>
    © 2026 مملكة التطبيقات | محتوى هادف لخدمة المجتمع 🇸<br>
    جميع الحقوق محفوظة • <a href="#" style="color:#38bdf8">سياسة الخصوصية</a>
</footer>

<script>
// ==========================================
// ⚠️ ضع مفاتيحك الحقيقية هنا
// ==========================================
const SHRINK_API_KEY = '8a00e563ec670798e86aeb5560a6f424894f3bd4'; 
const EXE_API_KEY = '0fc4e8bc09ec2508d213af0e810bbe1d8f1cf4c3'; 

// رابط هذه الصفحة الحالي (لتوليد روابط فرعية لكل قصة)
const CURRENT_PAGE_URL = window.location.href.split('#')[0];

// قاعدة بيانات القصص
const STORIES = [
    {
        id: 1,
        type: "hist",
        label: "تاريخ",
        title: "سر الصمود في معركة اليرموك",
        content: "في عام 636 ميلادية، وقف خالد بن الوليد أمام جيش الروم الضخم.\nلم يكن العدد لصالح المسلمين، لكن الإيمان والاستراتيجية كانت السلاح الأقوى.\n\nهل تعلم أن خالداً استخدم تكتيك 'الهجوم الخاطف' الذي أربك صفوف العدو؟\nالقصة الكاملة تكشف تفاصيل لم يذكرها التاريخ المدرسي...",
        hook: "اقرأ التفاصيل المروية لأول مرة عن خطط خالد بن الوليد الذكية."
    },
    {
        id: 2,
        type: "edu",
        label: "تعليمي",
        title: "خطأ لغوي يقع فيه 90% من المتحدثين",
        content: "كثيراَ ما نسمع عبارة: 'إن شاء الله'.\nلكن هل تعرف الفرق بين كتابتها 'إن شاء الله' و 'انشاء الله'؟\n\nالأولى فعل مضارع (يشاء)، والثانية اسم مصدر (إنشاء).\nالفرق دقيق لكنه يعكس ثقافتك اللغوية.\n\nتعلم القاعدة الذهبية لتجنب هذا الخطأ الشائع.",
        hook: "اكتشف السر البسيط الذي يجعلك تتحدث بفصحى سليمة دائماً."
    },
    {
        id: 3,
        type: "fun",
        label: "غامض",
        title: "اللغز الذي حير العلماء: لماذا لا نتذكر طفولتنا؟",
        content: "هل سبق لك أن حاولت تذكر يومك الأول في المدرسة؟\nمعظم البالغين يفشلون في استرجاع ذكريات قبل سن الثالثة أو الرابعة.\n\nعلم النفس يسميها 'فقدان الذاكرة الرضيعي'.\nالسبب ليس ضياع الذكريات، بل أن الدماغ لم يكن قد طور بعد المناطق المسؤولة عن تخزينها بشكل دائم.\n\nاكتشف كيف يعمل دماغك ولماذا تنسى أشياء مهمة جداً.",
        hook: "حل اللغز العلمي وراء نسيان أجمل أيام حياتك."
    }
];

function renderStories() {
    const container = document.getElementById('storiesContainer');
    if(!container) return; // حماية إضافية
    
    container.innerHTML = STORIES.map(story => `
        <div class="story-card" id="story-${story.id}">
            <span class="tag ${story.type}">${story.label}</span>
            <h2 class="story-title">${story.title}</h2>
            <div class="story-content">${story.content}</div>
            <button class="share-btn" onclick="shareStory(${story.id})">
                📢 شارك هذه القصة واربح زواراَ
            </button>
            <div class="loader" id="loader-${story.id}">⏳ جارٍ تجهيز الرابط...</div>
        </div>
    `).join('');
}

// دالة الربح الذكية (نسخة محسنة لـ Exe.io + WAF)
async function getProfitUrl(longUrl) {
    // 1. المحاولة الأولى والأفضل: Exe.io عبر وسيط آمن
    try {
        const targetUrl = `https://exe.io/api?api=${EXE_API_KEY}&url=${encodeURIComponent(longUrl)}`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl) return data.shortenedUrl;
        }
    } catch (e) {
        console.warn("Exe.io failed, trying ShrinkMe...");
    }

    // 2. المحاولة الاحتياطية: ShrinkMe.io عبر وسيط آمن
    try {
        const targetUrlS = `https://shrinkme.io/api?url=${encodeURIComponent(longUrl)}&token=${SHRINK_API_KEY}`;
        const proxyUrlS = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrlS)}`;
        
        const responseS = await fetch(proxyUrlS);
        if (responseS.ok) {
            const dataS = await responseS.json();
            if (dataS.shortenedUrl || dataS.link) return dataS.shortenedUrl || dataS.link;
        }
    } catch (e) {}

    // 3. في حال الفشل التام، نعيد الرابط الأصلي
    return longUrl; 
}

async function shareStory(id) {
    const story = STORIES.find(s => s.id === id);
    if(!story) return;

    const loader = document.getElementById(`loader-${id}`);
    if(loader) loader.style.display = 'block';

    // إنشاء رابط فريد لهذه القصة
    const uniqueUrl = `${CURRENT_PAGE_URL}#story-${id}`;
    
    // توليد الرابط المختصر المربح
    const profitLink = await getProfitUrl(uniqueUrl);
    
    if(loader) loader.style.display = 'none';

    // بناء نص المنشور الجذاب
    const postText = `📖 قصة جديدة من مكتبة المملكة:\n\n"${story.title}"\n\n${story.hook}\n\n👇 اقرأ الآن عبر هذا الرابط:\n${profitLink}\n\n#قصص #ثقافة #مملكة_التطبيقات`;

    // محاولة النشر التلقائي أو النسخ
    if(navigator.share) {
        navigator.share({
            title: story.title,
            text: postText
        }).then(() => {
            alert("✅ تم النشر! شكراً لدعمك.");
        }).catch(err => {
            copyToClipboard(postText);
        });
    } else {
        copyToClipboard(postText);
    }
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert("📋 اننسخت الرسالة! الصقها في واتساب أو فيسبوك.");
    }).catch(err => {
        const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
        alert("📋 اننسخت!");
    });
}

// تشغيل العرض عند تحميل الصفحة
window.onload = () => {
    renderStories();
};
</script>
</body>
</html>
