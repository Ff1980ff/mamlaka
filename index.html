<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خلوة 5 — المدينة الكاملة 🏙️</title>
<style>
body{background:#0b1026;color:#f7ead9;font-family:Tahoma;padding:16px}
h1{text-align:center;font-size:18px}
.box{background:#141a33;border:1px solid #2a3157;border-radius:16px;padding:14px;margin-bottom:12px}
label{font-size:12px;color:#9aa3c0;display:block;margin-bottom:6px}
input,textarea,select{width:100%;background:#0b1026;color:#f7ead9;border:1px solid #2a3157;border-radius:10px;padding:10px;font-size:13px}
textarea{min-height:150px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button{flex:1;border:none;border-radius:99px;padding:13px;font-size:14px;font-weight:bold;cursor:pointer;background:#f5a524;color:#241303;min-width:45%}
button.b2{background:#22d3ee;color:#03242e}
button.b3{background:#334155;color:#f7ead9}
#log{white-space:pre-wrap;font-size:12px;color:#7ee787;min-height:60px}
</style>
</head>
<body>
<h1>🏙️ خلوة 5 — المدينة الكاملة</h1>
<div class="box"><label>المفتاح السري:</label><input id="tok" placeholder="ghp_..."></div>
<div class="box"><label>اختار البيت:</label>
<select id="path">
<option value="index.html">🏰 الأساسي — index.html</option>
<option value="sakhra.html">🪨 صخرة المعرفة — sakhra</option>
<option value="huruf.html">🌿 مدينة الحروف — huruf</option>
<option value="daftar.html">📒 دفتر المملكة — daftar</option>
<option value="bawaba.html">🏠 بوابة المملكة — bawaba</option>
<option value="maktaba.html">📚 مكتبتي الملكية — maktaba</option>
<option value="saboura.html">🎓 السبورة — saboura</option>
<option value="handasi.html">🏗️ مهندسي المعماري — handasi</option>
<option value="mutarjim.html">📖 مترجمي الناطق — mutarjim</option>
<option value="qalam.html">🖊️ قلمي الناطق — qalam</option>
<option value="mail.html">📧 مصنع الإيميلات — mail</option>
<option value="sarraf.html">💱 صراف العملات — sarraf</option>
<option value="kora.html">🌍 كرتنا الزرقاء — kora</option>
<option value="marsam.html">🎨 مرسمي الصغير — marsam</option>
<option value="flash.html">🃏 فلاشاتي الذكية — flash</option>
<option value="islam.html">🕌 موسوعتي الإسلامية — islam</option>
<option value="video.html">🎬 استوديو الفيديو — video</option>
<option value="qari.html">🔊 قارئي الذكي — qari</option>
<option value="rawda.html">📱 روضة الجيب — rawda</option>
<option value="jismi.html">🫀 أسرار جسمي — jismi</option>
<option value="diyafa.html">🛋️ ضيافة وترحيب — diyafa</option>
<option value="safara.html">📎 سفارة الروابط — safara</option>
<option value="mirsal.html">🕊️ المِرسال — mirsal</option>
<option value="muktashif.html">🔭 المكتشف — muktashif</option>
<option value="riwaq.html">🏛️ الرواق — riwaq</option>
</select>
</div>
<div class="box"><label>الكود:</label><textarea id="code"></textarea></div>
<div class="row">
 <button class="b3" onclick="clr()">🧹 مسح</button>
 <button class="b2" onclick="check()">🔍 فحص</button>
</div>
<div class="row">
 <button onclick="publish()">🚀 نشر</button>
 <button class="b2" onclick="preview()">👁️ معاينة</button>
</div>
<div class="box"><label>سجل الخلوة:</label><div id="log">جاهز...</div></div>
<script>
const OWNER="Ff1980ff",REPO="mamlaka";
const L=m=>{document.getElementById("log").textContent=m};
function b64(s){const b=new TextEncoder().encode(s);let x="";b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)}
function clr(){document.getElementById("code").value="";L("🧹 انمسحت الخانة — الصق الكود")}
function check(){
 const c=document.getElementById("code").value;
 const tail=c.trim().slice(-40);
 if(c.trim().length<20){L("❌ الخانة فاضية — الصق أول");return}
 L("طول الكود: "+c.length+" حرف\nآخره: ..."+tail+"\n✅ الفحص تمام — دوس 🚀");
}
function preview(){window.open("https://"+OWNER+".github.io/"+REPO+"/"+document.getElementById("path").value+"?v="+Date.now(),"_blank")}
async function publish(){
 const tok=document.getElementById("tok").value.trim()||localStorage.getItem("ghTok");
 if(!tok){L("❌ حط المفتاح");return}
 localStorage.setItem("ghTok",tok);
 const PATH=document.getElementById("path").value;
 const code=document.getElementById("code").value;
 if(code.trim().length<20){L("❌ الصق الكود أول");return}
 L("⏳ عم نبني "+PATH+" ...");
 try{
  let sha=null;
  const g=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+PATH,{headers:{Authorization:"token "+tok}});
  if(g.ok){sha=(await g.json()).sha}
  const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+PATH,{method:"PUT",headers:{Authorization:"token "+tok,"Content-Type":"application/json"},body:JSON.stringify({message:"بناء "+PATH+" 🏙️",content:b64(code),sha:sha||undefined})});
  if(r.ok){L("✅ انبنى "+PATH+"!\nدوس 👁️ معاينة")}
  else{L("❌ "+((await r.json()).message||"فشل"))}
 }catch(e){L("❌ اتصال: "+e.message)}
}
</script>
</body>
</html>
