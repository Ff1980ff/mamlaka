<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ناشر الكتب الذهبي | نشر وترويج مربح</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma,sans-serif}
body{background:#0b1026;color:#f7ead9;padding:14px;padding-bottom:40px}
header{text-align:center;padding:10px;font-weight:900;color:#f5a524;font-size:19px}
header small{display:block;color:#9aa3c0;font-weight:400;font-size:11px;margin-top:4px}
section{max-width:560px;margin:auto}
label{display:block;margin:12px 0 6px;color:#9aa3c0;font-size:13px}
input,button{width:100%;border-radius:12px;border:1px solid #2a3157;background:#141a33;color:#f7ead9;padding:12px;font-size:14px;font-family:inherit}
.go{background:#f5a524;color:#241303;border:none;font-weight:900;font-size:16px;margin-top:16px;cursor:pointer;transition:transform 0.2s}
.go:active{transform:scale(0.98)}
#log{margin-top:16px;background:#141a33;border:1px solid #2a3157;border-radius:14px;padding:12px;font-size:13px;line-height:2;min-height:60px;word-break:break-all;overflow-y:auto;max-height:300px}
.promo-box{display:none;margin-top:15px;padding:15px;background:linear-gradient(135deg,#1e1b4b,#4c1d95);border:2px solid #f5a524;border-radius:16px;text-align:center;animation:fadeIn 0.5s ease-out}
.promo-btn{background:#22c55e;color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;box-shadow:0 4px 15px rgba(34,197,94,0.4);transition:all 0.3s}
.promo-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,197,94,0.6)}
.profit-link-display{background:#000;color:#4ade80;padding:10px;border-radius:8px;font-family:monospace;font-size:12px;margin-top:10px;word-break:break-all;display:none;border:1px dashed #4ade80}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.loader-small{display:inline-block;width:10px;height:10px;border:2px solid #fff;border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-left:5px;}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>📚 ناشر الكتب الملكي v2
<small>ارفع PDF — انشره — وحوّله لرابط مربح بضغطة زر!</small></header>
<section>
 <label>🔑 المفتاح السري (GitHub Token):</label>
 <input id="tok" type="password" placeholder="ghp_...">
 <label>📄 اختار الملف (PDF أو غيره):</label>
 <input type="file" id="f">
 <label>🏷️ اسمو بالمملكة (مسار الحفظ):</label>
 <input id="name" placeholder="books/my-book.pdf">
 <button class="go" onclick="pub()">🚀 نشر وتجهيز للترويج</button>
 
 <!-- صندوق الترويج الذهبي -->
 <div id="promoBox" class="promo-box">
    <h3 style="color:#f5a524;margin-bottom:5px;">✅ تم النشر بنجاح!</h3>
    <p style="font-size:12px;color:#ccc;margin-bottom:10px;">الآن حوّل هذا الكتاب إلى مصدر دخل:</p>
    <button class="promo-btn" onclick="generateProfitLinkForBook()">💸 ولّد الرابط المربح للنشر</button>
    <div id="profitResult" class="profit-link-display"></div>
    <button id="copyProfitBtn" style="display:none;margin-top:5px;background:#38bdf8;color:#000;border:none;padding:8px;border-radius:8px;font-weight:bold;cursor:pointer;" onclick="copyProfitLink()">📋 نسخ الرابط المربح</button>
 </div>

 <div id="log">جاهز... عبّي الحقول ودوس نشر.</div>
</section>

<script>
// ==========================================
// ⚠️ ضع مفاتيحك الحقيقية هنا
// ==========================================
const SHRINK_API_KEY = 'ضع_مفتاح_ShrinkMe_هنا'; 
const EXE_API_KEY = 'ضع_مفتاح_Exe_io_هنا'; 

const owner='ff1980ff',repo='mamlaka',branch='main';
let currentDirectUrl = ""; // لتخزين الرابط المباشر بعد النشر

document.getElementById('f').onchange=e=>{const f=e.target.files[0];if(f&&!document.getElementById('name').value)document.getElementById('name').value='books/'+f.name};
function log(t){const l=document.getElementById('log');l.innerHTML+='<br>'+t;l.scrollTop=1e9}

async function pub(){
 const tok=document.getElementById('tok').value.trim(),f=document.getElementById('f').files[0],path=document.getElementById('name').value.trim();
 if(!tok||!f||!path){log('❌ عبّي المفتاح والملف والاسم');return}
 
 document.getElementById('promoBox').style.display='none';
 log('⏳ عم نقرأ الملف ('+(f.size/1024/1024).toFixed(1)+' MB)...');
 
 try {
    const b64=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.readAsDataURL(f)});
    const H={Authorization:'token '+tok,'Content-Type':'application/json'};
    const api='https://api.github.com/repos/'+owner+'/'+repo;
    
    log('⏳ عم نجيب رأس الفرع...');
    let r=await fetch(api+'/git/ref/heads/'+branch,{headers:H});let j=await r.json();const baseSha=j.object.sha;
    r=await fetch(api+'/git/commits/'+baseSha,{headers:H});j=await r.json();const baseTree=j.tree.sha;
    
    log('⏳ عم نرفع الملف...');
    r=await fetch(api+'/git/blobs',{method:'POST',headers:H,body:JSON.stringify({content:b64,encoding:'base64'})});j=await r.json();
    if(!j.sha)throw new Error(j.message||'رفع الملف فشل');
    const blobSha=j.sha;
    
    r=await fetch(api+'/git/trees',{method:'POST',headers:H,body:JSON.stringify({base_tree:baseTree,tree:[{path:path,mode:'100644',type:'blob',sha:blobSha}]})});j=await r.json();
    if(!j.sha)throw new Error(j.message||'الشجرة فشلت');
    
    r=await fetch(api+'/git/commits',{method:'POST',headers:H,body:JSON.stringify({message:'📚 نشر: '+path,tree:j.sha,parents:[baseSha]})});j=await r.json();
    if(!j.sha)throw new Error(j.message||'الحفظ فشل');
    
    r=await fetch(api+'/git/refs/heads/'+branch,{method:'PATCH',headers:H,body:JSON.stringify({sha:j.sha})});
    
    currentDirectUrl = 'https://'+owner+'.github.io/'+repo+'/'+encodeURI(path);
    
    log('✅ <b>اننشر!</b>');
    log('<a href="'+currentDirectUrl+'" target="_blank" style="color:#f5a524">'+currentDirectUrl+'</a>');
    log('💡 اضغط الزر الأخضر بالأسفل لتحويله لرابط مربح.');
    
    // إظهار صندوق الترويج
    document.getElementById('promoBox').style.display='block';
    
 }catch(e){
    log('❌ صار غلط: '+e.message);
 }
}

// دالة الربح الذكية
async function getProfitUrl(longUrl) {
    try {
        const apiUrl = `https://shrinkme.io/api?url=${encodeURIComponent(longUrl)}&token=${SHRINK_API_KEY}`;
        const response = await fetch(apiUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl || data.link) return data.shortenedUrl || data.link;
        }
    } catch (e) {}
    try {
        const apiUrl = `https://exe.io/api?api=${EXE_API_KEY}&url=${encodeURIComponent(longUrl)}`;
        const response = await fetch(apiUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl) return data.shortenedUrl;
        }
    } catch (e) {}
    return longUrl; // احتياطيا
}

async function generateProfitLinkForBook() {
    if(!currentDirectUrl) return alert("لم يتم النشر بعد!");
    
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerHTML = '<span class="loader-small"></span> جارٍ التوليد...';
    btn.disabled = true;
    
    const profitLink = await getProfitUrl(currentDirectUrl);
    
    const resDiv = document.getElementById('profitResult');
    resDiv.innerText = profitLink;
    resDiv.style.display = 'block';
    
    document.getElementById('copyProfitBtn').style.display = 'inline-block';
    
    btn.innerText = "✅ تم التوليد";
    setTimeout(() => {
        btn.innerText = originalText;
        btn.disabled = false;
    }, 2000);
}

function copyProfitLink() {
    const text = document.getElementById('profitResult').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyProfitBtn');
        btn.innerText = "✅ اننسخت!";
        setTimeout(() => btn.innerText = "📋 نسخ الرابط المربح", 2000);
    });
}
</script>
</body>
</html>
