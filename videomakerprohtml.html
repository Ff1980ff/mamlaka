<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎬 استوديو الفيديو الذهبي | دمج صوت ومونتاج</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo', Tahoma, sans-serif}
body{background:linear-gradient(160deg,#4c1d95,#831843);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.frame{width:100%;max-width:470px;background:#1e1b4b;border:6px solid #e879f9;border-radius:24px;padding:16px;min-height:85vh;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
h2{text-align:center;font-size:19px;color:#f0abfc;margin-bottom:5px}
.sub{text-align:center;font-size:11px;color:#c4b5fd;margin:4px 0 12px;line-height:1.5}
input,textarea,select{width:100%;border:none;border-radius:12px;padding:11px;font-size:14px;background:#312e81;color:#fff;outline:none;border:1px solid #6d28d9;margin-bottom:8px;font-family:inherit}
textarea{min-height:70px;resize:none}
.btn{border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer;color:#1e1b4b;background:#e879f9;width:100%;margin-bottom:8px;transition:transform 0.2s}
.btn:active{transform:scale(0.98)}
.btn.g{background:#38bdf8;color:#000}.btn.gr{background:#334155;color:#fff}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
#audioOpt{display:none;margin-top:5px;padding:8px;background:#2e1065;border-radius:8px;border:1px dashed #a78bfa;}
#sList{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.sl{display:flex;gap:8px;align-items:center;background:#312e81;border-radius:12px;padding:6px}
.sl img{width:50px;height:80px;object-fit:cover;border-radius:8px}
.sl input{flex:1;margin:0}
.sl button{border:none;border-radius:8px;background:#ef4444;color:#fff;padding:6px 10px;cursor:pointer}
.st{text-align:center;font-size:12px;color:#c4b5fd;min-height:18px;margin:6px 0}
video{width:100%;border-radius:14px;display:none;margin-bottom:8px;border:2px solid #6d28d9}
.loader{display:none;text-align:center;color:#fbbf24;font-size:12px;margin-top:5px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}
</style>
</head>
<body>
<div class="frame">
<h2>🎬 استوديو الفيديو الذهبي v2</h2>
<div class="sub">صور + صوت مونتاج + رابط مربح = فيديو سينمائي!</div>

<input id="vTitle" placeholder="عنوان الفيديو">
<input id="vSub" placeholder="جملة دعائية قصيرة">
<input id="profitUrlInput" placeholder="الرابط للترويج (سيُقص تلقائياً)">

<label class="chk"><input type="checkbox" id="useCustomAudio" onchange="toggleAudioOption()"> 🎵 استخدام صوت من "المونتاج الملكي"</label>
<div id="audioOpt">
    <small style="color:#ddd;display:block;margin-bottom:5px;">اختر ملف WAV الذي صدرته من التطبيق الآخر:</small>
    <input type="file" id="customAudioFile" accept=".wav,.mp3,audio/*">
</div>

<label class="chk"><input type="checkbox" id="mus" checked style="width:auto;margin:0"> 🎶 موسيقى افتراضية (إذا لم تختر صوتاً)</label>
<input type="file" id="imgs" accept="image/*" multiple onchange="addFiles(this)">
<div id="sList"></div>

<button class="btn" onclick="startExport()">✨ ابدأ التصدير الذكي</button>
<div class="loader" id="loader">⏳ جارٍ المعالجة...</div>
<div class="st" id="st"></div>
<video id="vid" controls></video>
<button class="btn g" id="dlB" style="display:none" onclick="dlV()">📥 تنزيل الفيديو</button>
<button class="btn gr" id="shB" style="display:none" onclick="shareV()">📤 مشاركة مباشرة</button>
</div>

<script>
// ==========================================
// ⚠️ ضع مفاتيحك الحقيقية هنا
// ==========================================
const SHRINK_API_KEY = 'ضع_مفتاح_ShrinkMe_هنا'; 
const EXE_API_KEY = 'ضع_مفتاح_Exe_io_هنا'; 

let slides=[],vUrl=null,chunks=[];
let customAudioBuffer = null; // لتخزين الصوت المرفوع

function toggleAudioOption() {
    const opt = document.getElementById('audioOpt');
    opt.style.display = document.getElementById('useCustomAudio').checked ? 'block' : 'none';
}

function addFiles(inp){
 [...inp.files].forEach(f=>{
  const im=new Image();
  im.onload=()=>{slides.push({im,cap:""});renderList()};
  im.src=URL.createObjectURL(f);
 });
 inp.value="";
}

function renderList(){
 document.getElementById("sList").innerHTML=slides.map((s,i)=>`<div class="sl"><img src="${s.im.src}"><input placeholder="تعليق..." oninput="slides[${i}].cap=this.value" value="${s.cap}"><button onclick="slides.splice(${i},1);renderList()">✖</button></div>`).join("");
}

function txt(ctx,t,x,y,size,col,align){
 ctx.fillStyle=col||"#fff";ctx.font="bold "+size+"px Cairo, Tahoma";ctx.textAlign=align||"center";ctx.direction="rtl";
 ctx.fillText(t,x,y);
}

// دالة الربح الذكية
async function getProfitUrl(longUrl) {
    if(!longUrl) return null;
    try {
        const apiUrl = `https://shrinkme.io/api?url=${encodeURIComponent(longUrl)}&token=${SHRINK_API_KEY}`;
        const response = await fetch(apiUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl || data.link) return data.shortenedUrl || data.link;
        }
    } catch (e) {}
    try {
        const apiUrl = `https://exe.io/api?api=${EXE_API_KEY}&url=${encodeURIComponent(longUrl)}`;
        const response = await fetch(apiUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl) return data.shortenedUrl;
        }
    } catch (e) {}
    return longUrl;
}

async function startExport() {
    if(!slides.length){alert("ضيف صور أولًا");return}
    
    const loader = document.getElementById("loader");
    loader.style.display = 'block';
    st("جارٍ تجهيز المكونات...");

    // 1. معالجة الصوت المخصص إذا كان موجوداً
    if(document.getElementById('useCustomAudio').checked) {
        const fileInput = document.getElementById('customAudioFile');
        if(fileInput.files[0]) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    customAudioBuffer = await audioCtx.decodeAudioData(reader.result);
                    finishSetup(loader);
                } catch(e) {
                    alert("خطأ في قراءة ملف الصوت. تأكد أنه WAV أو MP3 صالح.");
                    loader.style.display='none';
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
            return; // ننتظر حتى ينتهي التحميل
        } else {
            alert("اختر ملف صوت أولاً!");
            loader.style.display='none';
            return;
        }
    } else {
        customAudioBuffer = null; // لا يوجد صوت مخصص
        finishSetup(loader);
    }
}

async function finishSetup(loader) {
    // 2. الحصول على الرابط المربح
    let finalProfitLink = "";
    const rawUrl = document.getElementById("profitUrlInput").value.trim();
    if(rawUrl) {
        finalProfitLink = await getProfitUrl(rawUrl);
    } else {
        finalProfitLink = await getProfitUrl("https://ff1980ff.github.io/mamlaka/index.html");
    }

    loader.style.display = 'none';
    doExport(finalProfitLink);
}

function doExport(profitLink) {
    const W=720,H=1280,cv=document.createElement("canvas");cv.width=W;cv.height=H;
    const ctx=cv.getContext("2d");
    const title=document.getElementById("vTitle").value||"تطبيقاتي الذكية";
    const sub=document.getElementById("vSub").value||"";
    
    const scenes=[{t:"intro"},...slides.map(s=>({t:"s",s}))];
    if(profitLink) scenes.push({t:"cta", link: profitLink});
    else scenes.push({t:"outro"});

    const DUR=3000,total=scenes.length*DUR;
    const vs=cv.captureStream(30);
    let stream=vs;
    
    // إدارة الصوت
    let audioDestNode = null;
    let acInstance = null;

    if(customAudioBuffer) {
        // استخدام الصوت المرفوع (من المونتاج الملكي)
        acInstance = new (window.AudioContext || window.webkitAudioContext)();
        audioDestNode = acInstance.createMediaStreamDestination();
        const source = acInstance.createBufferSource();
        source.buffer = customAudioBuffer;
        source.connect(audioDestNode);
        source.start();
        stream = new MediaStream([...vs.getVideoTracks(), ...audioDestNode.stream.getAudioTracks()]);
    } else if(document.getElementById("mus").checked) {
        // استخدام الموسيقى الافتراضية المولدة
        try{
            acInstance = new (window.AudioContext || window.webkitAudioContext)();
            audioDestNode = acInstance.createMediaStreamDestination();
            startMusic(acInstance, audioDestNode, total/1000);
            stream=new MediaStream([...vs.getVideoTracks(),...audioDestNode.stream.getAudioTracks()]);
        }catch(e){stream=vs}
    }
    
    const rec=new MediaRecorder(stream,{mimeType:"video/webm"});
    chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
     const b=new Blob(chunks,{type:"video/webm"});
     vUrl=URL.createObjectURL(b);
     const v=document.getElementById("vid");v.src=vUrl;v.style.display="block";
     document.getElementById("dlB").style.display="block";
     document.getElementById("shB").style.display="block";
     document.getElementById("st").textContent="✔️ الفيديو جاهز! شوفو وشاركوا";
     // تنظيف الموارد الصوتية
     if(source && source.stop) try{source.stop()}catch(e){}
    };
    
    rec.start();
    setTimeout(()=>{if(rec.state!=="inactive")rec.stop()},total+600);
    
    const t0=performance.now();
    document.getElementById("st").textContent="⏳ عم نسجل الفيديو السينمائي...";
    
    function frame(){
     const el=performance.now()-t0;
     if(el>=total){if(rec.state!=="inactive")rec.stop();return}
     
     const idx=Math.floor(el/DUR),p=(el%DUR)/DUR,sc=scenes[idx];
     
     const g=ctx.createLinearGradient(0,0,W,H);
     g.addColorStop(0,"#1e1b4b");g.addColorStop(1,"#831843");
     ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
     
     for(let i=0;i<14;i++){
      ctx.globalAlpha=0.25;
      ctx.fillStyle=["#e879f9","#38bdf8","#facc15"][i%3];
      ctx.beginPath();
      ctx.arc((i*97+el*0.03*(i%3+1))%W,(i*131+el*0.05)%H,4+(i%3)*3,0,7);
      ctx.fill();
     }
     
     ctx.globalAlpha=Math.min(1,p*5,(1-p)*5+0.25);
     
     if(sc.t==="intro"){
      const b=Math.sin(el/280)*12;
      txt(ctx,"🎬",W/2,H/2-160+b,110+Math.sin(el/200)*10);
      txt(ctx,title,W/2,H/2+b,62,"#f0abfc");
      if(sub)txt(ctx,sub,W/2,H/2+90,36,"#c4b5fd");
     }else if(sc.t==="cta"){
      txt(ctx,"🔗 زوروا موقعنا الآن!",W/2,H/2-200,50,"#facc15");
      ctx.fillStyle="#fff";
      ctx.fillRect(W/2-250, H/2-50, 500, 100);
      ctx.strokeStyle="#e879f9";ctx.lineWidth=4;
      ctx.strokeRect(W/2-250, H/2-50, 500, 100);
      ctx.fillStyle="#000";ctx.font="bold 32px monospace";ctx.textAlign="center";
      ctx.fillText(sc.link, W/2, H/2+15);
      txt(ctx,"اضغط على الرابط في الوصف أو انسخه 👆",W/2,H/2+150,30,"#fff");
      txt(ctx,"Powered by Mamlaka Apps",W/2,H-100,24,"#c4b5fd");
     }else if(sc.t==="outro"){
      txt(ctx,"📲",W/2,H/2-280+Math.sin(el/280)*10,95);
      txt(ctx,"حمّلوا تطبيقاتنا هلأ!",W/2,H/2-140,50,"#f0abfc");
      txt(ctx,"شاركوا الفيديو مع أصحابكم 💜",W/2,H-110,28,"#c4b5fd");
     }else{
      const z=1.05+p*0.12,ox=Math.sin(p*Math.PI)*24;
      const img=sc.s.im,s=Math.max(W/img.width,(H-280)/img.height)*z;
      const dw=img.width*s,dh=img.height*s;
      ctx.drawImage(img,(W-dw)/2+ox,((H-280)-dh)/2,dw,dh);
      ctx.fillStyle="rgba(30,27,75,.92)";ctx.fillRect(0,H-280,W,280);
      txt(ctx,title,W/2,H-210,32,"#f0abfc");
      const yOff=(1-Math.min(1,p*3))*120;
      if(sc.s.cap)txt(ctx,sc.s.cap,W/2,H-120+yOff,40,"#fff");
     }
     
     ctx.globalAlpha=1;
     ctx.fillStyle="#e879f9";ctx.fillRect(0,0,W*(el/total),10);
     requestAnimationFrame(frame);
    }
    frame();
}

function startMusic(AC,dest,dur){
 const step=0.28,scale=[523,587,659,784,880,784,659,587];
 for(let t=0;t<dur;t+=step){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type="sine";o.frequency.value=scale[Math.floor(t/step)%8];
  const at=AC.currentTime+t;
  g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(0.15,at+0.05);g.gain.exponentialRampToValueAtTime(0.0001,at+step*0.9);
  o.connect(g);g.connect(dest);g.connect(AC.destination);
  o.start(at);o.stop(at+step);
 }
}

function dlV(){const a=document.createElement("a");a.href=vUrl;a.download=(document.getElementById("vTitle").value||"promo")+".webm";a.click()}
function shareV(){
 fetch(vUrl).then(r=>r.blob()).then(b=>{
  const f=new File([b],"promo.webm",{type:"video/webm"});
  if(navigator.share&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"فيديو مملكتي"});
  else alert("نزّل الفيديو وابعثو يدوي");
 });
}
function st(m){document.getElementById("st").textContent=m}
</script>
</body>
</html>
