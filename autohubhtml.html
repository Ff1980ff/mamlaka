<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>👑 مركز التحكم الآلي | Auto Hub</title>
<style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; color: #1e293b; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #d97706; border-bottom: 2px solid #d97706; padding-bottom: 10px; }
    .loading { text-align: center; padding: 40px; font-size: 1.2rem; color: #64748b; }
    .file-list { display: grid; gap: 10px; }
    .file-item { 
        background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
    }
    .file-item:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .info h3 { margin: 0 0 5px 0; color: #0f172a; font-size: 1rem; word-break: break-all; }
    .actions button { 
        background: #d97706; color: white; border: none; padding: 6px 12px; border-radius: 6px; 
        cursor: pointer; font-weight: bold; margin-left: 5px; font-size: 0.8rem;
    }
    .actions button.copy-btn { background: #10b981; }
    .toast { 
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
        background: #1e293b; color: white; padding: 10px 20px; border-radius: 50px; 
        opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100;
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
    <h1>👑 مركز التحكم الآلي (Auto Hub)</h1>
    <p style="text-align:center; color:#64748b;">جاري جلب أحدث المشاريع من مستودع GitHub...</p>
    
    <div id="content" class="file-list">
        <div class="loading">⏳ جاري التحميل...</div>
    </div>
</div>

<div id="toast" class="toast">تم نسخ الرابط!</div>

<script>
const REPO_URL = 'https://api.github.com/repos/Ff1980ff/mamlaka/contents';
const BASE_GITHUB_PAGES = 'https://ff1980ff.github.io/mamlaka/';

async function loadFiles() {
    try {
        const response = await fetch(REPO_URL);
        if (!response.ok) throw new Error('Failed to fetch');
        
        const data = await response.json();
        const container = document.getElementById('content');
        container.innerHTML = ''; // Clear loading
        
        // Filter only HTML files and sort by name
        const htmlFiles = data.filter(item => item.name.endsWith('.html')).sort((a, b) => a.name.localeCompare(b.name));
        
        if (htmlFiles.length === 0) {
            container.innerHTML = '<p style="text-align:center;">لا توجد ملفات HTML.</p>';
            return;
        }

        htmlFiles.forEach(file => {
            const directLink = BASE_GITHUB_PAGES + file.name;
            
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <div class="info">
                    <h3>${file.name}</h3>
                </div>
                <div class="actions">
                    <button onclick="window.open('${directLink}', '_blank')">فتح 🚀</button>
                    <button class="copy-btn" onclick="copyLink('${directLink}')">نسخ 📋</button>
                </div>
            `;
            container.appendChild(div);
        });

    } catch (error) {
        document.getElementById('content').innerHTML = `<p style="color:red; text-align:center;">❌ خطأ في الاتصال: ${error.message}</p>`;
    }
}

function copyLink(url) {
    navigator.clipboard.writeText(url).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }).catch(err => alert("تعذر النسخ"));
}

// Run on load
loadFiles();
</script>

</body>
</html>
