<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المكتشف 🔭</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}
body{background:#0b1026;color:#f7ead9;padding-bottom:40px}
header{text-align:center;padding:14px 10px;font-weight:900;color:#f5a524;font-size:19px}
header small{display:block;color:#9aa3c0;font-weight:400;font-size:11px;margin-top:4px}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px;flex-wrap:wrap}
.tab{border:1px solid #2a3157;background:#141a33;color:#f7ead9;border-radius:99px;padding:10px 18px;font-weight:900;font-size:13px;cursor:pointer}
.tab.on{background:#f5a524;color:#241303}
section{max-width:560px;margin:auto;padding:0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0;justify-content:center}
input,select,button{border-radius:12px;border:1px solid #2a3157;background:#141a33;color:#f7ead9;padding:10px;font-size:14px;font-family:inherit}
button{cursor:pointer;font-weight:700}
.go{background:#f5a524;color:#241303;border:none;font-weight:900}
#msg{min-height:24px;text-align:center;color:#22d3ee;font-size:13px;margin:6px}
.card{background:#141a33;border:1px solid #2a3157;border-radius:14px;padding:14px;margin:8px 0;transition:.3s}
.card:hover{border-color:#f5a524;transform:translateY(-2px)}
.card b{color:#f5a524;font-size:15px;display:block;margin-bottom:4px}
.card small{color:#9aa3c0;font-size:12px;line-height:1.8}
.card a{color:#22d3ee;text-decoration:none;font-size:12px;display:inline-block;margin-top:6px}
.card a:hover{text-decoration:underline}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.trend{background:linear-gradient(135deg,#141a33,#1a2440);border:1px solid #a78bfa;border-radius:14px;padding:14px;text-align:center;font-weight:900;font-size:18px;color:#a78bfa;cursor:pointer;transition:.3s}
.trend:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(167,139,250,.3)}
.idea{background:linear-gradient(135deg,#1c0b04,#3a1608);border:1px solid #f5a524;border-radius:14px;padding:14px;margin:8px 0;font-size:14px;line-height:2;color:#f7ead9}
.stat{color:#9aa3c0;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<header>🔭 المكتشف
<small>عين المملكة اللي ما بتنام — تلتقط الترند قبل ما يلمع</small></header>

<div class="tabs">
 <button class="tab on" onclick="tab(0)">🔥 ترندات</button>
 <button class="tab" onclick="tab(1)">📰 أخبار</button>
 <button class="tab" onclick="tab(2)">💡 أفكار</button>
 <button class="tab" onclick="tab(3)">🔗 روابط</button>
</div>

<section id="p0">
 <div id="grid"></div>
 <div class="stat">كلمات ترند اليوم — دوس تشوف أمثلة</div>
</section>

<section id="p1" style="display:none">
 <div class="bar">
  <select id="cat">
   <option value="tech">💻 تقنية</option>
   <option value="edu">📚 تعليم</option>
   <option value="news">🌍 أخبار</option>
   <option value="fun">🎉 ترفيه</option>
  </select>
  <button class="go" onclick="loadNews()">🔭 اكتشف</button>
 </div>
 <div id="news"></div>
 <div class="stat">أخبار محاكاة — لما يرجع النت، منربط بـ RSS حقيقي</div>
</section>

<section id="p2" style="display:none">
 <div class="bar"><button class="go" onclick="newIdea()">💡 فكرة جديدة</button></div>
 <div id="idea"></div>
 <div class="stat">أفكار مشاريع وتطبيقات — دوس يطلعلك وحدة جديدة</div>
</section>

<section id="p3" style="display:none">
 <div class="bar"><input id="q" placeholder="ابحث..." style="flex:1;min-width:200px"></div>
 <div id="links"></div>
 <div class="stat">روابط سريعة — محرك بحث، ويكي، يوتيوب، وأكثر</div>
</section>

<div id="msg"></div>

<script>
const secs=['p0','p1','p2','p3'];
function tab(i){document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i===j));secs.forEach((s,j)=>document.getElementById(s).style.display=i===j?'block':'none')}
function msg(t){document.getElementById('msg').textContent=t}
const trends=['ذكاء اصطناعي','تعليم رقمي','أتمتة','برمجة ويب','تطبيقات موبايل','أمن سيبراني','بلوكتشين','إنترنت الأشياء','تعلم الآلة','تحليل بيانات'];
document.getElementById('grid').innerHTML=trends.map(t=>`<div class="trend" onclick="alert('مثال: ${t} — كلمة كتير بحثوها هالأسبوع 🔥')">${t}</div>`).join('');
const news={
 tech:[
  {t:'إطلاق نموذج ذكاء اصطناعي جديد',d:'شركة تقنية تعلن عن نموذج أسرع وأذكى من السابق.',l:'#'},
  {t:'تحديث كبير لنظام التشغيل',d:'مزايا جديدة للأمان والخصوصية والأداء.',l:'#'},
  {t:'هاتف ذكي بكاميرا خارقة',d:'دقة عالية وتصوير ليلي متطور.',l:'#'}
 ],
 edu:[
  {t:'منصة تعليمية مجانية جديدة',d:'آلاف الدروس بالعربية بكل التخصصات.',l:'#'},
  {t:'دراسة: التعلم النشط أفضل',d:'باحثون يؤكدون أن التفاعل يثبت المعلومة.',l:'#'},
  {t:'جامعة تفتح أبوابها أونلاين',d:'شهادات معتمدة بالكامل عن بعد.',l:'#'}
 ],
 news:[
  {t:'قمة عالمية للمناخ',d:'دول تتفق على أهداف جديدة للانبعاثات.',l:'#'},
  {t:'اكتشاف أثري جديد',d:'مدينة قديمة تظهر تحت الرمال.',l:'#'},
  {t:'تعاون علمي دولي',d:'باحثون من ٢٠ دولة يطلقون مشروع مشترك.',l:'#'}
 ],
 fun:[
  {t:'فيلم يحقق أرقام قياسية',d:'إيرادات عالمية بملايين الدولارات.',l:'#'},
  {t:'مهرجان موسيقي كبير',d:'عشرات الفرق من كل العالم.',l:'#'},
  {t:'لعبة جديدة تكتسح',d:'ملايين التحميلات بأسبوع واحد.',l:'#'}
 ]
};
function loadNews(){const c=document.getElementById('cat').value,n=document.getElementById('news');
 n.innerHTML=news[c].map(x=>`<div class="card"><b>${x.t}</b><small>${x.d}</small><br><a href="${x.l}" target="_blank">🔗 اقرأ المزيد</a></div>`).join('')}
loadNews();
const ideas=[
 'تطبيق يحوّل الوصفات الورقية لرقمية مع فيديو شرح',
 'منصة تعلم لغات بالحوار مع ذكاء اصطناعي',
 'لعبة تعليمية للأطفال عن البيئة وإعادة التدوير',
 'أداة تلوين صور قديمة بالذكاء الاصطناعي',
 'موقع يحسب بصمتك الكربونية ويعطيك نصائح',
 'تطبيق يربط الجيران لتبادل الأدوات والخبرات',
 'منصة كتابة قصص مشتركة بين عدة كتّاب',
 'أداة تحول الملاحظات الصوتية لخريطة ذهنية',
 'موقع يعرض تاريخ منطقتك بالصور القديمة',
 'تطبيق يعلّم الطبخ خطوة خطوة بالفيديو'
];
function newIdea(){const i=ideas[Math.floor(Math.random()*ideas.length)];
 document.getElementById('idea').innerHTML=`<div class="idea">💡 <b>${i}</b><br><small>فكرة مشروع — خذها طوّرها واعملها!</small></div>`}
newIdea();
const links=[
 {n:'Google',d:'محرك البحث الأول',l:'https://google.com',e:'🔍'},
 {n:'YouTube',d:'فيديوهات بكل المواضيع',l:'https://youtube.com',e:'📺'},
 {n:'Wikipedia',d:'الموسوعة الحرة',l:'https://ar.wikipedia.org',e:'📚'},
 {n:'GitHub',d:'مستودعات الكود',l:'https://github.com',e:'💻'},
 {n:'Stack Overflow',d:'إجابات البرمجة',l:'https://stackoverflow.com',e:'🧑‍💻'},
 {n:'MDN',d:'توثيق الويب',l:'https://developer.mozilla.org',e:'📖'},
 {n:'Canva',d:'تصميم سريع',l:'https://canva.com',e:'🎨'},
 {n:'DeepL',d:'ترجمة ذكية',l:'https://deepl.com',e:'🌐'}
];
document.getElementById('q').oninput=function(){const q=this.value.toLowerCase();
 document.getElementById('links').innerHTML=links.filter(x=>x.n.toLowerCase().includes(q)||x.d.toLowerCase().includes(q)).map(x=>`<div class="card"><b>${x.e} ${x.n}</b><small>${x.d}</small><br><a href="${x.l}" target="_blank">🔗 افتح</a></div>`).join('')}
document.getElementById('q').oninput();
</script>
</body>
</html>
