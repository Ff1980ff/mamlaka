<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ضيافة وترحيب 🛋️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}
body{background:#1a0f0a;color:#f7ead9;padding-bottom:40px}
header{text-align:center;padding:16px;font-weight:900;color:#f5a524;font-size:21px}
header small{display:block;color:#b39a8d;font-weight:400;font-size:13px;margin-top:4px}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px;flex-wrap:wrap}
.tab{border:1px solid #3a2a1a;background:#241a10;color:#f7ead9;border-radius:99px;padding:11px 15px;font-weight:900;font-size:14px;cursor:pointer}
.tab.on{background:#f5a524;color:#241303}
section{max-width:560px;margin:auto;padding:0 12px;display:none}
section.on{display:block}
.card{background:#241a10;border:1px solid #3a2a1a;border-radius:14px;padding:16px;margin:10px 0;line-height:2.1;font-size:18px}
.card h3{color:#f5a524;font-size:17px;margin-bottom:6px}
input{width:100%;padding:14px;border-radius:12px;border:2px solid #3a2a1a;background:#1a0f0a;color:#f7ead9;font-size:18px;font-family:inherit;margin:6px 0}
.go{width:100%;border-radius:12px;border:none;background:#f5a524;color:#241303;font-weight:900;font-size:17px;padding:14px;cursor:pointer;font-family:inherit;margin:6px 0}
.sec{width:100%;border-radius:12px;border:1px solid #3a2a1a;background:#1a0f0a;color:#f7ead9;font-weight:900;font-size:15px;padding:12px;cursor:pointer;font-family:inherit}
.note{text-align:center;color:#b39a8d;font-size:13px;margin:12px;line-height:1.9}
#out{font-size:21px;font-weight:900;color:#4ade80;text-align:center;line-height:2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g{background:#241a10;border:1px solid #3a2a1a;border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:.3s}
.g:hover{border-color:#f5a524}
.g .e{font-size:34px}
.g b{display:block;font-size:15px;margin-top:6px}
</style>
</head>
<body>
<header>🛋️ ضيافة وترحيب
<small>أهلًا وسهلًا — عبارات الضيف والمناسبات جاهزة للنسخ</small></header>

<div class="tabs">
 <button class="tab on" onclick="tab(0)">🛋️ رحّب</button>
 <button class="tab" onclick="tab(1)">🎉 مناسبات</button>
 <button class="tab" onclick="tab(2)">📜 أمثال</button>
</div>

<section id="p0" class="on">
 <div class="card">
  <h3>🛋️ مين الضيف؟</h3>
  <input id="gn" placeholder="اكتب اسم الضيف... (مثلاً: أبو خالد)">
  <button class="go" onclick="welc()">🛋️ ولّد ترحيب</button>
  <div id="out"></div>
  <button class="sec" id="cp" style="display:none" onclick="copyW()">📋 نسخ للواتساب</button>
 </div>
 <div class="note">كل كبسة = ترحيب جديد بنفس الاسم!</div>
</section>

<section id="p1">
 <div class="grid" id="occ"></div>
 <div class="card" id="occout" style="display:none"></div>
</section>

<section id="p2">
 <div id="amth"></div>
</section>

<script>
const secs=['p0','p1','p2'];
function tab(i){document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i===j));secs.forEach((s,j)=>document.getElementById(s).classList.toggle('on',i===j))}
const W=[
 n=>`أهلا وسهلا بـ${n}! البيت بيتك، والكرسي كرسيك، والمكان مكانك!`,
 n=>`يا هلا بـ${n}! نورت الدار، والله زادت البركة!`,
 n=>`مرحبا بـ${n}! قهوة وشاي وقعدة هنية — الضيف عندنا سلطان!`,
 n=>`هلا والله بـ${n}! وجهك خير، وطلتك بركة!`,
 n=>`ألف هلا بـ${n}! الدار دارك، والخيمة خيمتك!`,
 n=>`نورت يا ${n}! كنا عم نحسب الأيام عشان تشرفنا!`
];
let lastW='';
function welc(){
 const n=document.getElementById('gn').value.trim()||'الغالي';
 lastW=W[Math.floor(Math.random()*W.length)](n);
 document.getElementById('out').textContent=lastW;
 document.getElementById('cp').style.display='block';
}
function copyW(){
 navigator.clipboard.writeText(lastW).then(()=>{document.getElementById('cp').textContent='✅ اننسخت! الصقها وين ما بدك'});
}
const OCC=[
{e:'💍',n:'زواج',p:['ألف مبروك! الله يبارك ويجمعكم ع خير ويزيد فرحتكم!','مبروك العمر الجديد! الله يجعل أيامكم كلها أعراس.']},
{e:'🏠',n:'بيت جديد',p:['مبروك الدار! الله يجعلها دار سعادة وبركة وأمان!','الله يعمّرها بأهلها ويفرحكم فيها سنين طويلة!']},
{e:'✈️',n:'رجوع من سفر',p:['حمدلله ع السلامة! نورّت البلاد والعباد!','يا مرحب بالراجع! الغيبة طالت بس المحبة ما بتغيب!']},
{e:'👶',n:'مولود جديد',p:['مبروك المولود! الله يجعله من الصالحين ويقرّب عيونكم فيه!','ألف مبروك! الله ينبتو نبات حسن ويحفظو لأهله!']},
{e:'🤝',n:'شفاء',p:['حمدلله ع السلامة! الله يتمم شفاك وما يوريك مكروه!','قامت بالسلامة! الله يعطيك العافية ويزيدك قوة!']},
{e:'🎓',n:'نجاح',p:['ألف مبروك النجاح! تعبت واستاهلت — هاد حصادك!','مبروك التفوق! الله يوفقك لدرجات أعلى!']}
];
document.getElementById('occ').innerHTML=OCC.map((o,i)=>`<div class="g" onclick="occS(${i})"><div class="e">${o.e}</div><b>${o.n}</b></div>`).join('');
function occS(i){
 const o=OCC[i];
 document.getElementById('occout').style.display='block';
 document.getElementById('occout').innerHTML=`<h3>${o.e} ${o.n}</h3>${o.p.map(p=>`<div style="margin:8px 0;border-bottom:1px dashed #3a2a1a;padding-bottom:8px">${p}</div>`).join('')}<button class="sec" onclick="copyT('${o.p[0]}')">📋 نسخ الأولى</button>`;
}
function copyT(t){navigator.clipboard.writeText(t).then(()=>{event.target.textContent='✅ اننسخت!'})}
const AMTH=[
'الضيف بيجيب رزقو معو — افتح قلبك قبل بابك.',
'الجار قبل الدار، والطريق قبل البيت.',
'الكرم ما بينقص المال — بينمّي البركة.',
'أول الضيف نور، وتانيه سرور.',
'بيت الكريم بيجمع الناس، وبخيلها بيجمع الذباب.',
'الضيافة ثلاثة أيام، والمحبة عمر.',
'من دخل البيت صار من أهله.',
'القهوة أولها للضيف، وتانيها للمضيف، وتالتها للسيف.'
];
document.getElementById('amth').innerHTML=AMTH.map(a=>`<div class="card">📜 ${a}</div>`).join('');
</script>
</body>
</html>
