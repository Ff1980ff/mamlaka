*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#fef9c3 0%,#bbf7d0 50%,#bfdbfe 100%);min-height:100vh;color:#1e293b;padding-bottom:30px}
header{background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb);padding:16px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.15);position:sticky;top:0;z-index:50}
header h1{color:#fff;font-size:22px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
header p{color:#fff;font-size:12px;margin-top:4px;text-shadow:1px 1px 2px rgba(0,0,0,.3)}
.tabs{display:flex;justify-content:center;gap:10px;margin:15px 10px}
.tab{border:none;border-radius:99px;padding:12px 22px;font-size:15px;font-weight:bold;cursor:pointer;background:#fff;color:#475569;box-shadow:0 3px 8px rgba(0,0,0,.1);transition:.2s}
.tab.on{background:#8338ec;color:#fff;transform:scale(1.05)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:5px 12px;justify-content:flex-start}
.cat{border:none;border-radius:99px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer;background:#fff;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.cat.on{background:#06d6a0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;max-width:600px;margin:auto}
.card{background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);cursor:pointer;transition:.2s;text-align:center;position:relative}
.card:active{transform:scale(.95)}
.card svg{width:100%;height:auto}
.card .nm{font-size:12px;font-weight:bold;color:#334155;margin-top:4px}
.card .done{position:absolute;top:4px;left:4px;font-size:16px}
/* شاشة التلوين */
#paintScr{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#fef9c3,#bbf7d0);z-index:60;overflow-y:auto;padding-bottom:30px}
.topbar{display:flex;gap:8px;padding:10px;align-items:center;position:sticky;top:0;background:rgba(255,255,255,.9);z-index:5}
.topbar button{border:none;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:bold;cursor:pointer}
.backB{background:#e63946;color:#fff}
.toolB{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
#paintSvgWrap{background:#fff;border-radius:20px;margin:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px}
#paintSvgWrap svg{width:100%;height:auto;display:block}
#paintSvgWrap .tap{cursor:pointer}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px}
.pal{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;transition:.15s}
.pal.on{transform:scale(1.25);border-color:#1e293b}
/* السبورة */
.board{background:#14532d;border:6px solid #92400e;border-radius:16px;margin:10px 14px;padding:14px;box-shadow:inset 0 0 20px rgba(0,0,0,.4)}
.board h3{color:#fde047;text-align:center;font-size:14px;margin-bottom:10px}
.brow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px dashed rgba(255,255,255,.2)}
.brow:last-child{border:none}
.brow .fl{font-size:20px}
.brow .wd{flex:1;color:#fff;font-size:19px;font-weight:bold;text-align:left;direction:ltr;font-family:'Comic Sans MS',cursive}
.brow .sp{border:none;background:#fde047;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
/* الكراس التعليمي */
#quizScr{display:none;max-width:600px;margin:auto;padding:12px}
.qbox{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);text-align:center}
.qbox h2{font-size:18px;color:#8338ec;margin-bottom:6px}
.qbox .stars{font-size:22px;margin:6px 0}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.qopt{background:#f8fafc;border:3px solid #e2e8f0;border-radius:16px;padding:8px;cursor:pointer;transition:.15s}
.qopt:active{transform:scale(.95)}
.qopt.right{border-color:#2dc653;background:#d1fae5;animation:pop .4s}
.qopt.wrong{border-color:#e63946;background:#fee2e2;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.langPick{display:flex;justify-content:center;gap:8px;margin:10px 0}
.langPick button{border:none;border-radius:99px;padding:8px 14px;font-size:16px;cursor:pointer;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.langPick button.on{background:#3a86ff;color:#fff}
/* احتفال */
#celeb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center}
#celeb .box{background:#fff;border-radius:24px;padding:30px;text-align:center;animation:pop .5s;max-width:300px}
#celeb .big{font-size:60px}
#celeb h2{color:#8338ec;margin:10px 0}
#celeb button{border:none;border-radius:99px;padding:12px 30px;background:#2dc653;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:100;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>

const LANGS=[['🇸🇦','ar-SA'],['🇬🇧','en-US'],['🇫🇷','fr-FR'],['🇩🇪','de-DE']];
const COLORS=['#e63946','#f77f00','#ffd60a','#2dc653','#06d6a0','#118ab2','#3a86ff','#8338ec','#ff5da2','#8d5524','#f4a261','#333333'];

let curCat=-1,curImg=null,curFill=[],selColor=COLORS[0],quizLang=1,stars=+(localStorage.getItem('qStars')||0);
let fills=JSON.parse(localStorage.getItem('colorFills')||'{}');

// ===== النطق =====
function speak(txt,langIdx){
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(txt);
 u.lang=LANGS[langIdx][1];u.rate=0.75;u.pitch=1.15;
 const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith(LANGS[langIdx][1].slice(0,2)));
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}
speechSynthesis&&speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

// ===== رسم الأشكال =====
function shp(s,fill,i,tap){
 const f=fill||'#ffffff';
 const cm=`fill="${f}" stroke="#3a2b20" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"${tap?` data-i="${i}" class="tap"`:''}`;
 switch(s[0]){
  case 'c':return `<circle cx="${s[1]}" cy="${s[2]}" r="${s[3]}" ${cm}/>`;
  case 'e':return `<ellipse cx="${s[1]}" cy="${s[2]}" rx="${s[3]}" ry="${s[4]}"${s[5]?` transform="rotate(${s[5]} ${s[1]} ${s[2]})"`:''} ${cm}/>`;
  case 'r':return `<rect x="${s[1]}" y="${s[2]}" width="${s[3]}" height="${s[4]}" rx="${s[5]||0}" ${cm}/>`;
  case 'g':return `<polygon points="${s[1]}" ${cm}/>`;
  case 'p':return `<path d="${s[1]}" ${cm}/>`;
  case 'l':return `<path d="${s[1]}" fill="none" stroke="#3a2b20" stroke-width="4" stroke-linecap="round"/>`;
 }
}
function svgOf(img,arr,tap){
 return `<svg viewBox="0 0 200 200">${img.s.map((s,i)=>shp(s,arr?arr[i]:null,i,tap)).join('')}</svg>`;
}

// ===== الرئيسية =====
function renderCats(){
 document.getElementById('cats').innerHTML=`<button class="cat${curCat==-1?' on':''}" onclick="setCat(-1)">✨ الكل</button>`+CATS.map((c,i)=>`<button class="cat${curCat==i?' on':''}" onclick="setCat(${i})">${c}</button>`).join('');
}
function setCat(i){curCat=i;renderCats();renderGrid()}
function renderGrid(){
 const list=IMGS.map((im,i)=>({im,i})).filter(x=>curCat==-1||x.im.c==curCat);
 document.getElementById('grid').innerHTML=list.map(x=>{
  const done=fills[x.i]&&fills[x.i].some(f=>f&&f!='#ffffff');
  return `<div class="card" onclick="openPaint(${x.i})">${done?'<span class="done">✅</span>':''}${svgOf(x.im,null,false)}<div class="nm">${x.im.n[0]}</div></div>`;
 }).join('');
}
function goHome(){
 document.getElementById('paintScr').style.display='none';
 document.getElementById('quizScr').style.display='none';
 document.getElementById('homeScr').style.display='block';
 document.querySelectorAll('.tab')[0].classList.add('on');
 document.querySelectorAll('.tab')[1].classList.remove('on');
 renderGrid();
}

// ===== التلوين =====
function openPaint(i){
 curImg=i;curFill=fills[i]||IMGS[i].s.map(()=>null);
 document.getElementById('homeScr').style.display='none';
 document.getElementById('quizScr').style.display='none';
 document.getElementById('paintScr').style.display='block';
 renderPaint();renderBoard();renderPalette();
 speak(IMGS[i].n[0],0);
}
function renderPaint(){
 document.getElementById('paintSvgWrap').innerHTML=svgOf(IMGS[curImg],curFill,true);
 document.getElementById('paintSvgWrap').onclick=e=>{
  const t=e.target.closest('[data-i]');if(!t)return;
  const idx=+t.getAttribute('data-i');
  curFill[idx]=(selColor=='ERASE')?null:selColor;
  fills[curImg]=curFill;localStorage.setItem('colorFills',JSON.stringify(fills));
  renderPaint();checkDone();
 };
}
function renderPalette(){
 document.getElementById('palette').innerHTML=COLORS.map(c=>`<div class="pal${selColor==c?' on':''}" style="background:${c}" onclick="pick('${c}')"></div>`).join('')+`<div class="pal${selColor=='ERASE'?' on':''}" style="background:#fff;border:3px dashed #94a3b8" onclick="pick('ERASE')">🧽</div>`;
}
function pick(c){selColor=c;renderPalette()}
function resetPaint(){curFill=IMGS[curImg].s.map(()=>null);fills[curImg]=curFill;localStorage.setItem('colorFills',JSON.stringify(fills));renderPaint()}
function autoFill(){curFill=IMGS[curImg].s.map(s=>s[0]=='l'?null:COLORS[Math.floor(Math.random()*10)]);fills[curImg]=curFill;localStorage.setItem('colorFills',JSON.stringify(fills));renderPaint();checkDone()}
function renderBoard(){
 document.getElementById('board').innerHTML=`<h3>📖 سبورة اللغات الأربع</h3>`+IMGS[curImg].n.map((w,i)=>`<div class="brow"><span class="fl">${LANGS[i][0]}</span><span class="wd">${w}</span><button class="sp" onclick="speak('${w.replace(/'/g,"\\'")}',${i})">🔊</button></div>`).join('');
}
function speakCur(){speak(IMGS[curImg].n[0],0)}
function checkDone(){
 const colorable=curFill.filter((f,i)=>IMGS[curImg].s[i][0]!='l');
 if(colorable.length&&colorable.every(f=>f&&f!='#ffffff')){
  document.getElementById('celeb').style.display='flex';
  document.getElementById('celebWord').textContent=IMGS[curImg].n.join(' • ');
  confetti();speak('أحسنت! عمل رائع!',0);
  setTimeout(()=>IMGS[curImg].n.forEach((w,i)=>setTimeout(()=>speak(w,i),1200*(i+1))),500);
 }
}
function closeCeleb(){document.getElementById('celeb').style.display='none';closePaint()}
function closePaint(){document.getElementById('paintScr').style.display='none';goHome()}
function confetti(){
 const em=['🎉','⭐','🎈','💛','💚','','❤️'];
 for(let i=0;i<25;i++){
  const d=document.createElement('div');d.className='confetti';
  d.textContent=em[i%em.length];d.style.left=Math.random()*100+'vw';
  d.style.animationDuration=(2+Math.random()*2)+'s';
  document.body.appendChild(d);setTimeout(()=>d.remove(),4500);
 }
}

// ===== الكراس التعليمي =====
let quizAns=null;
function goQuiz(){
 document.getElementById('homeScr').style.display='none';
 document.getElementById('paintScr').style.display='none';
 document.getElementById('quizScr').style.display='block';
 document.querySelectorAll('.tab')[1].classList.add('on');
 document.querySelectorAll('.tab')[0].classList.remove('on');
 renderLangPick();newQuiz();
}
function renderLangPick(){
 document.getElementById('langPick').innerHTML=LANGS.map((l,i)=>`<button class="${quizLang==i?'on':''}" onclick="quizLang=${i};renderLangPick();playQuizWord()">${l[0]}</button>`).join('');
}
function newQuiz(){
 quizAns=Math.floor(Math.random()*IMGS.length);
 const opts=[quizAns];
 while(opts.length<4){const r=Math.floor(Math.random()*IMGS.length);if(!opts.includes(r))opts.push(r)}
 opts.sort(()=>Math.random()-.5);
 document.getElementById('qOpts').innerHTML=opts.map(i=>`<div class="qopt" onclick="answer(${i},this)">${svgOf(IMGS[i],null,false)}</div>`).join('');
 setTimeout(playQuizWord,400);
}
function playQuizWord(){if(quizAns!=null)speak(IMGS[quizAns].n[quizLang],quizLang)}
function answer(i,el){
 if(i==quizAns){
  el.classList.add('right');stars++;localStorage.setItem('qStars',stars);
  document.getElementById('qStars').textContent='⭐ '+stars;
  speak('ممتاز!',quizLang);
  setTimeout(newQuiz,1200);
 }else{
  el.classList.add('wrong');speak('حاول مرة أخرى',0);
  setTimeout(()=>el.classList.remove('wrong'),600);
 }
}
document.getElementById('qStars').textContent='⭐ '+stars;
renderCats();renderGrid();
</script>
</body>
</html>
