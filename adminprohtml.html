<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 لوحة تحكم المملكة | Kingdom Admin Pro</title>
<style>
    :root { --primary: #0f172a; --accent: #d97706; --bg: #f8fafc; --card: #ffffff; --text: #334155; --success: #10b981; --danger: #ef4444; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    
    .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 15px; }
    .header h1 { color: var(--primary); margin: 0; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .security-warning { background: #fef2f2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; border: 1px solid #fecaca; }

    /* Login Screen */
    #loginScreen { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
    .token-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; margin: 15px 0; font-family: monospace; text-align: left; direction: ltr; }
    .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
    .btn-login:hover { background: #1e293b; }

    /* Dashboard */
    #dashboard { display: none; }
    .controls { max-width: 900px; margin: 0 auto 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center;}
    .search-box { flex: 1; min-width: 200px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    .action-btns { display: flex; gap: 10px; }
    .btn-refresh { padding: 10px 15px; background: #e2e8f0; color: var(--primary); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-add-new { padding: 10px 15px; background: var(--success); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    
    .file-card { 
        background: var(--card); border-radius: 12px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        transition: transform 0.2s; position: relative; overflow: hidden;
        display: flex; flex-direction: column; height: 100%;
    }
    .file-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    
    .category-tag { 
        position: absolute; top: 10px; left: 10px; font-size: 0.7rem; padding: 2px 8px; 
        border-radius: 4px; font-weight: bold; z-index: 2;
    }
    .tag-edu { background: #dbeafe; color: #1e40af; } 
    .tag-tool { background: #dcfce7; color: #166534; } 
    .tag-biz { background: #fef3c7; color: #92400e; } 
    .tag-game { background: #fee2e2; color: #991b1b; } 
    .tag-other { background: #f1f5f9; color: #475569; }

    .file-name { font-weight: bold; font-size: 1rem; color: var(--primary); margin-bottom: 5px; word-break: break-all; line-height: 1.3; flex-grow: 1; }
    .file-meta { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
    
    .actions-row { display: flex; gap: 5px; margin-top: auto; }
    .btn-action { 
        flex: 1; padding: 8px 5px; border: none; border-radius: 6px; cursor: pointer; 
        font-weight: bold; font-size: 0.8rem; text-decoration: none; text-align: center; transition: 0.2s;
        display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn-open { background: var(--accent); color: white; }
    .btn-delete { background: var(--danger); color: white; }
    .btn-copy { background: #e2e8f0; color: var(--primary); width: 40px; }

    /* Add File Modal */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
        display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
    }
    .modal-content {
        background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 600px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary); }
    .form-input, .form-textarea {
        width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;
    }
    .form-textarea { height: 200px; font-family: monospace; resize: vertical; }
    .close-modal { float: left; cursor: pointer; font-size: 1.5rem; color: #aaa; }
    .btn-submit { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .toast { 
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
        background: var(--primary); color: white; padding: 10px 20px; border-radius: 50px; 
        opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="header">
    <h1>👑 لوحة تحكم المملكة</h1>
    <div class="security-warning">⚠️ تحذير: هذه اللوحة تمنحك صلاحيات كاملة للحذف والإضافة. لا تشارك الرابط مع أحد.</div>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <h2>🔒 تسجيل الدخول</h2>
    <p style="color:#64748b; font-size:0.9rem;">أدخل مفتاح GitHub الخاص بك للوصول للمستودع.</p>
    <input type="password" id="tokenInput" class="token-input" placeholder="ghp_xxxxxxxxxxxxxxxx">
    <button class="btn-login" onclick="checkToken()">دخول للنظام ▶️</button>
    <p style="margin-top:15px; font-size:0.8rem; color:#94a3b8;">يتم حفظ المفتاح في متصفحك فقط لهذا الجهاز.</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن تطبيق...">
        <div class="action-btns">
            <button class="btn-refresh" onclick="fetchFiles()">🔄 تحديث</button>
            <button class="btn-add-new" onclick="openAddModal()">➕ إضافة ملف جديد</button>
        </div>
    </div>

    <div id="gridContainer" class="grid-container"></div>
</div>

<!-- ADD FILE MODAL -->
<div id="addModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-modal" onclick="closeAddModal()">&times;</span>
        <h3 style="color:var(--primary); margin-bottom:20px;">➕ إنشاء ملف HTML جديد</h3>
        
        <div class="form-group">
            <label class="form-label">اسم الملف (مثلاَ: my-app.html)</label>
            <input type="text" id="newFileName" class="form-input" placeholder="my-new-project.html" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">رسالة الالتزام (Commit Message)</label>
            <input type="text" id="commitMsg" class="form-input" value="Initial commit for new app">
        </div>

        <div class="form-group">
            <label class="form-label">كود HTML</label>
            <textarea id="newFileContent" class="form-textarea" placeholder="<html>...</html>"></textarea>
        </div>

        <button class="btn-submit" onclick="createNewFile()">رفع الملف للمستودع ☁️</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const REPO_OWNER = 'Ff1980ff';
const REPO_NAME = 'mamlaka';
let authToken = '';

// Check Saved Token on Load
window.onload = () => {
    const saved = localStorage.getItem('github_token_mamlaka');
    if(saved) {
        authToken = saved;
        showDashboard();
    }
};

function checkToken() {
    const input = document.getElementById('tokenInput').value.trim();
    if(!input) return alert("أدخل المفتاح أولاً");
    
    // Simple validation format check (starts with ghp_)
    if(!input.startsWith('ghp_')) {
        alert("صيغة المفتاح غير صحيحة. يجب أن يبدأ بـ ghp_");
        return;
    }

    authToken = input;
    localStorage.setItem('github_token_mamlaka', authToken);
    showDashboard();
}

function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    fetchFiles();
}

async function fetchFiles() {
    const container = document.getElementById('gridContainer');
    container.innerHTML = '<div style="text-align:center; padding:20px;">⏳ جاري التحميل...</div>';

    try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        
        if (!response.ok) throw new Error(response.status === 401 ? "مفتاح خاطئ" : "خطأ اتصال");
        
        const data = await response.json();
        const htmlFiles = data.filter(item => item.type === 'file' && item.name.endsWith('.html'));
        
        renderGrid(htmlFiles);
    } catch (error) {
        console.error(error);
        showToast(error.message, true);
        container.innerHTML = `<div style="text-align:center; padding:20px; color:red;">❌ ${error.message}</div>`;
    }
}

function getCategory(name) {
    const lower = name.toLowerCase();
    if (lower.includes('pen') || lower.includes('flash') || lower.includes('math') || lower.includes('swedish') || lower.includes('huruf') || lower.includes('kids') || lower.includes('learn') || lower.includes('muallim') || lower.includes('qari')) return 'edu';
    if (lower.includes('calc') || lower.includes('convert') || lower.includes('crop') || lower.includes('sorter') || lower.includes('maker') || lower.includes('studio') || lower.includes('extractor') || lower.includes('tracker') || lower.includes('shrink') || lower.includes('format')) return 'tool';
    if (lower.includes('market') || lower.includes('sale') || lower.includes('contract') || lower.includes('business') || lower.includes('ouda') || lower.includes('estate') || lower.includes('rental') || lower.includes('admin') || lower.includes('dashboard')) return 'biz';
    if (lower.includes('game') || lower.includes('football') || lower.includes('brain') || lower.includes('story') || lower.includes('tale') || lower.includes('saboura') || lower.includes('sakhra')) return 'game';
    return 'other';
}

function renderGrid(files) {
    const container = document.getElementById('gridContainer');
    container.innerHTML = '';
    
    files.forEach(file => {
        const cat = getCategory(file.name);
        const publicLink = `https://${REPO_OWNER}.github.io/${REPO_NAME}/${encodeURIComponent(file.name)}`;
        
        let tagClass = 'tag-other';
        let tagName = 'أخرى';
        if(cat === 'edu') { tagClass = 'tag-edu'; tagName = 'تعليمي'; }
        if(cat === 'tool') { tagClass = 'tag-tool'; tagName = 'أداة'; }
        if(cat === 'biz') { tagClass = 'tag-biz'; tagName = 'أعمال'; }
        if(cat === 'game') { tagClass = 'tag-game'; tagName = 'ترفيه'; }

        const sizeKB = Math.round(file.size / 1024);

        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
            <span class="category-tag ${tagClass}">${tagName}</span>
            <div class="file-name">${file.name}</div>
            <div class="file-meta">الحجم: ${sizeKB} KB</div>
            <div class="actions-row">
                <a href="${publicLink}" target="_blank" class="btn-action btn-open">فتح 🚀</a>
                <button onclick="deleteFile('${file.path}', '${file.sha}', '${file.name}')" class="btn-action btn-delete">حذف 🗑️</button>
                <button onclick="navigator.clipboard.writeText('${publicLink}'); showToast('تم نسخ الرابط!')" class="btn-action btn-copy">📋</button>
            </div>
        `;
        container.appendChild(card);
    });
}

// DELETE FUNCTIONALITY
async function deleteFile(path, sha, name) {
    if(!confirm(`هل أنت متأكد من حذف "${name}"؟\nلا يمكن التراجع عن هذا الإجراء بسهولة.`)) return;

    try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({
                message: `Delete ${name} via Admin Panel`,
                sha: sha
            })
        });

        if (response.ok) {
            showToast(`✅ تم حذف ${name} بنجاح!`);
            setTimeout(fetchFiles, 1000); // Refresh list after delay
        } else {
            const err = await response.json();
            throw new Error(err.message || "فشل الحذف");
        }
    } catch (error) {
        showToast(`❌ خطأ: ${error.message}`, true);
    }
}

// ADD FILE FUNCTIONALITY
function openAddModal() {
    document.getElementById('addModal').style.display = 'flex';
}

function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
}

async function createNewFile() {
    const fileName = document.getElementById('newFileName').value.trim();
    const content = document.getElementById('newFileContent').value;
    const msg = document.getElementById('commitMsg').value;

    if(!fileName || !content) {
        alert("يرجى إدخال اسم الملف والمحتوى");
        return;
    }

    if(!fileName.endsWith('.html')) {
        alert("يجب أن ينتهي اسم الملف بـ .html");
        return;
    }

    try {
        // Encode content to Base64 as required by GitHub API
        const base64Content = btoa(unescape(encodeURIComponent(content)));

        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${authToken}`,
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({
                message: msg || `Create ${fileName}`,
                content: base64Content
            })
        });

        if (response.ok) {
            showToast(`✅ تم إنشاء ${fileName} ونشره!`);
            closeAddModal();
            document.getElementById('newFileName').value = '';
            document.getElementById('newFileContent').value = '';
            setTimeout(fetchFiles, 1000);
        } else {
            const err = await response.json();
            throw new Error(err.message || "فشل الإنشاء");
        }
    } catch (error) {
        showToast(`❌ خطأ: ${error.message}`, true);
    }
}

// SEARCH LOGIC
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.file-card');
    cards.forEach(card => {
        const name = card.querySelector('.file-name').innerText.toLowerCase();
        card.style.display = name.includes(term) ? 'flex' : 'none';
    });
});

function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.className = isError ? 'toast error show' : 'toast show';
    setTimeout(() => toast.classList.remove('show'), 3000);
}

</script>
</body>
</html>
