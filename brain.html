<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العقل الملكي 🧠</title>
<style>
body{background:#0d0b1a;color:#eee;font-family:Tahoma,sans-serif;margin:0;padding:16px;text-align:center}
h1{color:#f5c542}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tabs button{background:#1a1730;border:1px solid #2c2850;color:#eee;border-radius:99px;padding:10px 16px;font-weight:bold;cursor:pointer}
.tabs button.on{background:#f5c542;color:#221}
.panel{display:none;max-width:480px;margin:auto}
.panel.on{display:block}
.box{background:#1a1730;border:1px solid #2c2850;border-radius:14px;padding:14px;margin:10px 0;text-align:right}
input,textarea,select{width:100%;box-sizing:border-box;background:#12102a;border:1px solid #2c2850;color:#eee;border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
button.act{background:#f5c542;color:#221;border:none;border-radius:10px;padding:10px 16px;font-weight:bold;margin:4px;cursor:pointer}
.out{font-size:22px;color:#f5c542;min-height:30px;margin:8px 0;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.keys button{background:#12102a;border:1px solid #2c2850;color:#eee;border-radius:10px;padding:12px 0;font-size:16px;cursor:pointer}
small{color:#888}
</style>
</head>
<body>
<h1>🧠 العقل الملكي</h1>
<small>4 عقول بواحد: حاسبة + معجم + مترجم + ذاكرة</small>
<div class="tabs">
<button class="on" onclick="tab(0,this)">🔢 حاسبة</button>
<button onclick="tab(1,this)">📖 معجم</button>
<button onclick="tab(2,this)">🌍 مترجم</button>
<button onclick="tab(3,this)">🗒️ ذاكرة</button>
</div>

<div class="panel on" id="p0">
<div class="box">
<input id="exp" placeholder="اكتب عملية أو استخدم الأزرار..." inputmode="decimal">
<div class="out" id="res">0</div>
<div class="keys">
<button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button><button onclick="k('/')">÷</button><button onclick="k('sqrt(')">√</button>
<button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button><button onclick="k('*')">×</button><button onclick="k('^')">^</button>
<button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button><button onclick="k('-')">-</button><button onclick="k('sin(')">sin</button>
<button onclick="k('0')">0</button><button onclick="k('.')">.</button><button onclick="k('(')">(</button><button onclick="k(')')">)</button><button onclick="k('+')">+</button>
<button onclick="k('3.14159')">π</button><button onclick="k('cos(')">cos</button><button onclick="clr()">C</button><button onclick="del()">⌫</button><button style="background:#f5c542;color:#221" onclick="calc()">=</button>
</div>
</div>
</div>

<div class="panel" id="p1">
<div class="box">
<input id="term" placeholder="اكتب مصطلح علمي... مثال: طاقة">
<button class="act" onclick="look()">🔍 ابحث وانطق</button>
<div class="out" id="tOut" style="font-size:16px"></div>
</div>
</div>

<div class="panel" id="p2">
<div class="box">
<textarea id="txt" placeholder="اكتب النص للترجمة..."></textarea>
<select id="dir"><option value="ar|en">عربي ← إنكليزي</option><option value="en|ar">إنكليزي ← عربي</option></select>
<button class="act" onclick="tr()">🌍 ترجم</button>
<div class="out" id="trOut" style="font-size:16px"></div>
</div>
</div>

<div class="panel" id="p3">
<div class="box">
<textarea id="note" placeholder="اكتب تذكرتك..."></textarea>
<button class="act" onclick="saveN()">💾 احفظ</button>
<div id="notes"></div>
</div>
</div>

<script>
function tab(i,b){document.querySelectorAll('.panel').forEach((p,x)=>p.classList.toggle('on',x===i));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function k(v){document.getElementById('exp').value+=v}
function clr(){document.getElementById('exp').value='';document.getElementById('res').textContent='0'}
function del(){const e=document.getElementById('exp');e.value=e.value.slice(0,-1)}
function calc(){
 let s=document.getElementById('exp').value.replace(/π/g,'(3.141592653589793)').replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/sqrt\(/g,'Math.sqrt(');
 let t=s.replace(/Math\.sin\(|Math\.cos\(|Math\.sqrt\(/g,'');
 if(!/^[0-9+\-*/().\s]*$/.test(t)){document.getElementById('res').textContent='رمز غير مسموح';return}
 try{const r=Function('"use strict";return('+s+')')();document.getElementById('res').textContent=isFinite(r)?+r.toFixed(6):'؟'}catch(e){document.getElementById('res').textContent='خطأ بالصياغة'}
}
const SCI={"طاقة":"القدرة على إنجاز شغل — Energy","ذرة":"أصغر وحدة بناء للمادة — Atom","جاذبية":"قوة الجذب بين الكتل — Gravity","ضوء":"إشعاع تراه العين — Light","خلية":"الوحدة الأساسية للحياة — Cell","أكسجين":"غاز التنفس — Oxygen","سرعة":"المسافة المقطوعة بالزمن — Speed","كتلة":"كمية المادة بالجسم — Mass"};
function look(){
 const q=document.getElementById('term').value.trim();
 const f=SCI[q]||SCI[Object.keys(SCI).find(x=>q.includes(x))];
 document.getElementById('tOut').textContent=f||'ما لقيتو — جرّب: طاقة، ذرة، جاذبية، خلية...';
 try{const u=new SpeechSynthesisUtterance(f||q);u.lang='ar-SA';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function tr(){
 const q=document.getElementById('txt').value.trim(),d=document.getElementById('dir').value;
 if(!q)return;
 fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+d)
 .then(r=>r.json()).then(j=>{document.getElementById('trOut').textContent=j.responseData?j.responseData.translatedText:'تعذرت الترجمة'})
 .catch(()=>{document.getElementById('trOut').textContent='النت ضعيف — جرّب لاحقًا'});
}
let N=JSON.parse(localStorage.getItem('brainNotes')||'[]');
function renderN(){document.getElementById('notes').innerHTML=N.map((n,i)=>'<div class="box" style="display:flex;justify-content:space-between;align-items:center"><span>'+n+'</span><button onclick="delN('+i+')" style="background:none;border:none;color:#f66;font-size:18px">🗑</button></div>').join('')||'<small>لا تذكرات بعد</small>'}
function saveN(){const v=document.getElementById('note').value.trim();if(!v)return;N.unshift(v);localStorage.setItem('brainNotes',JSON.stringify(N));document.getElementById('note').value='';renderN()}
function delN(i){N.splice(i,1);localStorage.setItem('brainNotes',JSON.stringify(N));renderN()}
renderN();
</script>
</body>
</html>
