<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مملكة التطبيقات 🏰</title>
<style>
body{background:#fdf6ec;color:#2a3d1a;font-family:Tahoma,sans-serif;margin:0;padding:14px;text-align:center}
h1{color:#e67e22;margin:6px 0}
.sub{color:#7a6a55;font-size:13px}
#q{width:100%;max-width:520px;padding:12px;border-radius:99px;border:2px solid #ffd75e;font-size:16px;box-sizing:border-box;background:#fff}
h2{color:#e67e22;font-size:17px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:auto}
.card{background:#fff;border:2px solid #f0e2c8;border-radius:14px;padding:12px 6px;position:relative}
.card a{text-decoration:none;color:#2a3d1a;font-weight:bold;font-size:14px;display:block}
.card .e{font-size:30px;display:block;margin-bottom:4px}
.del{position:absolute;top:4px;left:4px;background:#ffe3e0;border:none;border-radius:8px;padding:2px 6px;cursor:pointer;font-size:12px}
.panel{background:#fff;border:2px solid #ffd75e;border-radius:16px;padding:12px;max-width:520px;margin:14px auto;display:none}
.panel input,.panel select{width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:10px;border:1px solid #ddd;font-family:inherit}
button.gold{background:#ffd75e;border:none;border-radius:12px;padding:12px 18px;font-weight:bold;font-size:15px;cursor:pointer;margin:4px}
button.ghost{background:#fff;border:2px solid #e67e22;color:#e67e22;border-radius:12px;padding:10px 16px;font-weight:bold;cursor:pointer;margin:4px}
</style>
</head>
<body>
<h1>🏰 مملكة التطبيقات</h1>
<p class="sub">بناها معلم سوري من جوال واحد — أضف، احذف، وعدّل بحرية</p>
<input id="q" placeholder="🔍 ابحث عن أي تطبيق…" oninput="render()">
<div>
<button class="gold" onclick="togglePanel()">➕ إضافة تطبيق</button>
<button class="ghost" onclick="resetAll()">♻️ استرجاع الافتراضي</button>
</div>
<div class="panel" id="panel">
<input id="nN" placeholder="اسم التطبيق">
<input id="nE" placeholder="الإيموجي (مثال: 🎮)">
<input id="nL" placeholder="الرابط (مثال: games.html)">
<select id="nC"></select>
<button class="gold" onclick="addApp()">حفظ</button>
</div>
<div id="wrap"></div>
<script>
const CATS=['🎓 التعلم','🌍 الحياة','🎨 الإبداع','🛠️ الأدوات','🌐 العالم','👑 النظام'];
const DEF=[
{n:'الحروف',e:'🔤',l:'huruf.html',c:0},
{n:'الرياضيات',e:'📐',l:'math.html',c:0},
{n:'بحر العلم',e:'🌊',l:'bahr.html',c:0},
{n:'روضة الجيب',e:'🧒',l:'rawda.html',c:0},
{n:'جسمي',e:'🫀',l:'jismi.html',c:1},
{n:'الصراف',e:'💱',l:'sarraf.html',c:1},
{n:'الزراعة',e:'🌾',l:'zeraa.html',c:1},
{n:'استوديو التصميم',e:'🎨',l:'design.html',c:2},
{n:'استوديو الصور',e:'🖼️',l:'gen.html',c:2},
{n:'البرومبتات',e:'🧠',l:'prompts.html',c:2},
{n:'القصص',e:'📚',l:'stories.html',c:2},
{n:'مترجمي',e:'🗣️',l:'mutarjim.html',c:3},
{n:'الأصوات',e:'🎙️',l:'voice.html',c:3},
{n:'الفيديو',e:'🎬',l:'video.html',c:3},
{n:'فلاشاتي',e:'🃏',l:'flash.html',c:3},
{n:'السفارة',e:'📎',l:'safara.html',c:4},
{n:'المرسال',e:'🕊️',l:'mirsal.html',c:4},
{n:'عيادة الوعي',e:'🛡️',l:'wa3i.html',c:4},
{n:'الخريطة',e:'🗺️',l:'kharita.html',c:4},
{n:'نظام المملكة',e:'👑',l:'kos.html',c:5},
{n:'عن المملكة',e:'📜',l:'about.html',c:5}
];
let APPS=JSON.parse(localStorage.getItem('portalApps')||'null')||DEF.map(x=>({...x}));
document.getElementById('nC').innerHTML=CATS.map((c,i)=>'<option value="'+i+'">'+c+'</option>').join('');
function save(){localStorage.setItem('portalApps',JSON.stringify(APPS))}
function togglePanel(){const p=document.getElementById('panel');p.style.display=p.style.display==='block'?'none':'block'}
function addApp(){
 const n=document.getElementById('nN').value.trim(),e=document.getElementById('nE').value.trim()||'🆕',l=document.getElementById('nL').value.trim(),c=+document.getElementById('nC').value;
 if(!n||!l)return alert('اكتب الاسم والرابط');
 APPS.push({n:n,e:e,l:l,c:c});save();render();togglePanel();
 document.getElementById('nN').value='';document.getElementById('nE').value='';document.getElementById('nL').value='';
}
function delApp(i){if(confirm('حذف "'+APPS[i].n+'"؟')){APPS.splice(i,1);save();render()}}
function resetAll(){if(confirm('استرجاع القائمة الافتراضية؟')){APPS=DEF.map(x=>({...x}));save();render()}}
function render(){
 const q=document.getElementById('q').value.trim();
 let html='';
 CATS.forEach((cat,ci)=>{
  const items=APPS.map((a,i)=>({a:a,i:i})).filter(x=>x.a.c===ci&&(!q||x.a.n.includes(q)));
  if(!items.length)return;
  html+='<h2>'+cat+'</h2><div class="grid">'+items.map(x=>'<div class="card"><button class="del" onclick="delApp('+x.i+')">🗑</button><span class="e">'+x.a.e+'</span><a href="'+x.a.l+'" target="_blank">'+x.a.n+'</a></div>').join('')+'</div>';
 });
 document.getElementById('wrap').innerHTML=html||'<p class="sub">ما في نتائج لهالبحث</p>';
}
render();
</script>
</body>
</html>
