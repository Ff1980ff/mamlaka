<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سفارة الروابط 📎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma}
body{background:#0b1026;color:#f7ead9;padding-bottom:40px}
header{text-align:center;padding:16px;font-weight:900;color:#f5a524;font-size:21px}
header small{display:block;color:#9aa3c0;font-weight:400;font-size:13px;margin-top:4px}
.tabs{display:flex;gap:6px;justify-content:center;margin:8px}
.tab{border:1px solid #2a3157;background:#141a33;color:#f7ead9;border-radius:99px;padding:11px 16px;font-weight:900;font-size:14px;cursor:pointer}
.tab.on{background:#f5a524;color:#241303}
section{max-width:560px;margin:auto;padding:0 12px;display:none}
section.on{display:block}
.item{background:#141a33;border:1px solid #2a3157;border-radius:14px;padding:14px;margin:8px 0}
.item b{color:#f5a524;font-size:16px;display:block}
.item small{color:#9aa3c0;display:block;font-size:12px;margin:4px 0 8px}
.item-btns{display:flex;gap:6px}
.item-btns button{flex:1;border-radius:10px;border:1px solid #2a3157;background:#1a2440;color:#f7ead9;padding:9px;font-weight:900;cursor:pointer;font-family:inherit;font-size:13px}
input{width:100%;padding:13px;border-radius:12px;border:2px solid #2a3157;background:#141a33;color:#f7ead9;font-size:16px;font-family:inherit;margin:6px 0}
.go{width:100%;border-radius:12px;border:none;background:#f5a524;color:#241303;font-weight:900;font-size:16px;padding:14px;cursor:pointer;font-family:inherit}
.note{text-align:center;color:#9aa3c0;font-size:13px;margin:12px;line-height:1.9}
</style>
</head>
<body>
<header>📎 سفارة الروابط
<small>سفير المملكة للعالم — روابط مفيدة + روابطك الخاصة</small></header>

<div class="tabs">
 <button class="tab on" onclick="tab(0)">🌍 السفارات</button>
 <button class="tab" onclick="tab(1)">📎 روابطك</button>
</div>

<section id="p0" class="on"><div id="ready"></div></section>

<section id="p1">
 <input id="ln" placeholder="اسم الرابط (مثلاً: موقع الشغل)">
 <input id="lu" placeholder="الرابط (https://...)">
 <button class="go" onclick="addL()">➕ ضيف رابطك</button>
 <div id="mine"></div>
 <div class="note">روابطك بتنحفظ ع جوالك — حتى بلا نت.</div>
</section>

<script>
const secs=['p0','p1'];
function tab(i){document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',i===j));secs.forEach((s,j)=>document.getElementById(s).classList.toggle('on',i===j));if(i===1)renderMine()}
const R=[
{n:'📚 ويكيبيديا العربية',d:'الموسوعة الحرة — اسأل عن أي شي',u:'https://ar.wikipedia.org'},
{n:'🎓 خان أكاديمي عربي',d:'دروس رياضيات وعلوم مجانية',u:'https://ar.khanacademy.org'},
{n:'🌐 جوجل ترجمة',d:'ترجم أي نص فورًا',u:'https://translate.google.com'},
{n:'🗺️ خرائط جوجل',d:'دليلك لكل الدروب',u:'https://maps.google.com'},
{n:'📖 القرآن الكريم',d:'تلاوة وتفسير بكل اللغات',u:'https://quran.com'},
{n:'🕌 السنة النبوية',d:'أحاديث شريفة مشروحة',u:'https://sunnah.com'},
{n:'🎥 يوتيوب',d:'قريبًا: فيديوهات المملكة!',u:'https://youtube.com'},
{n:'🌦️ حالة الطقس',d:'اعرف جوّ القافلة قبل السفر',u:'https://weather.com'},
{n:'📧 جيميل',d:'بريدك الإلكتروني',u:'https://mail.google.com'},
{n:'💾 جوجل درايف',d:'مخزن ملفاتك وكتبك',u:'https://drive.google.com'}
];
function card(l,mine,i){return `<div class="item"><b>${l.n}</b><small>${l.d||''}</small><div class="item-btns"><button onclick="window.open('${l.u}')">🌍 افتح</button><button onclick="copyL('${l.u}',this)">📋 نسخ</button>${mine?`<button onclick="delL(${i})">🗑️ حذف</button>`:''}</div></div>`}
document.getElementById('ready').innerHTML=R.map(l=>card(l,false)).join('');
let mine=JSON.parse(localStorage.getItem('safara_links')||'[]');
function renderMine(){document.getElementById('mine').innerHTML=mine.length?mine.map((l,i)=>card(l,true,i)).join(''):'<div class="note">لسا ما ضفت روابط — ابدأ بالأول!</div>'}
function addL(){
 const n=document.getElementById('ln').value.trim(),u=document.getElementById('lu').value.trim();
 if(!n||!u){alert('عبّي الاسم والرابط!');return}
 mine.push({n:n,d:'رابطك الخاص',u:u.startsWith('http')?u:'https://'+u});
 localStorage.setItem('safara_links',JSON.stringify(mine));
 document.getElementById('ln').value='';document.getElementById('lu').value='';
 renderMine();
}
function delL(i){mine.splice(i,1);localStorage.setItem('safara_links',JSON.stringify(mine));renderMine()}
function copyL(u,b){navigator.clipboard.writeText(u).then(()=>{b.textContent='✅ اننسخ!'})}
renderMine();
</script>
</body>
</html>
