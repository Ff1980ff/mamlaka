<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارة الروابط</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}body{background:linear-gradient(160deg,#1e1b4b,#3b0764);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}.frame{width:100%;max-width:460px;background:#0f172a;border:6px solid #f472b6;border-radius:24px;padding:16px;min-height:85vh}h2{text-align:center;color:#f9a8d4;font-size:20px}.sub{text-align:center;font-size:11px;color:#94a3b8;margin:4px 0 12px}.row{display:flex;gap:6px;margin-bottom:8px}select,input{border:0;border-radius:12px;padding:11px;font-size:14px;background:#1e293b;color:#fff;outline:0;border:1px solid #334155}select{width:110px}.row input{flex:1}.btn{border:0;border-radius:12px;padding:12px;font-size:13px;font-weight:bold;cursor:pointer;background:#f472b6;color:#1e1b4b;width:100%;margin-bottom:6px}.btn.g{background:#22c55e;color:#fff}.btn.b{background:#38bdf8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.lk{border-radius:16px;padding:14px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;border:2px solid;position:relative}.lk span{font-size:32px}.lk b{font-size:12px}.lk .del{position:absolute;top:4px;left:6px;background:#ef4444;border:0;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}.st{text-align:center;font-size:12px;color:#94a3b8;min-height:16px}
</style></head><body><div class="frame">
<h2>🌐 سفارة الروابط</h2><div class="sub">كل حساباتك بمكان واحد — انشرها وخلي العالم يوصلك!</div>
<div class="row"><select id="pl"></select><input id="url" placeholder="الصق الرابط هون..."></div>
<button class="btn" onclick="addL()">➕ ضيف الرابط</button>
<div class="grid" id="grid"></div>
<button class="btn g" onclick="shareAll()">📤 انشر كل روابطي</button>
<button class="btn b" onclick="copyAll()">📋 انسخ الكل</button>
<div class="st" id="st"></div>
</div><script>
const PL=[["يوتيوب","▶️","#ff0000"],["فيسبوك","📘","#1877f2"],["انستغرام","📸","#e1306c"],["تلغرام","✈️","#229ed9"],["واتساب","💬","#25d366"],["تيك توك","🎵","#6b7280"],["اكس","🐦","#0ea5e9"],["موقعي","🌐","#38bdf8"],["اخر","🔗","#f472b6"]];
let links=JSON.parse(localStorage.getItem("myLinks")||"[]");
document.getElementById("pl").innerHTML=PL.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join("");
function addL(){
 const p=+document.getElementById("pl").value;
 let u=document.getElementById("url").value.trim();
 if(!u){alert("الصق الرابط أولًا");return}
 if(!u.startsWith("http"))u="https://"+u;
 links.push({p,u});localStorage.setItem("myLinks",JSON.stringify(links));
 document.getElementById("url").value="";render();st("✔️ انحفظ!");
}
function delL(i){links.splice(i,1);localStorage.setItem("myLinks",JSON.stringify(links));render()}
function render(){
 document.getElementById("grid").innerHTML=links.map((l,i)=>{
  const p=PL[l.p];
  return `<div class="lk" style="border-color:${p[2]};background:${p[2]}22" onclick="openL(${i})"><button class="del" onclick="event.stopPropagation();delL(${i})">✖</button><span>${p[1]}</span><b>${p[0]}</b></div>`;
 }).join("")||"<div style='grid-column:1/-1;text-align:center;color:#64748b;font-size:12px'>ضيف أول رابط ☝️</div>";
}
function openL(i){window.open(links[i].u,"_blank")}
function allText(){
 let t="🏠 بوابتي الرقمية — تواصلوا معي:\n\n";
 links.forEach(l=>{t+=PL[l.p][1]+" "+PL[l.p][0]+": "+l.u+"\n"});
 t+="\nشاركوها مع الجيران والأصحاب 💜";
 return t;
}
function shareAll(){
 if(!links.length){alert("ضيف روابط أولًا");return}
 if(navigator.share)navigator.share({text:allText()}).catch(()=>{});else copyAll();
}
function copyAll(){
 if(!links.length){alert("ضيف روابط أولًا");return}
 const ta=document.createElement("textarea");ta.value=allText();document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
 st("📋 اننسخت! الصقها وين ما بدك");
}
function st(m){document.getElementById("st").textContent=m}
render();
</script></body></html>
