<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارة الروابط الذكية | نشر واربح</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo', Tahoma, sans-serif}body{background:linear-gradient(160deg,#1e1b4b,#3b0764);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}.frame{width:100%;max-width:460px;background:#0f172a;border:6px solid #f472b6;border-radius:24px;padding:16px;min-height:85vh;box-shadow:0 10px 30px rgba(0,0,0,0.5)}h2{text-align:center;color:#f9a8d4;font-size:20px;margin-bottom:5px}.sub{text-align:center;font-size:11px;color:#94a3b8;margin:4px 0 12px;line-height:1.5}.row{display:flex;gap:6px;margin-bottom:8px}select,input{border:0;border-radius:12px;padding:11px;font-size:14px;background:#1e293b;color:#fff;outline:0;border:1px solid #334155;width:100%}select{width:110px;flex-shrink:0}.btn{border:0;border-radius:12px;padding:12px;font-size:13px;font-weight:bold;cursor:pointer;background:#f472b6;color:#1e1b4b;width:100%;margin-bottom:6px;transition:transform 0.2s, box-shadow 0.2s}.btn:active{transform:scale(0.98)}.btn.g{background:#22c55e;color:#fff;box-shadow:0 4px 15px rgba(34, 197, 94, 0.3)}.btn.b{background:#38bdf8;color:#000}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.lk{border-radius:16px;padding:14px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;border:2px solid;position:relative;transition:all 0.3s}.lk:hover{transform:translateY(-2px)}.lk span{font-size:32px}.lk b{font-size:12px}.lk .del{position:absolute;top:4px;left:6px;background:#ef4444;border:0;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:10px;z-index:10}.st{text-align:center;font-size:12px;color:#94a3b8;min-height:16px;margin-top:10px}.loader{display:none;text-align:center;color:#fbbf24;font-size:12px;margin-top:5px;animation:pulse 1.5s infinite}@keyframes pulse{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}</style></head><body><div class="frame">
<h2>🌐 سفارة الروابط الذكية</h2><div class="sub">حوّل حساباتك إلى مصادر دخل!<br>كل رابط تنشره يمر عبر خادم الربح الذكي.</div>

<div class="row"><select id="pl"></select><input id="url" placeholder="الصق الرابط الأصلي هنا..."></div>
<button class="btn" onclick="addL()">➕ ضيف الرابط للسفارة</button>

<div class="grid" id="grid"></div>

<!-- الأزرار الجديدة المدعومة بالربح -->
<button class="btn g" onclick="smartShareAndEarn()">💸 انشر الكل واربح (واتساب/فيسبوك)</button>
<button class="btn b" onclick="smartCopyAndEarn()">📋 انسخ النصوص المربحة</button>

<div class="loader" id="loader">⏳ جارٍ توليد الروابط المربحة...</div>
<div class="st" id="st"></div>
</div>

<script>
// ==========================================
// ⚠️ ضع مفاتيحك الحقيقية هنا (نفس المفاتيح المستخدمة في الموقع الرئيسي)
// ==========================================
const SHRINK_API_KEY = '0fc4e8bc09ec2508d213af0e810bbe1d8f1cf4c3; 
const EXE_API_KEY = '8a00e563ec670798e86aeb5560a6f424894f3bd4; 

// قائمة المنصات
const PL=[["يوتيوب","▶️","#ff0000"],["فيسبوك","📘","#1877f2"],["انستغرام","📸","#e1306c"],["تلغرام","✈️","#229ed9"],["واتساب","💬","#25d366"],["تيك توك","🎵","#6b7280"],["اكس","🐦","#0ea5e9"],["موقعي","🌐","#38bdf8"],["اخر","🔗","#f472b6"]];

let links=JSON.parse(localStorage.getItem("myLinks")||"[]");

// تهيئة القائمة المنسدلة
document.getElementById("pl").innerHTML=PL.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join("");

function addL(){
 const p=+document.getElementById("pl").value;
 let u=document.getElementById("url").value.trim();
 if(!u){alert("الصق الرابط أولًا");return}
 if(!u.startsWith("http"))u="https://"+u;
 links.push({p,u});localStorage.setItem("myLinks",JSON.stringify(links));
 document.getElementById("url").value="";render();st("✔️ انحفظ في السفارة!");
}

function delL(i){links.splice(i,1);localStorage.setItem("myLinks",JSON.stringify(links));render()}

function render(){
 document.getElementById("grid").innerHTML=links.map((l,i)=>{
  const p=PL[l.p];
  return `<div class="lk" style="border-color:${p[2]};background:${p[2]}22" onclick="openL(${i})"><button class="del" onclick="event.stopPropagation();delL(${i})">✖</button><span>${p[1]}</span><b>${p[0]}</b></div>`;
 }).join("")||"<div style='grid-column:1/-1;text-align:center;color:#64748b;font-size:12px'>ضيف أول رابط ☝️</div>";
}

function openL(i){window.open(links[i].u,"_blank")}

// ==========================================
// الدوال الذكية للربح والنشر
// ==========================================

async function getProfitUrl(longUrl) {
    // محاولة أولى: ShrinkMe
    try {
        const apiUrl = `https://shrinkme.io/api?url=${encodeURIComponent(longUrl)}&token=${SHRINK_API_KEY}`;
        const response = await fetch(apiUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl || data.link) return data.shortenedUrl || data.link;
        }
    } catch (e) {}

    // محاولة ثانية: Exe.io
    try {
        const apiUrl = `https://exe.io/api?api=${EXE_API_KEY}&url=${encodeURIComponent(longUrl)}`;
        const response = await fetch(apiUrl);
        if (response.ok) {
            const data = await response.json();
            if (data.shortenedUrl) return data.shortenedUrl;
        }
    } catch (e) {}

    // إذا فشل كل شيء، نعيد الرابط الأصلي (حتى لا يتوقف النشر)
    return longUrl; 
}

async function generateSmartText() {
    if(!links.length) return null;
    
    st("جارٍ التحويل لروابط مربحة...");
    document.getElementById('loader').style.display = 'block';

    let finalText = "🏠 بوابتي الرقمية الذكية — تواصلوا معي عبر هذه الروابط المختصرة:\n\n";
    
    // حلقة تكرارية لتقصير كل رابط على حدة
    for(let i=0; i<links.length; i++) {
        const l = links[i];
        const platformName = PL[l.p][0];
        const emoji = PL[l.p][1];
        
        // استدعاء دالة الربح لكل رابط
        const profitLink = await getProfitUrl(l.u);
        
        finalText += `${emoji} ${platformName}: ${profitLink}\n`;
    }
    
    finalText += "\nشاركوها مع الأصدقاء ودعموا المحتوى 💜\nPowered by Mamlaka Apps";
    
    document.getElementById('loader').style.display = 'none';
    return finalText;
}

async function smartShareAndEarn() {
    if(!links.length){alert("ضيف روابط أولًا");return}
    
    const textToShare = await generateSmartText();
    if(!textToShare) return;

    // استخدام Web Share API (يفتح قائمة مشاركة الهاتف: واتساب، ماسنجر، إلخ)
    if(navigator.share) {
        navigator.share({
            title: "روابطي الذكية",
            text: textToShare
        }).then(() => {
            st("✅ تم النشر بنجاح! أرباحك تتراكم.");
        }).catch(err => {
            console.log("User cancelled sharing or error:", err);
            st("❌ تم إلغاء المشاركة.");
        });
    } else {
        // احتياطياً للمتصفحات القديمة
        await smartCopyAndEarn();
    }
}

async function smartCopyAndEarn() {
    if(!links.length){alert("ضيف روابط أولًا");return}
    
    const textToCopy = await generateSmartText();
    if(!textToCopy) return;

    try {
        await navigator.clipboard.writeText(textToCopy);
        st("📋 اننسخت النصوص المربحة! الصقها وين ما بدك.");
    } catch (err) {
        // طريقة قديمة للنسخ إذا فشلت الحديثة
        const ta=document.createElement("textarea");ta.value=textToCopy;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
        st("📋 اننسخت! الصقها وين ما بدك.");
    }
}

function st(m){document.getElementById("st").textContent=m}
render();
</script></body></html>
