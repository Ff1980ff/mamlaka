<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القارئ الناطق الدقيق</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}
body{background:radial-gradient(circle at 50% 0%,#fdf8ee,#f3e5c8 75%);color:#3d2b1f;min-height:100vh;padding:12px}
.frame{max-width:560px;margin:auto;background:#fffaf2;border:5px solid #d97706;border-radius:20px;padding:14px}
h2{text-align:center;color:#92400e;font-size:18px;margin-bottom:8px}
textarea{width:100%;border:1px solid #e7d7bd;border-radius:12px;padding:10px;font-size:15px;background:#fff;min-height:110px;outline:none;line-height:2}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{border:none;border-radius:12px;padding:10px 13px;font-size:12px;font-weight:bold;cursor:pointer;color:#fff;background:#d97706}
.btn.g{background:#22c55e}.btn.b{background:#38bdf8}.btn.r{background:#dc2626}.btn.gr{background:#e7d7bd;color:#7c5a2e}
select{border:1px solid #e7d7bd;border-radius:10px;padding:8px;background:#fff;font-size:12px;max-width:170px}
input[type=range]{width:100px}
#page{background:#fff;border:1px solid #eadbc2;border-radius:14px;padding:14px;font-size:17px;line-height:2.2;min-height:200px;max-height:60vh;overflow:auto;margin-top:8px}
.w{border-radius:4px;padding:0 2px}
.hl0{background:#fde047;color:#1c1917}
.hl1{background:#86efac;color:#14532d}
.hl2{background:#fca5a5;color:#7f1d1d}
.hl3{color:#2563eb;font-weight:bold;background:#dbeafe}
.st{text-align:center;font-size:11px;color:#a16201;margin-top:6px;min-height:14px}
</style>
</head>
<body>
<div class="frame">
<h2>📖 القارئ الناطق الدقيق</h2>
<select id="lib" onchange="loadLib()" style="width:100%;margin-bottom:6px;max-width:100%"><option value="">📚 حمّل من مكتبتك (اختياري)</option></select>
<textarea id="txt" placeholder="الصق الكتاب أو القصة هون..."></textarea>
<div class="bar">
 <button class="btn g" onclick="read()">▶ قراءة</button>
 <button class="btn b" onclick="pauseR()">⏸ مؤقت</button>
 <button class="btn r" onclick="stopR()">⏹ إنهاء</button>
 <button class="btn gr" onclick="chgSize(1)">أ+</button>
 <button class="btn gr" onclick="chgSize(-1)">أ-</button>
</div>
<div class="bar">
 <span style="font-size:11px">🗣️ القارئ:</span>
 <select id="voice"></select>
 <button class="btn b" onclick="testV()">🔊 جرّب</button>
</div>
<div class="bar">
 <span style="font-size:11px">السرعة</span><input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9">
 <span style="font-size:11px">اللون</span>
 <select id="hlc"><option value="0">🟡 أصفر</option><option value="1">🟢 أخضر</option><option value="2">🔴 أحمر</option><option value="3">🔵 أزرق</option></select>
</div>
<div id="page"></div>
<div class="st" id="st"></div>
</div>
<script>
let tokens=[],cur=-1,fs=17,intEst=null,ti=null,VOICES=[];
const libS=document.getElementById("lib"),voiceS=document.getElementById("voice");
try{const L=JSON.parse(localStorage.getItem("myLib")||"[]");L.forEach(b=>libS.add(new Option("📚 "+b.title,b.id)))}catch(e){}
function loadV(){
 VOICES=speechSynthesis.getVoices()||[];
 const saved=localStorage.getItem("readerVoice")||"";
 voiceS.innerHTML="";
 voiceS.add(new Option("تلقائي",""));
 VOICES.filter(v=>v.lang.startsWith("ar")).forEach(v=>voiceS.add(new Option("🟢 "+v.name,v.name)));
 VOICES.filter(v=>!v.lang.startsWith("ar")).forEach(v=>voiceS.add(new Option("🔹 "+v.name,v.name)));
 if(saved)voiceS.value=saved;
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=loadV;loadV()}
function loadLib(){
 const id=libS.value;if(!id)return;
 const L=JSON.parse(localStorage.getItem("myLib")||"[]");
 const b=L.find(x=>x.id===id);
 if(b&&b.text)document.getElementById("txt").value=b.text;
}
function buildPage(){
 const text=document.getElementById("txt").value;
 const page=document.getElementById("page");
 page.innerHTML="";tokens=[];cur=-1;
 const re=/([^\s\n]+)|(\n)/g;let m;
 while(m=re.exec(text)){
  if(m[2]){page.appendChild(document.createElement("br"))}
  else{
   const sp=document.createElement("span");sp.className="w";sp.textContent=m[1];
   page.appendChild(sp);page.appendChild(document.createTextNode(" "));
   tokens.push({s:m.index,e:m.index+m[1].length,el:sp});
  }
 }
}
function hlTok(i){
 if(i<0||i>=tokens.length)return;
 if(cur>=0&&tokens[cur])tokens[cur].el.className="w";
 cur=i;
 tokens[i].el.className="w hl"+document.getElementById("hlc").value;
 tokens[i].el.scrollIntoView({block:"center",behavior:"smooth"});
}
function hlAt(ci){const i=tokens.findIndex(t=>ci>=t.s&&ci<t.e);if(i>=0)hlTok(i)}
function sens(text){
 const out=[],re=/[^\n.!؟?]+[.!؟?\n]*/g;let m;
 while(m=re.exec(text))if(m[0].trim())out.push({str:m[0],off:m.index});
 return out;
}
function mkU(s){
 const u=new SpeechSynthesisUtterance(s);
 u.rate=parseFloat(document.getElementById("rate").value);
 const v=VOICES.find(x=>x.name===voiceS.value);
 if(v){u.voice=v;u.lang=v.lang}else u.lang="ar-SA";
 return u;
}
function testV(){
 speechSynthesis.cancel();
 speechSynthesis.speak(mkU("مرحبًا! أنا الصوت اللي اخترتو، هلأ رح أقرأ لك بوضوح."));
 localStorage.setItem("readerVoice",voiceS.value);
}
function read(){
 stopR();
 const text=document.getElementById("txt").value.trim();
 if(!text){alert("الصق نص أولًا أو حمّل من مكتبتك");return}
 localStorage.setItem("readerVoice",voiceS.value);
 buildPage();
 const S=sens(text);let si=0;
 document.getElementById("st").textContent="🔊 عم نقرأ...";
 function next(){
  if(si>=S.length){stopR();document.getElementById("st").textContent="✔️ خلصت القراءة!";return}
  const s=S[si];
  const u=mkU(s.str);
  let k=0;
  const wIdx=tokens.findIndex(t=>t.s>=s.off);
  const wCnt=(s.str.match(/\S+/g)||[]).length;
  u.onstart=()=>{ti=setTimeout(()=>{
   intEst=setInterval(()=>{k++;if(wIdx>=0&&k<wCnt)hlTok(wIdx+k)},600/u.rate);
  },800)};
  u.onboundary=e=>{
   if(ti){clearTimeout(ti);ti=null}
   if(intEst){clearInterval(intEst);intEst=null}
   hlAt(s.off+e.charIndex);
  };
  u.onend=()=>{if(ti)clearTimeout(ti);if(intEst)clearInterval(intEst);ti=null;intEst=null;si++;next()};
  speechSynthesis.speak(u);
 }
 next();
}
function pauseR(){speechSynthesis.pause()}
function stopR(){
 speechSynthesis.cancel();
 if(ti)clearTimeout(ti);if(intEst)clearInterval(intEst);
 if(cur>=0&&tokens[cur])tokens[cur].el.className="w";
 cur=-1;
}
function chgSize(d){fs=Math.max(13,Math.min(26,fs+d*2));document.getElementById("page").style.fontSize=fs+"px"}
</script>
</body>
</html>
