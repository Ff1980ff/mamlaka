<title>كوكبي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: globe stage on one side, learning panel on the other; stacked on phones */
:root{
  --space:#070c24; --space-2:#0b1235; --card:#0f1a45; --card-2:#16245a; --edge:#2b3b78;
  --ink:#eef3ff; --ink-2:#a9b8e2; --sun:#ffc94d; --sun-ink:#2a1c00;
  --good:#4fd08a; --bad:#ff7d6e;
  --display:'Baloo Bhaijaan 2','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--space); color:var(--ink); direction:rtl;
  font:400 15px/1.65 var(--body);
  padding-block:12px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background-image:radial-gradient(900px 500px at 85% -5%, rgba(54,80,190,.28), transparent 65%);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #fff;outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{margin:0;font:800 30px/1.1 var(--display);letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--edge);background:var(--card-2);font-weight:600}
.btn:hover{border-color:#5a72d6}
.btn.primary{background:var(--sun);color:var(--sun-ink);border-color:transparent}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn[aria-pressed="true"]{background:#223375;border-color:#6f86e8}

.stage-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:30px;overflow:hidden;border:1px solid var(--edge);background:radial-gradient(circle at 50% 45%, #0c1749, #050a1f 75%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.hud{position:absolute;pointer-events:none;font-size:12.5px;color:var(--ink-2);background:rgba(7,12,36,.62);padding:6px 10px;border-radius:12px;backdrop-filter:blur(4px)}
.hud b{color:var(--ink);font-weight:600}
.hud-a{top:12px;inset-inline-start:12px}
.hud-b{top:12px;inset-inline-end:12px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sun);display:inline-block}
.dot.dusk{background:#ff9a5a}.dot.night{background:#6f8cff}
.zoom{position:absolute;inset-inline-end:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:rgba(15,26,69,.85);display:grid;place-items:center;font-size:22px;line-height:1}
.rbtn svg{width:20px;height:20px}
.hint{position:absolute;inset-inline:0;bottom:14px;text-align:center;font-size:13px;color:var(--ink-2);pointer-events:none;transition:opacity .6s}
.hint span{background:rgba(7,12,36,.62);padding:6px 12px;border-radius:999px}
.hint.gone{opacity:0}

.tools{background:var(--card);border:1px solid var(--edge);border-radius:22px;padding:12px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.clock{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.clock label{font-size:13px;color:var(--ink-2)}
.clock output{font:600 14px var(--body);font-variant-numeric:tabular-nums;min-width:48px;text-align:center;direction:ltr}
input[type=range]{width:100%;accent-color:var(--sun);min-height:32px}
.note{margin:0;font-size:12.5px;color:var(--ink-2)}

.panel{background:var(--card);border:1px solid var(--edge);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--space-2);padding:5px;border-radius:16px}
.tab{min-height:44px;border:0;border-radius:12px;background:transparent;font-weight:600;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--sun);color:var(--sun-ink)}
.info{background:var(--card-2);border-radius:20px;padding:16px;display:grid;gap:10px;min-width:0}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--space-2);padding:4px 12px;border-radius:999px;width:fit-content}
.sw{width:11px;height:11px;border-radius:50%;background:var(--c,#fff);display:inline-block;flex:none}
.info h2{margin:0;font:800 28px/1.25 var(--display);text-wrap:balance}
.info .sub{margin:-6px 0 0;color:var(--ink-2);font-size:14px}
.stats{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:var(--space-2);border-radius:14px;padding:8px 12px;min-width:0}
.stats dt{font-size:12px;color:var(--ink-2)}
.stats dd{margin:0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.fact{margin:0;font-size:15.5px;line-height:1.85;max-width:62ch}
.sec h3,.sec .h3{margin:0 0 8px;font:700 16px var(--display);color:var(--ink-2)}
.sec{display:grid;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--edge);background:var(--space-2);font-size:14px}
.chip:hover{border-color:#6f86e8}
.lm-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lm{min-height:56px;text-align:start;padding:8px 12px;border-radius:14px;border:1px solid var(--edge);background:var(--space-2);display:grid;gap:0;line-height:1.35}
.lm small{color:var(--ink-2);font-size:12px}
.lm:hover{border-color:#6f86e8}
.qhead{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--ink-2)}
.qhead b{color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--space-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.qprompt{margin:4px 0;font:800 26px/1.4 var(--display);text-wrap:balance}
.fb{min-height:28px;font-weight:600}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.big{font:800 52px/1 var(--display);color:var(--sun)}
@media (min-width:920px){
  .app{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:start}
  .top{grid-column:1/-1}
  .stage-col{position:sticky;top:12px}
}
@media (max-width:420px){
  .brand h1{font-size:26px}
  .clock{grid-template-columns:minmax(0,1fr) auto auto}
  .clock label{grid-column:1/-1}
  .info h2{font-size:24px}
  .qprompt{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><radialGradient id="lg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#4ea0ee"/><stop offset="1" stop-color="#0d3470"/></radialGradient></defs>
        <circle cx="24" cy="24" r="20" fill="url(#lg)"/>
        <path d="M13 16c4-4 9-3 11 0s-2 6-5 6-3 4-6 3-3-6 0-9zM28 28c3-2 7 0 7 4s-4 6-7 4-3-6 0-8z" fill="#5cc98a"/>
        <ellipse cx="24" cy="24" rx="23" ry="8" fill="none" stroke="#ffc94d" stroke-width="2" transform="rotate(-24 24 24)"/>
      </svg>
      <div><h1>كوكبي</h1><p>جولة حيّة على كوكب الأرض</p></div>
    </div>
    <button class="btn" id="tgVoice" aria-pressed="false" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      القراءة بالصوت
    </button>
  </header>

  <div class="stage-col">
    <div class="stage" id="stage">
      <canvas id="globe" tabindex="0" aria-label="الكرة الأرضية. اسحب للتدوير، واضغط على قارة أو محيط أو معلم. يمكن استخدام الأسهم للتدوير ومفتاحي زائد وناقص للتكبير."></canvas>
      <div class="hud hud-a" id="hudPos"></div>
      <div class="hud hud-b" id="hudSun"></div>
      <div class="zoom">
        <button class="rbtn" id="zIn" type="button" aria-label="تكبير">+</button>
        <button class="rbtn" id="zOut" type="button" aria-label="تصغير">−</button>
        <button class="rbtn" id="zHome" type="button" aria-label="العودة إلى بلاد الشام">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="hint" id="hint"><span>اسحب الكرة لتدوّرها، واضغط على أي مكان</span></div>
    </div>
    <div class="tools">
      <div class="row" role="group" aria-label="خيارات العرض">
        <button class="btn small" id="tgLabels" aria-pressed="true" type="button">الأسماء</button>
        <button class="btn small" id="tgGrid" aria-pressed="true" type="button">خطوط الطول والعرض</button>
        <button class="btn small" id="tgNight" aria-pressed="true" type="button">الليل والنهار</button>
        <button class="btn small" id="tgSpin" aria-pressed="false" type="button">دوران تلقائي</button>
      </div>
      <div class="clock">
        <label for="tm">ساعة اليوم بتوقيت غرينتش</label>
        <input type="range" id="tm" min="0" max="1439" step="5" value="720">
        <output id="tmOut" for="tm">12:00</output>
        <button class="btn small" id="tmLive" type="button">الآن</button>
      </div>
      <p class="note">حرّك الشريط لترى كيف يتنقّل الضوء على الكرة مع دوران الأرض. الوضع الافتراضي يطابق موضع الشمس الحقيقي الآن.</p>
    </div>
  </div>

  <main class="panel">
    <div class="tabs" role="tablist" aria-label="أقسام التطبيق">
      <button class="tab" role="tab" id="tab-explore" aria-selected="true" aria-controls="v-explore" type="button">استكشف</button>
      <button class="tab" role="tab" id="tab-quiz" aria-selected="false" aria-controls="v-quiz" type="button">تحدّي</button>
      <button class="tab" role="tab" id="tab-places" aria-selected="false" aria-controls="v-places" type="button">المعالم</button>
    </div>
    <section class="info" id="info" aria-live="polite"></section>
    <section id="v-explore" role="tabpanel" aria-labelledby="tab-explore" class="sec">
      <div class="h3">انتقل إلى قارة</div>
      <div class="row" id="chipsCont"></div>
      <div class="h3">أو إلى محيط</div>
      <div class="row" id="chipsOcean"></div>
    </section>
    <section id="v-quiz" role="tabpanel" aria-labelledby="tab-quiz" class="sec" hidden></section>
    <section id="v-places" role="tabpanel" aria-labelledby="tab-places" class="sec" hidden>
      <div class="row"><button class="btn primary" id="tourBtn" type="button">ابدأ الجولة حول العالم</button></div>
      <div class="lm-list" id="lmList"></div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};

/*DATA-START*/
var D=Math.PI/180;
function P(s){return s.trim().split(/\s+/).map(function(p){var a=p.split(',');return [+a[0],+a[1]];});}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function mix(hex,t){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;r=Math.round(r+(255-r)*t);g=Math.round(g+(255-g)*t);b=Math.round(b+(255-b)*t);return 'rgb('+r+','+g+','+b+')';}

var CONT={
 asia:{name:'آسيا',label:'آسيا',color:'#ef7b5d',lon:90,lat:40,labelAt:[92,48],stats:[['المساحة','44.6 مليون كم²'],['السكان','نحو 4.8 مليار'],['الدول','نحو 48 دولة'],['أعلى قمة','إفرست، 8,849 م']],fact:'أكبر قارات العالم، ويعيش فيها أكثر من نصف سكان الأرض. فيها أعلى جبال العالم، وفيها بلاد الشام التي تنتمي إليها سوريا.'},
 europe:{name:'أوروبا',label:'أوروبا',color:'#b58cf0',lon:15,lat:50,labelAt:[18,52],stats:[['المساحة','10.2 مليون كم²'],['السكان','نحو 750 مليون'],['الدول','نحو 44 دولة'],['أعلى قمة','إلبروس، 5,642 م']],fact:'قارة صغيرة المساحة لكنها مزدحمة بالدول والمدن. وفيها أصغر دولة في العالم: الفاتيكان.'},
 africa:{name:'أفريقيا',label:'أفريقيا',color:'#f2b24d',lon:20,lat:5,labelAt:[20,6],stats:[['المساحة','30.4 مليون كم²'],['السكان','نحو 1.5 مليار'],['الدول','54 دولة'],['أعلى قمة','كليمنجارو، 5,895 م']],fact:'ثاني أكبر القارات. فيها الصحراء الكبرى ونهر النيل، وهو من أطول أنهار العالم.'},
 namerica:{name:'أمريكا الشمالية',label:'أمريكا الشمالية',color:'#5cc98a',lon:-100,lat:45,labelAt:[-100,46],stats:[['المساحة','24.7 مليون كم²'],['السكان','نحو 600 مليون'],['الدول','23 دولة'],['أعلى قمة','دينالي، 6,190 م']],fact:'تمتد من المناطق المتجمدة في الشمال إلى الغابات الاستوائية في أمريكا الوسطى. وفيها كندا التي تملك أطول سواحل في العالم.'},
 samerica:{name:'أمريكا الجنوبية',label:'أمريكا الجنوبية',color:'#35c4b5',lon:-60,lat:-15,labelAt:[-60,-14],stats:[['المساحة','17.8 مليون كم²'],['السكان','نحو 440 مليون'],['الدول','12 دولة'],['أعلى قمة','أكونكاغوا، 6,961 م']],fact:'فيها غابات الأمازون المطيرة ونهر الأمازون وسلسلة جبال الأنديز، وهي أطول سلسلة جبال على اليابسة.'},
 oceania:{name:'أستراليا وأوقيانوسيا',label:'أستراليا',color:'#f06fa5',lon:140,lat:-25,labelAt:[134,-25],stats:[['المساحة','8.5 مليون كم²'],['السكان','نحو 45 مليون'],['الدول','نحو 14 دولة'],['أعلى قمة','بونشاك جايا، 4,884 م']],fact:'تضم أستراليا ونيوزيلندا وآلاف الجزر في المحيط الهادئ. وفيها حيوانات مشهورة مثل الكنغر والكوالا.'},
 antarctica:{name:'أنتاركتيكا',sub:'القارة القطبية الجنوبية',label:'أنتاركتيكا',color:'#e6f2fb',lon:0,lat:-75,labelAt:[20,-80],stats:[['المساحة','14.2 مليون كم²'],['السكان','باحثون فقط'],['الدول','لا توجد دول'],['أعلى قمة','فينسون، 4,892 م']],fact:'أبرد قارة وأكثرها جفافاً ورياحاً. يغطيها جليد سميك يخزّن نحو 70% من المياه العذبة في العالم.'}
};
var CONT_ORDER=['asia','europe','africa','namerica','samerica','oceania','antarctica'];
for(var ck in CONT){CONT[ck].light=mix(CONT[ck].color,.38);}

var OCEANS={
 pacific:{name:'المحيط الهادئ',lon:-150,lat:5,color:'#4ea0ee',stats:[['المساحة','نحو 165 مليون كم²'],['من سطح الأرض','نحو 32%'],['أعمق نقطة','خندق ماريانا، نحو 11 كم']],fact:'أكبر المحيطات وأعمقها. مساحته أكبر من مساحة اليابسة كلها مجتمعة.'},
 atlantic:{name:'المحيط الأطلسي',lon:-35,lat:15,color:'#4ea0ee',stats:[['المساحة','نحو 106 ملايين كم²'],['من سطح الأرض','نحو 21%'],['أعمق نقطة','خندق بورتوريكو، نحو 8,400 م']],fact:'يفصل بين الأمريكتين من جهة وأوروبا وأفريقيا من جهة أخرى، ويتسع ببضعة سنتيمترات كل سنة.'},
 indian:{name:'المحيط الهندي',lon:80,lat:-18,color:'#4ea0ee',stats:[['المساحة','نحو 70 مليون كم²'],['من سطح الأرض','نحو 14%'],['أعمق نقطة','خندق جاوة، نحو 7,300 م']],fact:'أدفأ المحيطات. استفاد التجار القدماء من رياحه الموسمية في رحلاتهم بين الشرق والغرب.'},
 southern:{name:'المحيط الجنوبي',lon:-30,lat:-62,color:'#4ea0ee',stats:[['المساحة','نحو 22 مليون كم²'],['من سطح الأرض','نحو 4%'],['أعمق نقطة','نحو 7,400 م']],fact:'يحيط بقارة أنتاركتيكا من كل الجهات، ويدور فيه أقوى تيار بحري في العالم.'},
 arctic:{name:'المحيط المتجمد الشمالي',lon:0,lat:80,color:'#4ea0ee',stats:[['المساحة','نحو 14 مليون كم²'],['من سطح الأرض','نحو 3%'],['أعمق نقطة','نحو 5,500 م']],fact:'أصغر المحيطات وأقلها عمقاً، ويغطي الجليد جزءاً كبيراً من سطحه معظم أيام السنة.'}
};
var OCEAN_IDS=['pacific','atlantic','indian','southern','arctic'];

var SEAS={
 med:{name:'البحر الأبيض المتوسط',stats:[['المساحة','نحو 2.5 مليون كم²'],['يحيط به','أوروبا وآسيا وأفريقيا']],fact:'بحر شبه مغلق بين ثلاث قارات. على شاطئه الشرقي تقع سوريا ولبنان وفلسطين، ومنه أبحر التجار والبحارة منذ آلاف السنين.'},
 red:{name:'البحر الأحمر',stats:[['المساحة','نحو 438 ألف كم²'],['أقصى عمق','نحو 3,000 م']],fact:'من أدفأ البحار وأكثرها ملوحة، وفيه شعاب مرجانية ملوّنة تعيش حولها أسماك كثيرة.'},
 gulf:{name:'الخليج العربي',stats:[['المساحة','نحو 251 ألف كم²'],['متوسط العمق','نحو 50 م']],fact:'بحر ضحل ودافئ تطل عليه دول كثيرة، ومنذ القدم اشتهر باستخراج اللؤلؤ.'},
 black:{name:'البحر الأسود',stats:[['المساحة','نحو 436 ألف كم²'],['أقصى عمق','نحو 2,200 م']],fact:'يقع بين أوروبا وآسيا، ويتصل بالبحر المتوسط عبر مضيقي البوسفور والدردنيل.'},
 caspian:{name:'بحر قزوين',stats:[['المساحة','نحو 371 ألف كم²'],['النوع','أكبر بحيرة في العالم']],fact:'اسمه بحر لكنه في الحقيقة أكبر بحيرة على الأرض، ولا يتصل بأي محيط.'}
};

var LM=[
 {id:'damascus',name:'دمشق',country:'سوريا',kind:'مدينة',lon:36.29,lat:33.51,fact:'من أقدم العواصم التي ما زال الناس يسكنونها بشكل متواصل في العالم. فيها الجامع الأموي وسوق الحميدية.'},

function buildPath(dp){
  var n=dp.n,X=dp.X,Y=dp.Y,Z=dp.Z,anyV=false,anyH=false,i;
  var l0=lon0*D;
  for(i=0;i<n;i++){
    var lam=dp.lr[i]-l0,cl=Math.cos(lam),sl=Math.sin(lam),cp=dp.cp[i],sp=dp.sp[i];
    X[i]=cp*sl;Y[i]=cosP0*sp-sinP0*cp*cl;Z[i]=sinP0*sp+cosP0*cp*cl;
    if(Z[i]>=0)anyV=true;else anyH=true;
  }
  if(!anyV)return false;
  ctx.beginPath();
  var first=true;
  function add(x,y){var px=cx+R*x,py=cy-R*y;if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}
  if(!anyH){for(i=0;i<n;i++)add(X[i],Y[i]);ctx.closePath();return true;}
  var s=0;while(Z[s]<0)s++;
  var exitAng=0,i2=s;
  function cross(a,b){var t=Z[a]/(Z[a]-Z[b]),x=X[a]+(X[b]-X[a])*t,y=Y[a]+(Y[b]-Y[a])*t,r=Math.sqrt(x*x+y*y)||1;return [x/r,y/r];}
  for(var c=0;c<n;c++){
    var a=i2,b=(i2+1)%n;
    if(Z[a]>=0){
      add(X[a],Y[a]);
      if(Z[b]<0){var e=cross(a,b);add(e[0],e[1]);exitAng=Math.atan2(e[1],e[0]);}
    }else if(Z[b]>=0){
      var e2=cross(a,b),entry=Math.atan2(e2[1],e2[0]);
      var d=entry-exitAng;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
      var steps=Math.ceil(Math.abs(d)/.08);
      for(var k=1;k<steps;k++)add(Math.cos(exitAng+d*k/steps),Math.sin(exitAng+d*k/steps));
      add(e2[0],e2[1]);
    }
    i2=b;
  }
  ctx.closePath();
  return true;
}

function drawNight(sun){
  var s=viewVec(sun.lon,sun.lat),d=nbImg.data;
  for(var py=0;py<NB;py++){
    var y=-((py+.5)/NB*2-1);
    for(var px=0;px<NB;px++){
      var x=(px+.5)/NB*2-1,r2=x*x+y*y,k=(py*NB+px)*4;
      if(r2>=1){d[k+3]=0;continue;}
      var z=Math.sqrt(1-r2),l=x*s.x+y*s.y+z*s.z;
      d[k]=5;d[k+1]=9;d[k+2]=34;d[k+3]=smooth(.1,-.22,l)*.74*255;
    }
  }
  nbCtx.putImageData(nbImg,0,0);
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.clip();
  ctx.imageSmoothingEnabled=true;ctx.drawImage(nbCan,cx-R,cy-R,2*R,2*R);ctx.restore();
}

function drawGrid(){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.clip();
  ctx.lineWidth=.8;ctx.strokeStyle='rgba(200,225,255,.22)';
  var lo,la,prev,v,k;
  ctx.beginPath();
  for(lo=-180;lo<180;lo+=30){
    prev=null;
    for(la=-90;la<=90;la+=4){
      v=viewVec(lo,la);
      if(v.z>0){var px=cx+R*v.x,py=cy-R*v.y;if(prev)ctx.lineTo(px,py);else ctx.moveTo(px,py);prev=1;}else prev=null;
    }
  }
  for(la=-60;la<=60;la+=30){
    if(la===0)continue;
    prev=null;
    for(lo=-180;lo<=180;lo+=4){
      v=viewVec(lo,la);
      if(v.z>0){var qx=cx+R*v.x,qy=cy-R*v.y;if(prev)ctx.lineTo(qx,qy);else ctx.moveTo(qx,qy);prev=1;}else prev=null;
    }
  }
  ctx.stroke();
  ctx.beginPath();ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,201,77,.55)';ctx.lineWidth=1.2;prev=null;
  for(lo=-180;lo<=180;lo+=4){
    v=viewVec(lo,0);
    if(v.z>0){var ex=cx+R*v.x,ey=cy-R*v.y;if(prev)ctx.lineTo(ex,ey);else ctx.moveTo(ex,ey);prev=1;}else prev=null;
  }
  ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
}

function label(text,lon,lat,size,color,minZ){
  var v=viewVec(lon,lat);
  if(v.z<(minZ||.28))return;
  var x=cx+R*v.x,y=cy-R*v.y,a=clamp((v.z-.2)*2.2,0,1);
  ctx.save();ctx.globalAlpha=a;
  ctx.font='700 '+size+'px "Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.lineWidth=4;ctx.strokeStyle='rgba(6,12,38,.75)';ctx.strokeText(text,x,y);
  ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore();
}

function render(now){
  var W=cssW,H=cssH,i;
  ctx.clearRect(0,0,W,H);
  cx=W/2;cy=H/2;R=Math.min(W,H)*.42*zoom;
  for(i=0;i<stars.length;i++){
    var st=stars[i],tw=reduce?.8:.55+.45*Math.sin(now/900+st.p);
    ctx.fillStyle='rgba(220,232,255,'+(.75*tw).toFixed(2)+')';
    ctx.beginPath();ctx.arc(st.x*W,st.y*H,st.r,0,6.2832);ctx.fill();
  }
  var g=ctx.createRadialGradient(cx,cy,R*.97,cx,cy,R*1.2);
  g.addColorStop(0,'rgba(110,180,255,.5)');g.addColorStop(1,'rgba(110,180,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.2,0,6.2832);ctx.fill();

  var og=ctx.createRadialGradient(cx-R*.32,cy-R*.36,R*.1,cx,cy,R);
  og.addColorStop(0,'#2f86d8');og.addColorStop(.55,'#1b5ca8');og.addColorStop(1,'#0a2a5e');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.fill();

  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.clip();
  if(showGrid)drawGrid();
  ctx.lineJoin='round';
  for(i=0;i<LAND.length;i++){
    var L=LAND[i],cid=L.c==='eurasia'?'asia':L.c;
    if(!buildPath(L.d))continue;
    ctx.fillStyle=selCont===cid?CONT[cid].light:CONT[cid].color;ctx.fill();
    if(L.c==='eurasia'){
      ctx.save();ctx.clip();
      if(buildPath(EURO_D)){ctx.fillStyle=selCont==='europe'?CONT.europe.light:CONT.europe.color;ctx.fill();}
      ctx.restore();
      buildPath(L.d);
    }
    ctx.lineWidth=selCont===cid?2.4:1;ctx.strokeStyle=selCont===cid?'#fff':'rgba(8,20,50,.55)';ctx.stroke();
  }
  if(selCont==='europe'&&EURASIA){
    ctx.save();buildPath(EURASIA.d);ctx.clip();
    if(buildPath(EURO_D)){ctx.lineWidth=2.4;ctx.strokeStyle='#fff';ctx.stroke();}
    ctx.restore();
  }
  [BLACK_D,CASP_D].forEach(function(w){if(buildPath(w)){ctx.fillStyle='#1d62ad';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(8,20,50,.55)';ctx.stroke();}});
  ctx.restore();

  var sun=sunState();
  if(showNight)drawNight(sun);

  var hl=ctx.createRadialGradient(cx-R*.35,cy-R*.4,0,cx-R*.35,cy-R*.4,R*.9);
  hl.addColorStop(0,'rgba(255,255,255,.14)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.fill();
  var lb=ctx.createRadialGradient(cx,cy,R*.62,cx,cy,R);
  lb.addColorStop(0,'rgba(2,6,22,0)');lb.addColorStop(1,'rgba(2,6,22,.5)');
  ctx.fillStyle=lb;ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(150,200,255,.4)';ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.stroke();

  if(showLabels){
    var fs=clamp(R*.062,11,22);
    CONT_ORDER.forEach(function(id){var c=CONT[id];label(c.label,c.labelAt[0],c.labelAt[1],fs,'#fff');});
    OCEAN_IDS.forEach(function(id){var o=OCEANS[id];label(o.name,o.lon,o.lat,fs*.9,'#bfe0ff',.35);});
  }

  LM.forEach(function(l){
    var v=viewVec(l.lon,l.lat);
    if(v.z<.06)return;
    var x=cx+R*v.x,y=cy-R*v.y,sel=selLm===l.id,pulse=reduce?0:(Math.sin(now/420)+1)/2;
    ctx.save();ctx.globalAlpha=clamp(v.z*4,0,1);
    if(sel){ctx.strokeStyle='rgba(255,201,77,'+(.8-.5*pulse).toFixed(2)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,9+pulse*7,0,6.2832);ctx.stroke();}
    ctx.fillStyle='#ffc94d';ctx.strokeStyle='#3a2500';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,sel?6:4.5,0,6.2832);ctx.fill();ctx.stroke();
    ctx.restore();
    if(sel||(showLabels&&zoom>=1.35))label(l.name,l.lon,l.lat-(sel?0:0)+(sel?0:0),clamp(R*.05,11,17),'#ffe08a',.2);
  });
  if(ripple){
    var t=(now-ripple.t0)/1200;
    if(t>=1)ripple=null;else{
      var rv=viewVec(ripple.lon,ripple.lat);
      if(rv.z>0){ctx.strokeStyle=ripple.col;ctx.globalAlpha=1-t;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx+R*rv.x,cy-R*rv.y,6+t*34,0,6.2832);ctx.stroke();ctx.globalAlpha=1;}
    }
  }
}

/* ---------- loop ---------- */
var last=performance.now(),hudT=0;
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(fly){
    var k=clamp((now-fly.t0)/fly.dur,0,1),e=ease(k);
    lon0=fly.l0+fly.dl*e;lat0=fly.p0+(fly.p1-fly.p0)*e;zoom=fly.z0+(fly.z1-fly.z0)*e;
    if(k>=1){var cb=fly.cb;fly=null;if(cb)cb();}
  }else if(!drag){
    if(Math.abs(vel.x)>.02||Math.abs(vel.y)>.02){lon0-=vel.x;lat0=clamp(lat0+vel.y,-85,85);vel.x*=.93;vel.y*=.93;}
    else if(autoSpin&&!(quiz&&tab==='quiz'))lon0+=dt*5;
  }
  lon0=((lon0+540)%360)-180;setView();
  render(now);
  hudT+=dt;if(hudT>.2){hudT=0;updateHud();}
  requestAnimationFrame(frame);
}
function pad(n){return (n<10?'0':'')+n;}
function updateHud(){
  var s=sunState(),v=viewVec(s.lon,s.lat);
  var alt=Math.asin(clamp(v.z,-1,1))/D;
  var solar=((s.minutes+s.E)/60+lon0/15)%24;if(solar<0)solar+=24;
  var hh=Math.floor(solar),mm=Math.floor((solar-hh)*60);
  var st=alt>6?['نهار','']:(alt>-6?['شفق','dusk']:['ليل','night']);
  var la=Math.abs(lat0).toFixed(1)+'° '+(lat0>=0?'شمال':'جنوب'),lo=Math.abs(lon0).toFixed(1)+'° '+(lon0>=0?'شرق':'غرب');
  $('#hudPos').innerHTML='<b><bdi>'+la+'</bdi> · <bdi>'+lo+'</bdi></b>';
  $('#hudSun').innerHTML='<span class="dot '+st[1]+'"></span><span>عند مركز الكرة: <b>'+st[0]+'</b> · الساعة الشمسية <b><bdi>'+pad(hh)+':'+pad(mm)+'</bdi></b></span>';
  if(tmLive){var m=Math.floor(s.minutes/5)*5;$('#tm').value=m;$('#tmOut').textContent=pad(Math.floor(m/60))+':'+pad(m%60);}
}

/* ---------- camera helpers ---------- */
function flyTo(lo,la,z,cb,dur){
  var d=((lo-lon0+540)%360)-180;
  fly={t0:performance.now(),dur:reduce?1:(dur||1100),l0:lon0,dl:d,p0:lat0,p1:clamp(la,-70,70),z0:zoom,z1:z||zoom,cb:cb};
  vel.x=vel.y=0;
}

/* ---------- speech ---------- */
function speak(t){try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ar';u.rate=.92;window.speechSynthesis.speak(u);}catch(e){}}
function stopSpeak(){try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}

/* ---------- info card ---------- */
var infoEl=$('#info');
function statsHTML(a){return '<dl class="stats">'+a.map(function(s){return '<div><dt>'+s[0]+'</dt><dd>'+s[1]+'</dd></div>';}).join('')+'</dl>';}
function showInfo(o,auto){
  infoEl.innerHTML='<div class="kick"><i class="sw" style="--c:'+o.color+'"></i>'+o.kicker+'</div><h2>'+o.title+'</h2>'+(o.sub?'<p class="sub">'+o.sub+'</p>':'')+(o.stats?statsHTML(o.stats):'')+'<p class="fact">'+o.fact+'</p><div class="row"><button class="btn small" id="btnSpeak" type="button">اسمع المعلومة</button></div>';
  $('#btnSpeak').onclick=function(){speak(o.title+'. '+o.fact);};
  if(voice&&auto!==false)speak(o.title+'. '+o.fact);
}
function contInfo(id){var c=CONT[id];return {kicker:'قارة',title:c.name,sub:c.sub,color:c.color,stats:c.stats,fact:c.fact};}
function oceanInfo(id){var o=OCEANS[id];return {kicker:'محيط',title:o.name,color:o.color,stats:o.stats,fact:o.fact};}
function seaInfo(id){var s=SEAS[id];return {kicker:'بحر',title:s.name,color:'#4ea0ee',stats:s.stats,fact:s.fact};}
function lmInfo(l){return {kicker:'معلم · '+l.kind,title:l.name,color:'#ffc94d',stats:[['المكان',l.country],['النوع',l.kind]],fact:l.fact};}
function welcome(){
  infoEl.innerHTML='<div class="kick"><i class="sw" style="--c:#ffc94d"></i>أهلاً بك</div><h2>اكتشف كوكبك</h2><p class="fact">دوّر الكرة بإصبعك، ثم اضغط على قارة أو محيط أو معلم لتتعرف عليه. وإن أردت أن تختبر معلوماتك فجرّب قسم التحدّي.</p>';
}
function selectId(id,ll){
  selLm=null;
  if(id.type==='cont'){selCont=id.id;showInfo(contInfo(id.id));}
  else{selCont=null;showInfo(id.type==='ocean'?oceanInfo(id.id):seaInfo(id.id));}
  ripple={lon:ll.lon,lat:ll.lat,t0:performance.now(),col:'#fff'};
}
function selectLm(l,doFly){
  selLm=l.id;selCont=null;showInfo(lmInfo(l));
  ripple={lon:l.lon,lat:l.lat,t0:performance.now(),col:'#ffc94d'};
  if(doFly)flyTo(l.lon,l.lat,Math.max(zoom,1.35));
}
function goCont(id){var c=CONT[id];selLm=null;selCont=id;showInfo(contInfo(id));flyTo(c.lon,c.lat,id==='asia'?1:1.2);}
function goOcean(id){var o=OCEANS[id];selLm=null;selCont=null;showInfo(oceanInfo(id));flyTo(o.lon,o.lat,1);}

/* ---------- tabs ---------- */
function setTab(t){
  tab=t;stopTour();
  ['explore','quiz','places'].forEach(function(n){
    $('#tab-'+n).setAttribute('aria-selected',n===t?'true':'false');
    $('#v-'+n).hidden=n!==t;
  });
  infoEl.hidden=t==='quiz';
  if(t==='quiz'){selCont=null;selLm=null;renderQuiz();}
}
['explore','quiz','places'].forEach(function(n){$('#tab-'+n).addEventListener('click',function(){setTab(n);});});

/* chips + landmark list */
$('#chipsCont').innerHTML=CONT_ORDER.map(function(id){return '<button class="chip" type="button" data-c="'+id+'"><i class="sw" style="--c:'+CONT[id].color+'"></i>'+CONT[id].name+'</button>';}).join('');
$('#chipsOcean').innerHTML=OCEAN_IDS.map(function(id){return '<button class="chip" type="button" data-o="'+id+'"><i class="sw" style="--c:#4ea0ee"></i>'+OCEANS[id].name+'</button>';}).join('');
$('#lmList').innerHTML=LM.map(function(l){return '<button class="lm" type="button" data-l="'+l.id+'"><span>'+l.name+'</span><small>'+l.country+'</small></button>';}).join('');

/* ---------- tour ---------- */
function stopTour(){
  if(!tour.on)return;
  tour.on=false;clearTimeout(tour.timer);stopSpeak();
  $('#tourBtn').textContent='ابدأ الجولة حول العالم';
}
function tourStep(){
  if(!tour.on)return;
  var l=LM[tour.i%LM.length];tour.i++;
  selectLm(l,false);
  flyTo(l.lon,l.lat,1.5,null,1800);
  tour.timer=setTimeout(tourStep,9000);
}
$('#tourBtn').addEventListener('click',function(){
  if(tour.on){stopTour();return;}
  tour.on=true;tour.i=0;autoSpin=false;$('#tgSpin').setAttribute('aria-pressed','false');
  this.textContent='إيقاف الجولة';tourStep();
});

/* ---------- quiz ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildQs(){
  var cs=shuffle(CONT_ORDER).slice(0,4).map(function(id){return {t:'cont',id:id};});
  var os=shuffle(OCEAN_IDS).slice(0,2).map(function(id){return {t:'ocean',id:id};});
  var ls=shuffle(LM.filter(function(l){return l.id!=='mariana';})).slice(0,4).map(function(l){return {t:'lm',id:l.id};});
  return shuffle(cs.concat(os,ls));
}
function lmById(id){return LM.filter(function(l){return l.id===id;})[0];}
function qPrompt(q){
  if(q.t==='cont')return 'دلّني على قارة '+CONT[q.id].name;
  if(q.t==='ocean')return 'أين يقع '+OCEANS[q.id].name+'؟';
  return 'أين تجد '+lmById(q.id).name+'؟';
}
function qTarget(q){
  if(q.t==='cont')return {lon:CONT[q.id].lon,lat:CONT[q.id].lat};
  if(q.t==='ocean')return {lon:OCEANS[q.id].lon,lat:OCEANS[q.id].lat};
  var l=lmById(q.id);return {lon:l.lon,lat:l.lat};
}
function bestScore(){try{return +localStorage.getItem('kawkabi.best')||0;}catch(e){return 0;}}
function saveBest(s){try{if(s>bestScore())localStorage.setItem('kawkabi.best',String(s));}catch(e){}}
function quizActive(){return !!(quiz&&!quiz.done&&tab==='quiz');}
function renderQuiz(){
  var el=$('#v-quiz'),b=bestScore();
  if(!quiz){
    el.innerHTML='<h3 class="h3">تحدّي الخرائط</h3><p class="fact">عشرة أسئلة. اضغط على الكرة لتجيب عن قارة أو محيط أو معلم. كل إجابة صحيحة بعشر نقاط، والتلميح يخفضها إلى خمس.</p>'+(b?'<p class="note">أفضل نتيجة لك: <b>'+b+'</b> من 100</p>':'')+'<div class="row"><button class="btn primary" id="qStart" type="button">ابدأ التحدّي</button></div>';
    $('#qStart').onclick=startQuiz;return;
  }
  if(quiz.done){
    var s=quiz.score,rank=s>=90?'قبطان الكوكب':(s>=70?'ملّاح ماهر':(s>=40?'مستكشف':'بحّار مبتدئ'));
    el.innerHTML='<h3 class="h3">انتهى التحدّي</h3><div class="big">'+s+'<span style="font-size:22px;color:var(--ink-2)"> / 100</span></div><p class="fact">لقبك الآن: <b>'+rank+'</b>. أفضل نتيجة لك '+Math.max(s,bestScore())+'.</p><div class="row"><button class="btn primary" id="qAgain" type="button">العب من جديد</button><button class="btn" id="qExplore" type="button">عد إلى الاستكشاف</button></div>';
    $('#qAgain').onclick=startQuiz;$('#qExplore').onclick=function(){quiz=null;setTab('explore');};return;
  }
  var q=quiz.qs[quiz.i];
  el.innerHTML='<div class="qhead"><span>السؤال <b>'+(quiz.i+1)+'</b> من 10</span><span>النقاط: <b>'+quiz.score+'</b></span></div><div class="bar"><i style="width:'+(quiz.i/10*100)+'%"></i></div><p class="qprompt">'+qPrompt(q)+'</p><div class="fb '+(quiz.fbClass||'')+'" aria-live="polite">'+(quiz.fb||'')+'</div><div class="row">'+(quiz.answered?'<button class="btn primary" id="qNext" type="button">'+(quiz.i===9?'عرض النتيجة':'السؤال التالي')+'</button>':'<button class="btn" id="qHint" type="button"'+(quiz.hinted?' disabled':'')+'>تلميح</button>')+'<button class="btn" id="qQuit" type="button">إنهاء</button></div>';
  var nx=$('#qNext');if(nx)nx.onclick=nextQ;
  var h=$('#qHint');if(h)h.onclick=hintQ;
  $('#qQuit').onclick=function(){quiz=null;renderQuiz();};
}
function startQuiz(){
  stopTour();autoSpin=false;$('#tgSpin').setAttribute('aria-pressed','false');
  quiz={qs:buildQs(),i:0,score:0,answered:false,hinted:false,done:false,fb:'',fbClass:''};
  selCont=null;selLm=null;flyTo(HOME.lon,HOME.lat,1);renderQuiz();
}
function hintQ(){
  var t=qTarget(quiz.qs[quiz.i]);quiz.hinted=true;
  flyTo(t.lon+(Math.random()*40-20),t.lat+(Math.random()*20-10),1);
  quiz.fb='لمحة: الهدف قريب من منتصف الكرة.';quiz.fbClass='';renderQuiz();
}
function nextQ(){
  if(quiz.i>=9){quiz.done=true;saveBest(quiz.score);selCont=null;selLm=null;renderQuiz();return;}
  quiz.i++;quiz.answered=false;quiz.hinted=false;quiz.fb='';quiz.fbClass='';selCont=null;selLm=null;renderQuiz();
}
function answer(lo,la){
  if(quiz.answered)return;
  var q=quiz.qs[quiz.i],id=identify(lo,la),ok=false;
  if(q.t==='cont')ok=id.type==='cont'&&id.id===q.id;
  else if(q.t==='ocean')ok=id.type==='ocean'&&id.id===q.id;
  else{var l=lmById(q.id);ok=gcDist(lo,la,l.lon,l.lat)<7.5;}
  var t=qTarget(q);quiz.answered=true;
  if(ok){
    quiz.score+=quiz.hinted?5:10;quiz.fb='صحيح! أحسنت.';quiz.fbClass='ok';
    ripple={lon:lo,lat:la,t0:performance.now(),col:'#4fd08a'};
  }else{
    quiz.fb='ليست هذه. ضغطت على '+nameOf(id)+'، وهذا هو المكان الصحيح.';quiz.fbClass='no';
    ripple={lon:lo,lat:la,t0:performance.now(),col:'#ff7d6e'};
    if(q.t==='cont')selCont=q.id;else if(q.t==='lm')selLm=q.id;
    flyTo(t.lon,t.lat,q.t==='lm'?1.3:1);
  }
  renderQuiz();
}

/* ---------- pointer input ---------- */
function pdist(){var k=Object.keys(pointers);if(k.length<2)return 0;var a=pointers[k[0]],b=pointers[k[1]];return Math.hypot(a.x-b.x,a.y-b.y);}
canvas.addEventListener('pointerdown',function(e){
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  var r=canvas.getBoundingClientRect();
  pointers[e.pointerId]={x:e.clientX-r.left,y:e.clientY-r.top};
  fly=null;vel.x=vel.y=0;stopTour();
  $('#hint').classList.add('gone');
  var n=Object.keys(pointers).length;
  if(n===1)drag={x:e.clientX,y:e.clientY,moved:0,t:performance.now()};
  else if(n===2){drag=null;pinch={d:pdist(),z:zoom};}
});
canvas.addEventListener('pointermove',function(e){
  if(!pointers[e.pointerId])return;
  var r=canvas.getBoundingClientRect();
  pointers[e.pointerId]={x:e.clientX-r.left,y:e.clientY-r.top};
  if(pinch&&Object.keys(pointers).length>=2){zoom=clamp(pinch.z*pdist()/pinch.d,.75,2.8);return;}
  if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
  var k=(180/Math.PI)/R*.9;
  lon0-=dx*k;lat0=clamp(lat0+dy*k,-85,85);
  vel.x=dx*k*.6;vel.y=dy*k*.6;
});
function endPointer(e){
  var wasTap=drag&&drag.moved<7&&performance.now()-drag.t<600;
  var r=canvas.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  delete pointers[e.pointerId];
  if(Object.keys(pointers).length<2)pinch=null;
  if(Object.keys(pointers).length===0){
    drag=null;
    if(wasTap&&e.type==='pointerup'){vel.x=vel.y=0;handleTap(px,py);}
  }
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',function(e){e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.1:.91),.75,2.8);fly=null;},{passive:false});
canvas.addEventListener('keydown',function(e){
  var m={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,8],ArrowDown:[0,-8]}[e.key];
  if(m){e.preventDefault();fly=null;lon0+=m[0];lat0=clamp(lat0+m[1],-85,85);}
  else if(e.key==='+'||e.key==='='){zoom=clamp(zoom*1.12,.75,2.8);}
  else if(e.key==='-'){zoom=clamp(zoom/1.12,.75,2.8);}
});
function handleTap(px,py){
  var ll=screenToLL(px,py);if(!ll)return;
  if(quizActive()){answer(ll.lon,ll.lat);return;}
  if(tab==='quiz'){ripple={lon:ll.lon,lat:ll.lat,t0:performance.now(),col:'#fff'};return;}
  var hit=null,best=22;
  LM.forEach(function(l){var v=viewVec(l.lon,l.lat);if(v.z<.05)return;var d=Math.hypot(px-(cx+R*v.x),py-(cy-R*v.y));if(d<best){best=d;hit=l;}});
  if(hit){selectLm(hit,false);return;}
  selectId(identify(ll.lon,ll.lat),ll);
}

/* ---------- controls ---------- */
$('#zIn').onclick=function(){fly=null;zoom=clamp(zoom*1.25,.75,2.8);};
$('#zOut').onclick=function(){fly=null;zoom=clamp(zoom/1.25,.75,2.8);};
$('#zHome').onclick=function(){stopTour();flyTo(HOME.lon,HOME.lat,1);};
function bindToggle(id,fn){var b=$(id);b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on?'true':'false');fn(on);});}
bindToggle('#tgLabels',function(v){showLabels=v;});
bindToggle('#tgGrid',function(v){showGrid=v;});
bindToggle('#tgNight',function(v){showNight=v;});
bindToggle('#tgSpin',function(v){autoSpin=v;});
bindToggle('#tgVoice',function(v){voice=v;if(!v)stopSpeak();});
$('#tm').addEventListener('input',function(){tmLive=false;manualMin=+this.value;var m=manualMin;$('#tmOut').textContent=pad(Math.floor(m/60))+':'+pad(m%60);});
$('#tmLive').onclick=function(){tmLive=true;};

/* ---------- sizing + start ---------- */
function resize(){
  var r=stage.getBoundingClientRect();cssW=Math.max(1,r.width);cssH=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
resize();setView();welcome();
setTimeout(function(){flyTo(HOME.lon,HOME.lat,HOME.zoom,null,2400);},250);
requestAnimationFrame(frame);
})();
</script>
